<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Wanas Gallery{% endblock %} — Wanas staff</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..600&family=Jost:wght@300..600&family=IBM+Plex+Mono:wght@400;500&display=swap");

    :root {
      /* Same tokens as web/store — cream ground, forest action, blush/sage/gold accents. */
      --cream-50:#FDFBF9; --cream-100:#FAF7F4; --cream-200:#F4EFE9; --cream-300:#EBE3D9;
      --ink-900:#141614; --ink-700:#3A3E3B; --ink-500:#6B716C; --ink-300:#A9AFA9;
      --forest-900:#14261F; --forest-700:#1F3A31; --forest-500:#2F5546; --forest-200:#B9CBC1; --forest-50:#EAF0EC;
      --blush-500:#D98F92; --blush-400:#E4A7A8; --blush-300:#EFC3C3; --blush-100:#F8E3E2;
      --sage-400:#A8BBA0; --sage-200:#CEDAC7; --gold-400:#E4C77B; --gold-100:#F6EBCF;

      --surface-page:var(--cream-100); --surface-card:#FFFFFF; --surface-sunken:var(--cream-200);
      --text-body:var(--ink-700); --text-strong:var(--ink-900); --text-muted:var(--ink-500); --text-inverse:var(--cream-50);
      --line:var(--cream-300); --line-strong:var(--ink-300);
      --action-primary:var(--forest-700); --action-primary-hover:var(--forest-900);
      --focus-ring:var(--forest-500);
      --status-success:#3F7D5C; --status-error:#B4514E; --status-lowstock:var(--gold-400);

      --font-display:"Playfair Display",Georgia,serif;
      --font-sans:"Jost","Helvetica Neue",sans-serif;
      --font-mono:"IBM Plex Mono",ui-monospace,monospace;
      --r-sm:10px; --r-md:14px; --r-lg:20px; --r-pill:999px;
      --shadow-1:0 1px 2px rgba(20,38,31,.04); --shadow-2:0 6px 18px rgba(20,38,31,.06);

      /* back-compat names some inline styles below still reference */
      --ink:var(--text-strong); --muted:var(--text-muted); --bg:var(--surface-page);
      --accent:var(--forest-700); --bad:var(--status-error); --good:var(--status-success);
    }
    * { box-sizing: border-box; }
    body { margin:0; font:300 15px/1.6 var(--font-sans); color:var(--text-body); background:var(--surface-page); }
    a { color:var(--forest-700); }
    a:hover { color:var(--forest-900); }
    :focus-visible { outline:2px solid var(--focus-ring); outline-offset:2px; border-radius:4px; }

    header {
      background:rgba(253,251,249,.85); backdrop-filter:blur(10px); position:sticky; top:0; z-index:10;
      border-bottom:1px solid var(--line); padding:.85rem 1.3rem; display:flex; gap:1.4rem; align-items:center; flex-wrap:wrap;
    }
    header .brand {
      font:400 20px var(--font-display); letter-spacing:.16em; text-transform:uppercase; color:var(--text-strong);
    }
    nav { display:flex; gap:1.1rem; flex-wrap:wrap; }
    nav a {
      text-decoration:none; color:var(--text-body); font-size:.88rem; padding-bottom:3px;
      border-bottom:1px solid transparent; transition:color .2s, border-color .2s;
    }
    nav a:hover { color:var(--text-strong); border-bottom-color:var(--forest-200); }
    .badge {
      background:var(--blush-400); color:var(--forest-900); border-radius:var(--r-pill);
      padding:0 .5rem; font-size:.74rem; font-weight:500; margin-left:.3rem;
    }
    .spacer { flex:1; }
    main { padding:2rem 1.3rem 4rem; max-width:1200px; margin:0 auto; }

    h1 {
      font:400 clamp(24px,3vw,32px)/1.2 var(--font-display); letter-spacing:-.01em;
      color:var(--text-strong); margin:.2rem 0 1.4rem;
    }
    h2 {
      font:500 1rem var(--font-sans); text-transform:uppercase; letter-spacing:.06em;
      color:var(--text-muted); margin:2rem 0 .8rem;
    }

    table { border-collapse:collapse; width:100%; background:var(--surface-card); border:1px solid var(--line); border-radius:var(--r-md); overflow:hidden; box-shadow:var(--shadow-1); }
    th, td { text-align:left; padding:.65rem .8rem; border-bottom:1px solid var(--line); vertical-align:middle; }
    th {
      background:var(--surface-sunken); font-weight:500; font-size:.72rem; text-transform:uppercase;
      letter-spacing:.08em; color:var(--text-muted);
    }
    tr:last-child td { border-bottom:none; }
    tbody tr:hover td { background:var(--forest-50); }

    .msg { background:var(--gold-100); border:1px solid #E4C77B66; border-radius:var(--r-sm); padding:.65rem .9rem; margin-bottom:1.2rem; }
    .err { background:var(--blush-100); border-color:#D98F9266; }
    .muted { color:var(--text-muted); font-size:.88rem; }

    .pill {
      display:inline-block; padding:.15rem .65rem; border-radius:var(--r-pill); font-size:.78rem;
      font-weight:500; border:1px solid var(--line); background:var(--surface-card); color:var(--text-body);
    }
    .pill.sold_out, .pill.Cancelled { background:var(--blush-100); border-color:#D98F9255; color:var(--status-error); }
    .pill.low_stock { background:var(--gold-100); border-color:#E4C77B55; color:#8A6D1F; }
    .pill.in_stock, .pill.Delivered { background:var(--sage-200); border-color:#A8BBA055; color:var(--status-success); }

    input, select, textarea, button {
      font:300 15px var(--font-sans); padding:.5rem .8rem; border:1px solid var(--line);
      border-radius:var(--r-pill); background:var(--surface-card); color:var(--text-strong);
    }
    textarea { border-radius:var(--r-sm); }
    input:focus, select:focus, textarea:focus { border-color:var(--focus-ring); }
    input[type=number] { width:5.5rem; }
    button {
      cursor:pointer; background:var(--action-primary); color:var(--text-inverse); border-color:var(--action-primary);
      font-weight:500; font-size:.85rem; letter-spacing:.02em; transition:background .2s;
    }
    button:hover { background:var(--action-primary-hover); }
    button.secondary { background:transparent; color:var(--text-strong); border-color:var(--line-strong); }
    button.secondary:hover { background:var(--surface-sunken); }
    button.danger { background:var(--status-error); border-color:var(--status-error); }
    button.danger:hover { background:#9c4340; }
    form.inline { display:inline; }

    .card { background:var(--surface-card); border-radius:var(--r-lg); box-shadow:var(--shadow-2); padding:1.3rem; margin-bottom:1.2rem; }
    .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:1rem; }

    .chat { max-height:460px; overflow-y:auto; }
    .chat .turn { padding:.5rem .7rem; margin-bottom:.4rem; border-radius:var(--r-sm); }
    .chat .user { background:var(--surface-sunken); }
    .chat .assistant { background:var(--forest-50); }
    .chat .tool { background:var(--cream-200); color:var(--text-muted); font-family:var(--font-mono); font-size:.8rem; }

    code { font-family:var(--font-mono); font-size:.85em; }
    @media (max-width:760px) { .grid2 { grid-template-columns:1fr; } }
  </style>
</head>
<body>
{% if staff %}
<header>
  <span class="brand">WANAS</span>
  <nav>
    <a href="/dashboard">Home</a>
    <a href="/dashboard/orders">Orders</a>
    <a href="/dashboard/products">Products</a>
    <a href="/dashboard/clients">Clients</a>
    <a href="/dashboard/shipping">Shipping</a>
    <a href="/dashboard/size-charts">Size charts</a>
    <a href="/dashboard/queues">Queues{% if counts and counts.total %}<span class="badge">{{ counts.total }}</span>{% endif %}</a>
    <a href="/dashboard/audit">Audit</a>
  </nav>
  <span class="spacer"></span>
  <span class="muted">{{ staff.username }}</span>
  <form class="inline" method="post" action="/dashboard/logout">
    <input type="hidden" name="{{ csrf_field }}" value="{{ csrf }}">
    <button class="secondary" type="submit">Log out</button>
  </form>
</header>
{% endif %}
<main>
  {% if message %}<div class="msg">{{ message }}</div>{% endif %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
