<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<script>
/* Before first paint, like the theme: switching `dir` after the page has
   drawn flips the entire layout in front of the reader. The dashboard's CSS
   is written in logical properties throughout (inset-inline-start,
   text-align: start, margin-inline), so this one attribute is the whole
   right-to-left / left-to-right switch. */
(function () {
  var lang = "ar";
  try { lang = localStorage.getItem("wanas.lang") === "en" ? "en" : "ar"; } catch (e) { /* private window */ }
  var root = document.documentElement;
  root.lang = lang;
  root.dir = lang === "en" ? "ltr" : "rtl";
})();
</script>
<title>Wanas Gallery — نظام إدارة المتجر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   ونس — Business OS
   A pastel operating system for an Egyptian streetwear shop.

   Palette is "desert dusk": warm sand ground, clay/apricot as the brand
   accent, Nile teal for anything healthy, dusty lilac for the messaging
   side of the business, and a deep aubergine ink both themes read against.
   Every colour is a token; nothing below re-declares a raw hex.
   ========================================================================== */

:root {
  color-scheme: light;

  --ground:        #F7F3EE;
  --ground-2:      #F1EAE2;
  --surface:       #FFFFFF;
  --surface-2:     #FBF8F5;
  --surface-3:     #F3EDE6;
  --line:          #E7DDD2;
  --line-strong:   #D6C8B9;

  --ink:           #241E29;
  --ink-2:         #4C4353;
  --ink-3:         #6F6579;
  --ink-inv:       #FFFFFF;

  --clay:          #C4653C;
  --clay-soft:     #F6DCCB;
  --clay-tint:     #FCEFE5;
  --teal:          #17756B;
  --teal-soft:     #CBE7E1;
  --teal-tint:     #E8F5F2;
  --lilac:         #6B4E9B;
  --lilac-soft:    #DED3F0;
  --lilac-tint:    #F2ECFB;
  --amber:         #96660B;
  --amber-soft:    #F7E3B8;
  --amber-tint:    #FDF4E0;
  --rose:          #B33A54;
  --rose-soft:     #F6D2DA;
  --rose-tint:     #FCEAEE;
  --sky:           #2C6796;
  --sky-soft:      #CFE0EF;
  --sky-tint:      #EAF2F9;

  --shadow-1: 0 1px 2px rgba(45,30,20,.05), 0 1px 3px rgba(45,30,20,.04);
  --shadow-2: 0 2px 4px rgba(45,30,20,.05), 0 8px 20px -8px rgba(45,30,20,.14);
  --shadow-3: 0 10px 40px -12px rgba(45,30,20,.26), 0 2px 8px rgba(45,30,20,.06);
  --ring: 0 0 0 3px rgba(196,101,60,.28);

  --r-xs: 6px; --r-sm: 9px; --r-md: 13px; --r-lg: 18px; --r-xl: 26px; --r-pill: 999px;
  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 24px; --s-6: 32px; --s-7: 48px;

  --rail: 264px;
  --header-h: 62px;

  --t-fast: 120ms cubic-bezier(.2,.7,.3,1);
  --t-mid:  220ms cubic-bezier(.2,.7,.3,1);
  --t-slow: 420ms cubic-bezier(.16,.84,.32,1);

  --font-ar: "IBM Plex Sans Arabic", "Noto Naskh Arabic", "Segoe UI", Tahoma, system-ui, sans-serif;
  --font-num: "Inter", "IBM Plex Sans Arabic", system-ui, sans-serif;
}

:root[data-theme="dark"] {
  color-scheme: dark;

  --ground:        #14111A;
  --ground-2:      #191521;
  --surface:       #1E1A28;
  --surface-2:     #241F30;
  --surface-3:     #2C2639;
  --line:          #322B41;
  --line-strong:   #453C58;

  --ink:           #F2EDF6;
  --ink-2:         #CFC6DB;
  --ink-3:         #A79CB6;
  --ink-inv:       #17131F;

  --clay:          #F0A87C;
  --clay-soft:     #4A3123;
  --clay-tint:     #2E2119;
  --teal:          #6FCFBE;
  --teal-soft:     #1E4640;
  --teal-tint:     #17302C;
  --lilac:         #BFA6EE;
  --lilac-soft:    #382B52;
  --lilac-tint:    #261F38;
  --amber:         #E9BE6A;
  --amber-soft:    #4A3A18;
  --amber-tint:    #2E2617;
  --rose:          #F2919F;
  --rose-soft:     #4C2129;
  --rose-tint:     #31191E;
  --sky:           #8CBEE6;
  --sky-soft:      #22374A;
  --sky-tint:      #1A2530;

  --shadow-1: 0 1px 2px rgba(0,0,0,.4);
  --shadow-2: 0 2px 6px rgba(0,0,0,.4), 0 10px 24px -10px rgba(0,0,0,.6);
  --shadow-3: 0 16px 48px -16px rgba(0,0,0,.75), 0 2px 10px rgba(0,0,0,.4);
  --ring: 0 0 0 3px rgba(240,168,124,.3);
}

/* ==========================================================================
   base
   ========================================================================== */

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }

body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--font-ar);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

/* The one texture in the product: a dusk wash so flat pastel cards have
   something to sit on. */
body::before {
  content: "";
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background:
    radial-gradient(1100px 520px at 88% -8%, var(--clay-tint), transparent 62%),
    radial-gradient(900px 480px at 4% 4%, var(--lilac-tint), transparent 58%);
  opacity: .85;
}

h1, h2, h3, h4 { margin: 0; font-weight: 600; line-height: 1.3; letter-spacing: -.01em; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--clay); text-decoration: none; }
a:hover { text-decoration: underline; }

/* Numbers are half the content here: tabular, latin, never reflowed by the
   RTL context they sit inside. */
.num, .kpi-value, .metric {
  font-family: var(--font-num);
  font-variant-numeric: tabular-nums;
  direction: ltr;
  unicode-bidi: isolate;
}

:focus-visible { outline: none; box-shadow: var(--ring); border-radius: var(--r-sm); }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: var(--r-pill); border: 3px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-thumb:hover { background: var(--ink-3); background-clip: content-box; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important; animation-iteration-count: 1 !important;
    transition-duration: .01ms !important; scroll-behavior: auto !important;
  }
}

.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* ==========================================================================
   app frame
   ========================================================================== */

#app { position: relative; z-index: 1; display: grid; grid-template-columns: var(--rail) 1fr; height: 100dvh; }
#app[hidden] { display: none; }

#rail {
  display: flex; flex-direction: column; min-height: 0;
  background: color-mix(in srgb, var(--surface) 78%, transparent);
  backdrop-filter: blur(14px);
  border-inline-start: 1px solid var(--line);
  padding: var(--s-4) var(--s-3);
  gap: var(--s-4);
}

.brand { display: flex; align-items: center; gap: var(--s-3); padding: var(--s-2) var(--s-3) 0; }
.brand .mark {
  width: 38px; height: 38px; border-radius: 12px; flex: 0 0 auto;
  object-fit: contain; background: var(--surface-3);
  box-shadow: var(--shadow-2);
}
/* The brand name is a name, not a label: it reads "Wanas Gallery" in both
   languages, so it is never routed through `t()`. Latin either way, so it
   gets the Latin face rather than the Arabic one. */
.brand .name { font-family: var(--font-num); }
.brand .name { font-size: 15px; font-weight: 700; letter-spacing: -.01em; }
.brand .role { font-size: 11.5px; color: var(--ink-3); margin-top: -3px; }

.rail-search {
  display: flex; align-items: center; gap: var(--s-2);
  padding: 9px var(--s-3);
  background: var(--surface-3); border: 1px solid transparent;
  border-radius: var(--r-md); color: var(--ink-3); font-size: 13px;
  transition: border-color var(--t-fast), background var(--t-fast);
  width: 100%;
}
.rail-search:hover { border-color: var(--line-strong); background: var(--surface-2); }
.rail-search kbd {
  margin-inline-start: auto; font-family: var(--font-num); font-size: 10.5px;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-xs); padding: 2px 6px; color: var(--ink-3);
}

nav#nav { flex: 1; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; gap: 2px; }
.nav-group { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; color: var(--ink-3); padding: var(--s-4) var(--s-3) var(--s-1); }
.nav-item {
  position: relative; display: flex; align-items: center; gap: 10px;
  padding: 9px var(--s-3); border-radius: var(--r-md);
  background: none; border: 0; width: 100%; text-align: start;
  color: var(--ink-2); font-size: 13.5px; font-weight: 500;
  transition: background var(--t-fast), color var(--t-fast);
}
.nav-item:hover { background: var(--surface-3); color: var(--ink); }
.nav-item .ic { flex: 0 0 auto; opacity: .85; }
.nav-item .label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-item[aria-current="page"] { background: var(--clay-tint); color: var(--clay); font-weight: 600; }
.nav-item[aria-current="page"] .ic { opacity: 1; }
.nav-item[aria-current="page"]::before {
  content: ""; position: absolute; inset-inline-start: 0; top: 18%; bottom: 18%;
  width: 3px; border-radius: var(--r-pill);
  background: linear-gradient(var(--clay), var(--lilac));
}
.nav-item .count {
  font-family: var(--font-num); font-size: 11px; font-weight: 700;
  min-width: 20px; text-align: center; padding: 1px 6px; border-radius: var(--r-pill);
  background: var(--surface-3); color: var(--ink-3);
}
.nav-item .count[data-tone="urgent"] { background: var(--rose); color: #fff; }
.nav-item .count[data-tone="warn"]   { background: var(--amber-soft); color: var(--amber); }
.nav-item .count[hidden] { display: none; }

.rail-foot { display: flex; align-items: center; gap: var(--s-2); padding-top: var(--s-3); border-top: 1px solid var(--line); }
.rail-foot .who { flex: 1; min-width: 0; }
.rail-foot .who .u { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rail-foot .who .s { font-size: 11px; color: var(--ink-3); display: flex; align-items: center; gap: 5px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--teal); flex: 0 0 auto; }
.dot[data-tone="bad"] { background: var(--rose); }
.dot[data-tone="warn"] { background: var(--amber); }

#main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }

#topbar {
  height: var(--header-h); flex: 0 0 auto;
  display: flex; align-items: center; gap: var(--s-3);
  padding: 0 var(--s-5);
  border-bottom: 1px solid var(--line);
  background: color-mix(in srgb, var(--ground) 82%, transparent);
  backdrop-filter: blur(12px);
}
#topbar .titles { min-width: 0; flex: 1; }
#topbar h1 { font-size: 18px; }
#topbar .sub { font-size: 12px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#topbar .actions { display: flex; align-items: center; gap: var(--s-2); }
#menuBtn { display: none; }

#viewport { flex: 1; min-height: 0; overflow: hidden; display: flex; }
.view { flex: 1; min-width: 0; min-height: 0; display: none; }
.view.active { display: flex; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; padding: var(--s-5); }
.wrap { max-width: 1440px; margin: 0 auto; width: 100%; }

/* ==========================================================================
   primitives
   ========================================================================== */

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  min-height: 38px; padding: 0 var(--s-4);
  border-radius: var(--r-md); border: 1px solid var(--line-strong);
  background: var(--surface); color: var(--ink);
  font-size: 13.5px; font-weight: 600; white-space: nowrap;
  box-shadow: var(--shadow-1);
  transition: background var(--t-fast), border-color var(--t-fast), color var(--t-fast), box-shadow var(--t-fast);
}
.btn:hover { background: var(--surface-3); border-color: var(--ink-3); }
.btn:active { box-shadow: none; }
.btn[disabled], .btn[aria-disabled="true"] { opacity: .5; pointer-events: none; }
.btn.primary { background: var(--clay); border-color: var(--clay); color: #fff; }
.btn.primary:hover { filter: brightness(1.06); background: var(--clay); }
:root[data-theme="dark"] .btn.primary { color: var(--ink-inv); }
.btn.ghost { background: transparent; border-color: transparent; box-shadow: none; color: var(--ink-2); }
.btn.ghost:hover { background: var(--surface-3); color: var(--ink); }
.btn.danger { color: var(--rose); border-color: var(--rose-soft); background: var(--rose-tint); }
.btn.danger:hover { background: var(--rose-soft); border-color: var(--rose); }
.btn.sm { min-height: 30px; padding: 0 10px; font-size: 12.5px; border-radius: var(--r-sm); }
.btn.icon { width: 38px; padding: 0; }
.btn.sm.icon { width: 30px; }

.field {
  display: flex; align-items: center; min-height: 38px;
  padding: 0 var(--s-3); gap: var(--s-2);
  background: var(--surface); border: 1px solid var(--line-strong);
  border-radius: var(--r-md); box-shadow: var(--shadow-1);
  transition: border-color var(--t-fast), box-shadow var(--t-fast);
}
.field:focus-within { border-color: var(--clay); box-shadow: var(--ring); }
.field input, .field select {
  flex: 1; min-width: 0; border: 0; background: none; outline: none;
  font-size: 13.5px; padding: 8px 0;
}
.field .ic { color: var(--ink-3); flex: 0 0 auto; }

input.inp, select.inp, textarea.inp {
  width: 100%; padding: 9px var(--s-3);
  background: var(--surface); border: 1px solid var(--line-strong);
  border-radius: var(--r-md); font-size: 13.5px; outline: none;
  transition: border-color var(--t-fast), box-shadow var(--t-fast);
}
input.inp:focus, select.inp:focus, textarea.inp:focus { border-color: var(--clay); box-shadow: var(--ring); }
textarea.inp { resize: vertical; min-height: 84px; line-height: 1.6; }
label.lbl { display: block; font-size: 12px; font-weight: 600; color: var(--ink-2); margin-bottom: 5px; }
.hint { font-size: 11.5px; color: var(--ink-3); margin-top: 4px; }

.seg {
  display: inline-flex; gap: 2px; padding: 3px;
  background: var(--surface-3); border-radius: var(--r-md); border: 1px solid var(--line);
}
.seg button {
  border: 0; background: none; border-radius: var(--r-sm);
  padding: 6px 12px; font-size: 12.5px; font-weight: 600; color: var(--ink-3);
  min-height: 30px; transition: background var(--t-fast), color var(--t-fast);
}
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1); }

.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 10px; border-radius: var(--r-pill);
  font-size: 11.5px; font-weight: 600; white-space: nowrap;
  background: var(--surface-3); color: var(--ink-2); border: 1px solid transparent;
}
.chip[data-tone="teal"]  { background: var(--teal-tint);  color: var(--teal);  border-color: var(--teal-soft); }
.chip[data-tone="clay"]  { background: var(--clay-tint);  color: var(--clay);  border-color: var(--clay-soft); }
.chip[data-tone="lilac"] { background: var(--lilac-tint); color: var(--lilac); border-color: var(--lilac-soft); }
.chip[data-tone="amber"] { background: var(--amber-tint); color: var(--amber); border-color: var(--amber-soft); }
.chip[data-tone="rose"]  { background: var(--rose-tint);  color: var(--rose);  border-color: var(--rose-soft); }
.chip[data-tone="sky"]   { background: var(--sky-tint);   color: var(--sky);   border-color: var(--sky-soft); }

/* Status carries a shape as well as a colour: colour is never the only
   indicator (a dot for live, a ring for waiting, a bar for stopped). */
.chip .glyph { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: 0 0 auto; }
.chip[data-shape="ring"] .glyph { background: none; border: 2px solid currentColor; }
.chip[data-shape="bar"] .glyph { border-radius: 1px; height: 3px; width: 9px; }

.card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-lg); box-shadow: var(--shadow-1);
  overflow: hidden;
}
.card-head {
  display: flex; align-items: center; gap: var(--s-3);
  padding: var(--s-4) var(--s-5); border-bottom: 1px solid var(--line);
}
.card-head h2 { font-size: 14.5px; flex: 1; min-width: 0; }
.card-head .sub { font-size: 11.5px; color: var(--ink-3); font-weight: 400; }
.card-body { padding: var(--s-5); }
.card-body.flush { padding: 0; }

.grid { display: grid; gap: var(--s-4); }
.g-kpi  { grid-template-columns: repeat(auto-fit, minmax(215px, 1fr)); }
.g-2    { grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }
.g-3    { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.stack  { display: flex; flex-direction: column; gap: var(--s-4); }
.row    { display: flex; align-items: center; gap: var(--s-2); flex-wrap: wrap; }
.row.tight { gap: var(--s-1); }
.spacer { flex: 1; }

/* --- KPI tile ----------------------------------------------------------- */

.kpi { position: relative; padding: var(--s-4) var(--s-5) var(--s-5); }
.kpi::before {
  content: ""; position: absolute; inset-inline: 0; top: 0; height: 3px;
  background: linear-gradient(90deg, var(--accent, var(--clay)), transparent);
}
.kpi .kpi-label { font-size: 12px; color: var(--ink-3); font-weight: 600; display: flex; align-items: center; gap: 6px; }
.kpi .kpi-value { font-size: 30px; font-weight: 700; letter-spacing: -.03em; line-height: 1.15; margin-top: 6px; }
.kpi .kpi-foot { display: flex; align-items: center; gap: 7px; margin-top: 7px; font-size: 11.5px; color: var(--ink-3); }
.kpi .spark { margin-top: var(--s-3); height: 34px; }
.delta { display: inline-flex; align-items: center; gap: 3px; font-weight: 700; font-family: var(--font-num); direction: ltr; }
.delta[data-dir="up"]   { color: var(--teal); }
.delta[data-dir="down"] { color: var(--rose); }
.delta[data-dir="flat"] { color: var(--ink-3); }

/* --- table -------------------------------------------------------------- */

.tablewrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 620px; }
table.tbl th {
  text-align: start; font-size: 11px; font-weight: 700; letter-spacing: .03em;
  color: var(--ink-3); padding: 10px var(--s-4); background: var(--surface-2);
  border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 1;
  white-space: nowrap;
}
table.tbl td { padding: 11px var(--s-4); border-bottom: 1px solid var(--line); vertical-align: middle; }
table.tbl tbody tr { transition: background var(--t-fast); }
table.tbl tbody tr[data-clickable] { cursor: pointer; }
table.tbl tbody tr:hover { background: var(--surface-2); }
table.tbl tbody tr:last-child td { border-bottom: 0; }
table.tbl td.num { font-size: 13px; font-weight: 600; }
.cellmain { font-weight: 600; }
.cellsub { font-size: 11.5px; color: var(--ink-3); }
.thumb { width: 38px; height: 38px; border-radius: var(--r-sm); object-fit: cover; background: var(--surface-3); flex: 0 0 auto; }
.avatar {
  width: 36px; height: 36px; border-radius: var(--r-pill); flex: 0 0 auto;
  display: grid; place-items: center; font-weight: 700; font-size: 13px;
  background: var(--lilac-tint); color: var(--lilac);
  font-family: var(--font-num);
}
.avatar[data-ch="whatsapp"] { background: var(--teal-tint); color: var(--teal); }
.avatar[data-ch="instagram_dm"] { background: var(--lilac-tint); color: var(--lilac); }

/* --- states ------------------------------------------------------------- */

.empty { display: flex; flex-direction: column; align-items: center; gap: var(--s-3); padding: var(--s-7) var(--s-5); text-align: center; color: var(--ink-3); }
.empty .ic { color: var(--line-strong); }
.empty .t { font-weight: 600; color: var(--ink-2); font-size: 14px; }
.empty .d { font-size: 12.5px; max-width: 38ch; }

.banner {
  display: flex; align-items: flex-start; gap: var(--s-3);
  padding: var(--s-3) var(--s-4); border-radius: var(--r-md);
  font-size: 12.5px; border: 1px solid;
  background: var(--amber-tint); color: var(--amber); border-color: var(--amber-soft);
}
.banner[data-tone="bad"]  { background: var(--rose-tint); color: var(--rose); border-color: var(--rose-soft); }
.banner[data-tone="info"] { background: var(--sky-tint); color: var(--sky); border-color: var(--sky-soft); }
.banner .ic { flex: 0 0 auto; margin-top: 1px; }
.banner strong { font-weight: 700; }

.skel { position: relative; overflow: hidden; background: var(--surface-3); border-radius: var(--r-sm); }
.skel::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--surface) 70%, transparent), transparent);
  animation: sweep 1.3s infinite;
}
@keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
.skel-row { height: 14px; margin: 13px var(--s-4); }
.skel-tile { height: 118px; border-radius: var(--r-lg); }

.spin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line-strong); border-top-color: var(--clay); animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ==========================================================================
   inbox
   ========================================================================== */

#view-inbox { display: none; }
#view-inbox.active { display: grid; grid-template-columns: 340px 1fr; min-width: 0; }
#view-inbox.with-context.active { grid-template-columns: 340px 1fr 300px; }

.inbox-list { display: flex; flex-direction: column; min-height: 0; border-inline-start: 1px solid var(--line); background: var(--surface); }
.inbox-tools { padding: var(--s-3) var(--s-4); display: flex; flex-direction: column; gap: var(--s-2); border-bottom: 1px solid var(--line); }
.inbox-filters { display: flex; gap: var(--s-1); overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.inbox-filters::-webkit-scrollbar { display: none; }
.fchip {
  border: 1px solid var(--line); background: var(--surface-2); color: var(--ink-2);
  border-radius: var(--r-pill); padding: 5px 11px; font-size: 12px; font-weight: 600;
  white-space: nowrap; min-height: 30px; display: inline-flex; align-items: center; gap: 5px;
  transition: background var(--t-fast), color var(--t-fast), border-color var(--t-fast);
}
.fchip:hover { border-color: var(--line-strong); }
.fchip[aria-pressed="true"] { background: var(--ink); color: var(--ground); border-color: var(--ink); }
.fchip .n { font-family: var(--font-num); font-size: 11px; opacity: .75; }

#convList { flex: 1; min-height: 0; overflow-y: auto; }
.conv {
  display: grid; grid-template-columns: auto 1fr; gap: var(--s-3);
  padding: var(--s-3) var(--s-4); width: 100%; text-align: start;
  border: 0; border-bottom: 1px solid var(--line); background: none;
  transition: background var(--t-fast);
  position: relative;
}
.conv:hover { background: var(--surface-2); }
.conv[aria-selected="true"] { background: var(--clay-tint); }
.conv[aria-selected="true"]::before {
  content: ""; position: absolute; inset-inline-start: 0; top: 0; bottom: 0; width: 3px;
  background: linear-gradient(var(--clay), var(--lilac));
}
.conv .meta { min-width: 0; }
.conv .line1 { display: flex; align-items: center; gap: 6px; }
.conv .nm { font-weight: 600; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.conv .tm { margin-inline-start: auto; font-size: 10.5px; color: var(--ink-3); font-family: var(--font-num); flex: 0 0 auto; }
.conv .pv { font-size: 12px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
.conv .tags { display: flex; gap: 4px; margin-top: 5px; flex-wrap: wrap; }

/* --- thread ------------------------------------------------------------- */

.thread { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--ground-2); }
.thread-head {
  flex: 0 0 auto; display: flex; align-items: center; gap: var(--s-3);
  padding: var(--s-3) var(--s-4); border-bottom: 1px solid var(--line);
  background: var(--surface);
}
.thread-head .who { min-width: 0; flex: 1; }
.thread-head .who .n { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.thread-head .who .s { font-size: 11.5px; color: var(--ink-3); display: flex; align-items: center; gap: 6px; }

#log { flex: 1; min-height: 0; overflow-y: auto; padding: var(--s-5) var(--s-5) var(--s-4); display: flex; flex-direction: column; gap: var(--s-2); }
.bubble {
  max-width: min(74%, 640px); padding: 9px var(--s-3) 7px;
  border-radius: var(--r-md); font-size: 13.5px; line-height: 1.65;
  white-space: pre-wrap; overflow-wrap: anywhere; box-shadow: var(--shadow-1);
  border: 1px solid var(--line);
}
.bubble.user { align-self: flex-start; background: var(--surface); border-start-start-radius: var(--r-xs); }
.bubble.bot  { align-self: flex-end; background: var(--teal-tint); border-color: var(--teal-soft); border-start-end-radius: var(--r-xs); }
.bubble.staff { align-self: flex-end; background: var(--clay-tint); border-color: var(--clay-soft); border-start-end-radius: var(--r-xs); }
.bubble.system { align-self: flex-end; background: var(--surface); border-style: dashed; border-start-end-radius: var(--r-xs); }
.bubble.system .by { color: var(--ink-3); }
/* A message that was composed but never reached the phone. It stays in the
   thread -- a staff member following it up needs to read what the shop meant
   to say -- but it must never look like one the customer received. */
.bubble.undelivered { border-color: var(--rose); border-style: dashed; opacity: .85; }
.bubble .undelivered-note { display: block; margin-top: 6px; font-size: 11px; color: var(--rose); }
/* The time, and (outbound only) how far the message got on the customer's
   side. One muted footer line so a thread still reads as a conversation
   rather than a log table. */
.bubble .meta {
  display: flex; align-items: center; gap: 5px; justify-content: flex-end;
  margin-top: 4px; font-size: 10.5px; color: var(--ink-3); line-height: 1;
}
.bubble.user .meta { justify-content: flex-start; }
.bubble .meta .ticks { display: inline-flex; align-items: center; }
/* Read is the one state that gets a colour: the whole point of the indicator
   is that "seen" is findable at a glance down a long thread. */
.bubble .meta .ticks[data-state="read"] { color: var(--teal); }
.bubble .meta .ticks svg { display: block; }
.bubble .meta .ticks svg + svg { margin-inline-start: -5px; }
.bubble .by { font-size: 10.5px; font-weight: 700; color: var(--ink-3); margin-bottom: 3px; display: block; }
.bubble.staff .by { color: var(--clay); }
.bubble.bot .by { color: var(--teal); }
.bubble img.att { display: block; max-width: 240px; width: 100%; border-radius: var(--r-sm); margin-top: 6px; border: 1px solid var(--line); }
.bubble audio { display: block; width: 240px; max-width: 100%; margin-top: 6px; }
.sysline {
  align-self: center; font-size: 11px; color: var(--ink-3);
  background: var(--surface-3); border-radius: var(--r-pill); padding: 3px 12px;
  display: inline-flex; align-items: center; gap: 6px; max-width: 90%;
}
.sysline[data-tone="bad"] { background: var(--rose-tint); color: var(--rose); }

.composer { flex: 0 0 auto; border-top: 1px solid var(--line); background: var(--surface); padding: var(--s-3) var(--s-4); }
.composer .box { display: flex; align-items: flex-end; gap: var(--s-2); }
.composer textarea {
  flex: 1; min-height: 40px; max-height: 168px; resize: none;
  padding: 10px var(--s-3); border-radius: var(--r-md);
  border: 1px solid var(--line-strong); background: var(--surface-2);
  font-size: 13.5px; line-height: 1.55; outline: none;
  transition: border-color var(--t-fast), box-shadow var(--t-fast);
}
.composer textarea:focus { border-color: var(--clay); box-shadow: var(--ring); }
.composer .note { font-size: 11.5px; color: var(--ink-3); margin-top: 6px; display: flex; align-items: center; gap: 6px; }
.quickreplies { display: flex; gap: var(--s-1); flex-wrap: wrap; margin-bottom: var(--s-2); }
.quickreplies button {
  border: 1px dashed var(--line-strong); background: var(--surface-2); color: var(--ink-2);
  border-radius: var(--r-pill); padding: 4px 11px; font-size: 12px; min-height: 28px;
}
.quickreplies button:hover { border-style: solid; border-color: var(--clay); color: var(--clay); }

.context { border-inline-end: 1px solid var(--line); background: var(--surface); overflow-y: auto; padding: var(--s-4); }
.context h3 { font-size: 12px; color: var(--ink-3); letter-spacing: .04em; margin-bottom: var(--s-2); }
.ctx-block { padding-bottom: var(--s-4); margin-bottom: var(--s-4); border-bottom: 1px solid var(--line); }
.ctx-block:last-child { border-bottom: 0; }
.kv { display: flex; gap: var(--s-2); font-size: 12.5px; padding: 3px 0; }
.kv .k { color: var(--ink-3); min-width: 74px; }
.kv .v { flex: 1; font-weight: 500; overflow-wrap: anywhere; }

/* ==========================================================================
   charts (hand-built SVG — one visual system, both themes)
   ========================================================================== */

.chart { width: 100%; display: block; direction: ltr; overflow: visible; }
.chart .axis text { font-family: var(--font-num); font-size: 10px; fill: var(--ink-3); }
.chart .axis text.cap { font-size: 11px; fill: var(--ink-2); font-weight: 600; }
.chart .grid line { stroke: var(--line); stroke-width: 1; shape-rendering: crispEdges; }
.chart .line { fill: none; stroke-width: 2.25; stroke-linejoin: round; stroke-linecap: round; }
.chart .dot { stroke: var(--surface); stroke-width: 2; }
.chart .bar { rx: 4; }
.chart .hover-band { fill: transparent; }
.chart .hover-band:hover { fill: color-mix(in srgb, var(--ink) 5%, transparent); }
.chart .cursor { stroke: var(--ink-3); stroke-dasharray: 3 3; stroke-width: 1; opacity: 0; }
.chart-tip {
  position: fixed; z-index: 90; pointer-events: none; opacity: 0;
  transform: translate(-50%, -120%);
  background: var(--ink); color: var(--ground);
  border-radius: var(--r-sm); padding: 6px 10px; font-size: 11.5px; line-height: 1.5;
  box-shadow: var(--shadow-3); white-space: nowrap;
  transition: opacity var(--t-fast);
}
.chart-tip .tv { font-family: var(--font-num); font-weight: 700; }
.legend { display: flex; gap: var(--s-4); flex-wrap: wrap; font-size: 11.5px; color: var(--ink-3); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }

.barlist { display: flex; flex-direction: column; gap: 11px; }
.barlist .r { display: grid; grid-template-columns: 1fr auto; gap: 4px var(--s-3); align-items: center; font-size: 12.5px; }
.barlist .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.barlist .v { font-family: var(--font-num); font-weight: 700; font-size: 12.5px; }
.barlist .track { grid-column: 1 / -1; height: 7px; border-radius: var(--r-pill); background: var(--surface-3); overflow: hidden; }
.barlist .fill { height: 100%; border-radius: var(--r-pill); background: var(--accent, var(--clay)); transition: width var(--t-slow); }

.donutwrap { display: flex; align-items: center; gap: var(--s-5); flex-wrap: wrap; }
.donut { flex: 0 0 auto; }
.donut circle { fill: none; stroke-width: 14; }

/* ==========================================================================
   overlays: drawer, modal, palette, toasts
   ========================================================================== */

.scrim {
  position: fixed; inset: 0; z-index: 60;
  background: color-mix(in srgb, #1a1017 58%, transparent);
  backdrop-filter: blur(3px);
  opacity: 0; transition: opacity var(--t-mid);
}
.scrim[hidden] { display: none; }
.scrim.in { opacity: 1; }

.drawer {
  position: fixed; inset-block: 0; inset-inline-start: 0; z-index: 61;
  width: min(760px, 100vw);
  background: var(--surface); border-inline-end: 1px solid var(--line);
  box-shadow: var(--shadow-3);
  display: flex; flex-direction: column;
  transform: translateX(-100%); transition: transform var(--t-slow);
}
:root[dir="rtl"] .drawer { transform: translateX(100%); }
.drawer.in { transform: translateX(0) !important; }
.drawer[hidden] { display: none; }
.drawer-head { flex: 0 0 auto; display: flex; align-items: center; gap: var(--s-3); padding: var(--s-4) var(--s-5); border-bottom: 1px solid var(--line); }
.drawer-head h2 { font-size: 16px; flex: 1; min-width: 0; }
.drawer-body { flex: 1; min-height: 0; overflow-y: auto; padding: var(--s-5); }
.drawer-foot { flex: 0 0 auto; display: flex; gap: var(--s-2); padding: var(--s-4) var(--s-5); border-top: 1px solid var(--line); background: var(--surface-2); flex-wrap: wrap; }

.modal {
  position: fixed; z-index: 61; inset-block-start: 50%; inset-inline-start: 50%;
  transform: translate(50%, -50%) scale(.97);
  width: min(560px, calc(100vw - 32px)); max-height: min(86dvh, 760px);
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-xl); box-shadow: var(--shadow-3);
  display: flex; flex-direction: column; opacity: 0;
  transition: opacity var(--t-mid), transform var(--t-mid);
}
:root[dir="ltr"] .modal { transform: translate(-50%, -50%) scale(.97); }
.modal.in { opacity: 1; transform: translate(50%, -50%) scale(1); }
:root[dir="ltr"] .modal.in { transform: translate(-50%, -50%) scale(1); }
.modal[hidden] { display: none; }
.modal-head { display: flex; align-items: center; gap: var(--s-3); padding: var(--s-4) var(--s-5); border-bottom: 1px solid var(--line); }
.modal-head h2 { font-size: 15px; flex: 1; }
.modal-body { flex: 1; min-height: 0; overflow-y: auto; padding: var(--s-5); }
.modal-foot { display: flex; gap: var(--s-2); justify-content: flex-start; padding: var(--s-4) var(--s-5); border-top: 1px solid var(--line); background: var(--surface-2); }

/* --- command palette ---------------------------------------------------- */

#palette {
  position: fixed; z-index: 71; inset-block-start: 12vh; inset-inline-start: 50%;
  transform: translateX(50%) translateY(-8px);
  width: min(620px, calc(100vw - 32px));
  background: var(--surface); border: 1px solid var(--line-strong);
  border-radius: var(--r-lg); box-shadow: var(--shadow-3);
  overflow: hidden; opacity: 0; transition: opacity var(--t-fast), transform var(--t-fast);
}
#palette.in { opacity: 1; transform: translateX(50%) translateY(0); }
#palette[hidden] { display: none; }
#palette .pinput { display: flex; align-items: center; gap: var(--s-3); padding: var(--s-4); border-bottom: 1px solid var(--line); }
#palette input { flex: 1; border: 0; background: none; outline: none; font-size: 15px; }
#palette .plist { max-height: 46dvh; overflow-y: auto; padding: var(--s-2); }
.pitem {
  display: flex; align-items: center; gap: var(--s-3); width: 100%;
  padding: 9px var(--s-3); border: 0; background: none; border-radius: var(--r-md);
  text-align: start; font-size: 13.5px; color: var(--ink-2);
}
.pitem .ic { color: var(--ink-3); flex: 0 0 auto; }
.pitem .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pitem .grp { font-size: 11px; color: var(--ink-3); }
.pitem[aria-selected="true"] { background: var(--clay-tint); color: var(--clay); }
.pitem[aria-selected="true"] .ic, .pitem[aria-selected="true"] .grp { color: var(--clay); }
#palette .pfoot { display: flex; gap: var(--s-4); padding: var(--s-2) var(--s-4); border-top: 1px solid var(--line); font-size: 11px; color: var(--ink-3); background: var(--surface-2); }
#palette kbd { font-family: var(--font-num); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-xs); padding: 1px 5px; }

/* --- toasts ------------------------------------------------------------- */

#toasts {
  position: fixed; z-index: 90; inset-block-end: var(--s-5); inset-inline-start: var(--s-5);
  display: flex; flex-direction: column; gap: var(--s-2); pointer-events: none;
  max-width: min(420px, calc(100vw - 32px));
}
.toast {
  display: flex; align-items: flex-start; gap: var(--s-3);
  padding: var(--s-3) var(--s-4); border-radius: var(--r-md);
  background: var(--surface); border: 1px solid var(--line-strong);
  box-shadow: var(--shadow-3); font-size: 13px; pointer-events: auto;
  animation: toastin var(--t-mid);
}
.toast[data-tone="ok"]   { border-inline-start: 3px solid var(--teal); }
.toast[data-tone="bad"]  { border-inline-start: 3px solid var(--rose); }
.toast[data-tone="warn"] { border-inline-start: 3px solid var(--amber); }
.toast .tx { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.toast .tx b { display: block; font-size: 13px; }
.toast .tx span { color: var(--ink-3); font-size: 12px; }
@keyframes toastin { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ==========================================================================
   page furniture
   ========================================================================== */

.pagehead { display: flex; align-items: flex-end; gap: var(--s-3); flex-wrap: wrap; margin-bottom: var(--s-5); }
.pagehead .t { flex: 1; min-width: 200px; }
.pagehead h2 { font-size: 20px; letter-spacing: -.02em; }
.pagehead .d { font-size: 12.5px; color: var(--ink-3); margin-top: 2px; }

.lane { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: var(--s-4); }
.mini { display: flex; align-items: center; gap: var(--s-3); padding: 10px var(--s-4); border-bottom: 1px solid var(--line); }
.mini:last-child { border-bottom: 0; }
.mini .m1 { flex: 1; min-width: 0; }
.mini .m1 .a { display: block; font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mini .m1 .b { display: block; font-size: 11.5px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.stat-inline { display: flex; align-items: baseline; gap: 6px; }
.stat-inline .v { font-family: var(--font-num); font-weight: 700; font-size: 17px; }
.stat-inline .l { font-size: 11.5px; color: var(--ink-3); }

.switch { position: relative; width: 46px; height: 27px; flex: 0 0 auto; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.switch .track {
  position: absolute; inset: 0; border-radius: var(--r-pill);
  background: var(--line-strong); transition: background var(--t-mid);
}
.switch .knob {
  position: absolute; top: 3px; inset-inline-end: 3px; width: 21px; height: 21px;
  border-radius: 50%; background: #fff; box-shadow: var(--shadow-1);
  transition: transform var(--t-mid);
}
.switch input:checked ~ .track { background: var(--teal); }
.switch input:checked ~ .knob { transform: translateX(-19px); }
:root[dir="ltr"] .switch input:checked ~ .knob { transform: translateX(19px); }
.switch input:focus-visible ~ .track { box-shadow: var(--ring); }

.flagrow { display: flex; align-items: center; gap: var(--s-4); padding: var(--s-4); border-bottom: 1px solid var(--line); }
.flagrow:last-child { border-bottom: 0; }
.flagrow .i { flex: 1; min-width: 0; }
.flagrow .i .l { font-weight: 600; font-size: 13.5px; }
.flagrow .i .d { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
.flagrow .i .m { font-size: 11px; color: var(--ink-3); margin-top: 4px; }

/* ==========================================================================
   responsive
   ========================================================================== */

@media (max-width: 1180px) {
  #view-inbox.with-context.active { grid-template-columns: 320px 1fr; }
  #view-inbox .context { display: none; }
}

@media (max-width: 900px) {
  :root { --rail: 0px; }
  #app { grid-template-columns: 1fr; }
  #rail {
    position: fixed; inset-block: 0; inset-inline-start: 0; z-index: 62;
    width: 274px; transform: translateX(100%);
    transition: transform var(--t-slow); background: var(--surface);
    border-inline-start: 0; border-inline-end: 1px solid var(--line);
  }
  :root[dir="ltr"] #rail { transform: translateX(-100%); }
  #rail.in { transform: translateX(0) !important; }
  #menuBtn { display: inline-flex; }
  #topbar { padding: 0 var(--s-4); }
  .scroll { padding: var(--s-4); }
  #view-inbox.active, #view-inbox.with-context.active { grid-template-columns: 1fr; }
  #view-inbox .inbox-list { display: flex; }
  #view-inbox.reading .inbox-list { display: none; }
  #view-inbox .thread { display: none; }
  #view-inbox.reading .thread { display: flex; }
  .drawer { width: 100vw; }
  .bubble { max-width: 88%; }
  #toasts { inset-inline: var(--s-4); max-width: none; }
}

@media (max-width: 560px) {
  .kpi .kpi-value { font-size: 25px; }
  .card-body { padding: var(--s-4); }
  .card-head { padding: var(--s-3) var(--s-4); }
  .pagehead h2 { font-size: 18px; }
}

@media print {
  #rail, #topbar, .composer, #toasts { display: none !important; }
  body, #app { height: auto; overflow: visible; }
  .card { break-inside: avoid; box-shadow: none; }
}
</style>
</head>
<body>

<div id="boot" class="empty" style="height:100dvh;justify-content:center">
  <div class="spin"></div>
  <div class="d" data-i18n="بنفتح لوحة التحكم…">بنفتح لوحة التحكم…</div>
</div>

<div id="app" hidden>

  <!-- ===================== rail ===================== -->
  <aside id="rail">
    <div class="brand">
      <img class="mark" src="/dashboard/logo.webp" alt="Wanas Gallery" width="38" height="38">
      <div>
        <div class="name" dir="ltr">Wanas Gallery</div>
        <div class="role" data-i18n="نظام إدارة المتجر">نظام إدارة المتجر</div>
      </div>
    </div>

    <button class="rail-search" id="paletteBtn" type="button">
      <svg class="ic" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span data-i18n="ابحث أو نفّذ أمر…">ابحث أو نفّذ أمر…</span>
      <kbd>Ctrl K</kbd>
    </button>

    <nav id="nav" data-i18n-title="أقسام اللوحة" aria-label="أقسام اللوحة"></nav>

    <div class="rail-foot">
      <div class="avatar" id="meAvatar" aria-hidden="true">؟</div>

/* For payloads that carry their own translations (`label_ar`/`label_en` on
   the feature flags and the permission catalog) -- those strings live on the
   server, so the dictionary above has never seen them. */
function pick(row, field) {
  return (LANG === "en" ? row[field + "_en"] : row[field + "_ar"]) || row[field + "_ar"] || "";
}

function trText(text) {
  if (LANG === "ar") return text;
  return text.replace(I18N_SEGMENT, (run) => {
    const key = run.trim();
    const hit = EN[key];
    // Replaced inside the run rather than returned bare, so the whitespace
    // that positioned the phrase in its markup survives.
    return hit === undefined ? run : run.replace(key, () => hit);
  });
}

const tr = trText;

function TR(chunks, ...values) {
  let out = trText(chunks[0]);
  for (let i = 0; i < values.length; i++) out += values[i] + trText(chunks[i + 1]);
  return out;
}

function setLang(lang) {
  try { localStorage.setItem(LANG_KEY, lang); } catch { /* private window */ }
  // A reload rather than a re-render: half the labels on this page live in
  // module-level constants (NAV, ORDER_STATUS, CHANNELS, ...) that were built
  // once at load. Re-rendering would leave those in the old language, which
  // reads as a bug. Language is a session preference, not a live toggle.
  location.reload();
}

const $  = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

function el(tag, attrs = {}, ...kids) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") node.className = v;
    else if (k === "html") node.innerHTML = v;
    else if (k === "text") node.textContent = v;
    else if (k === "dataset") Object.assign(node.dataset, v);
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) {
    if (kid === null || kid === undefined || kid === false) continue;
    node.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return node;
}

/* --- numbers, money, dates ------------------------------------------------ */

const nf = new Intl.NumberFormat("en-US");
const nf1 = new Intl.NumberFormat("en-US", { maximumFractionDigits: 1 });

const num = (v) => nf.format(Math.round(Number(v) || 0));
const money = (v) => nf.format(Math.round(Number(v) || 0)) + tr(" ج.م");
const pct = (v) => nf1.format((Number(v) || 0) * 100) + "%";

//: Month names follow the UI language; the digits are Latin in both, because
//: `nf`/`nf1` above are pinned to en-US and a date in Arabic-Indic numerals
//: next to a Latin order total reads like two different pages.
const DATE_LOCALE = LANG === "en" ? "en-GB" : "ar-EG-u-nu-latn";

function shortDate(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  return d.toLocaleDateString(DATE_LOCALE, { day: "numeric", month: "short" });
}

function dateTime(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  return d.toLocaleString(DATE_LOCALE, { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
}

/* One message's own time, in a thread. Clock alone for today -- the common
   case, and a date on every line of a live conversation is noise -- and the
   day in front of it for anything older, because "14:32" with no date on a
   message from last week is worse than no time at all. */
function bubbleTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return "";
  const clock = d.toLocaleTimeString(DATE_LOCALE, { hour: "2-digit", minute: "2-digit" });
  const today = new Date();
  const sameDay = d.getFullYear() === today.getFullYear()
    && d.getMonth() === today.getMonth() && d.getDate() === today.getDate();
  return sameDay ? clock : `${shortDate(iso)} ${clock}`;
}

function ago(iso) {
  if (!iso) return "";
  const secs = (Date.now() - new Date(iso).getTime()) / 1000;
  if (secs < 60) return tr("الآن");
  if (secs < 3600) return TR`${Math.floor(secs / 60)} د`;
  if (secs < 86400) return TR`${Math.floor(secs / 3600)} س`;
  if (secs < 86400 * 30) return TR`${Math.floor(secs / 86400)} ي`;
  return shortDate(iso);
}

/* --------------------------------------------------------------------------
   api
   -------------------------------------------------------------------------- */

class ApiError extends Error {
  constructor(status, body) {
    super((body && (body.detail || body.error)) || `HTTP ${status}`);
    this.status = status;
    this.code = (body && body.error) || String(status);
    this.body = body || {};
  }
}

async function api(path, { method = "GET", body, quiet = false } = {}) {
  let response;
  try {
    response = await fetch(path, {
      method,
      headers: body ? { "Content-Type": "application/json" } : undefined,
      body: body ? JSON.stringify(body) : undefined,
      credentials: "same-origin",
    });
  } catch (err) {
    // A dropped connection is not a server answer; saying "الخادم رفض" here
    // would send someone hunting a bug that is their wifi.
    throw new ApiError(0, { error: "network", detail: tr("الاتصال بالسيرفر اتقطع") });
  }

  if (response.status === 401) {
    location.href = "/dashboard/login";
    throw new ApiError(401, { error: "unauthenticated" });
  }

  let payload = null;
  const text = await response.text();
  if (text) { try { payload = JSON.parse(text); } catch { payload = { detail: text.slice(0, 200) }; } }

  if (!response.ok) {
    const error = new ApiError(response.status, payload);
    if (!quiet) throw error;
    return { __error: error };
  }
  return payload;
}

/* A Shopify outage is the one failure this dashboard has to explain rather
   than merely report: half the pages are live reads, and "المتجر مش راضي
   يرد" is actionable where a 503 is not. */
function errorBanner(err, what) {
  // A 403 is not a failure to report. It means this account was never meant
  // to see that panel, and "تعذر تحميل الطلبات" would send someone hunting a
  // bug that is a permission working exactly as configured.
  if (err.code === "forbidden") return "";
  const store = err.code === "store_unavailable";
  const tone = store ? "warn" : "bad";
  const title = store ? tr("شوبيفاي مش راجع دلوقتي") : TR`تعذر تحميل ${what}`;
  return `<div class="banner" data-tone="${tone === "warn" ? "" : "bad"}">
    ${icon("alert", 16)}
    <div><strong>${esc(title)}</strong><br>${esc(err.message || "")}</div>
  </div>`;
}

/* --------------------------------------------------------------------------
   toasts
   -------------------------------------------------------------------------- */

function toast(title, detail = "", tone = "ok", ttl = 4200) {
  const node = el("div", { class: "toast", dataset: { tone } },
    el("div", { class: "ic", html: icon(tone === "ok" ? "check" : "alert", 17) }),
    el("div", { class: "tx" }, el("b", { text: title }), detail ? el("span", { text: detail }) : null),
  );
  $("#toasts").append(node);
  setTimeout(() => {
    node.style.transition = "opacity .2s, transform .2s";
    node.style.opacity = "0";
    node.style.transform = "translateY(6px)";
    setTimeout(() => node.remove(), 220);
  }, ttl);
}

const toastError = (err, what) =>
  toast(what, err && err.message ? err.message : "", "bad", 6000);

/* --------------------------------------------------------------------------
   overlays: scrim, drawer, modal — one focus trap, one Esc handler
   -------------------------------------------------------------------------- */

/* A *stack*, not a single slot. The Ship form is a modal opened on top of an
   order drawer, and while `open` held one node the modal's own close wiped it:
   the drawer stayed on screen with `overlay.open` already null, so its ✕, Esc
   and the scrim all hit `if (!this.open) return` and did nothing. The order
   page simply stopped responding, with no error to go on. Cancelling an order
   went the same way -- its confirm is a modal too. So each layer is pushed and
   popped, and closing the top one hands control back to the layer underneath
   rather than to nothing. */
const overlay = {
  stack: [],

  //: The topmost open layer, or null. Read by the Esc handler and the focus
  //: trap; never assigned -- `show` and `close` own the stack.
  get open() {
    return this.stack.length ? this.stack[this.stack.length - 1].node : null;
  },

  show(kind, title, bodyHTML, footNodes) {
    const node = kind === "drawer" ? $("#drawer") : $("#modal");
    // Re-rendering the layer that is already on top (openOrder refreshing
    // itself after a quantity edit) is not a new layer. Pushing it twice
    // would take two clicks of ✕ to close one drawer.
    if (this.open !== node) this.stack.push({ node, lastFocus: document.activeElement });
    $(kind === "drawer" ? "#drawerTitle" : "#modalTitle").textContent = title;
    const body = $(kind === "drawer" ? "#drawerBody" : "#modalBody");
    body.innerHTML = typeof bodyHTML === "string" ? bodyHTML : "";
    if (bodyHTML && bodyHTML.nodeType) body.append(bodyHTML);
    const foot = $(kind === "drawer" ? "#drawerFoot" : "#modalFoot");
    foot.innerHTML = "";
    if (footNodes && footNodes.length) { foot.append(...footNodes); foot.hidden = false; }
    else foot.hidden = true;

    $("#scrim").hidden = false;
    node.hidden = false;
    requestAnimationFrame(() => { $("#scrim").classList.add("in"); node.classList.add("in"); });
    body.scrollTop = 0;
    setTimeout(() => {
      const first = node.querySelector("input, textarea, select, button:not([data-close-overlay])");
      (first || node.querySelector("[data-close-overlay]")).focus();
    }, 60);
    return body;
  },

  drawer(title, html, foot) { return this.show("drawer", title, html, foot); },
  modal(title, html, foot) { return this.show("modal", title, html, foot); },

  /* Closes the top layer only. The scrim belongs to the stack as a whole, so
     it stays up while anything is still open -- dismissing the Ship form must
     not leave the drawer behind it sitting on a bare page with no way out. */
  close() {
    const top = this.stack.pop();
    if (!top) return;
    top.node.classList.remove("in");
    const bare = this.stack.length === 0;
    if (bare) $("#scrim").classList.remove("in");
    setTimeout(() => {
      top.node.hidden = true;
      if (!this.stack.length) $("#scrim").hidden = true;
    }, 220);
    if (top.lastFocus && top.lastFocus.isConnected) top.lastFocus.focus();
  },

  //: Everything, for the actions that finish with the list behind them
  //: refreshed -- there is nothing left to come back to.
  closeAll() {
    while (this.stack.length) this.close();
  },

  /* A confirm that says what will happen, in the words of the thing it will
     happen to — never "are you sure?" alone. */
  confirm(title, message, confirmLabel, { danger = false } = {}) {
    return new Promise((resolve) => {
      const yes = el("button", {
        class: `btn ${danger ? "danger" : "primary"}`, text: confirmLabel,
        onclick: () => { this.close(); resolve(true); },
      });
      const no = el("button", {
        class: "btn", text: tr("إلغاء"), onclick: () => { this.close(); resolve(false); },
      });
      this.modal(title, `<p style="font-size:13.5px;color:var(--ink-2)">${esc(message)}</p>`, [yes, no]);
    });
  },
};

$("#scrim").addEventListener("click", () => overlay.close());
$$("[data-close-overlay]").forEach((b) => b.addEventListener("click", () => overlay.close()));

document.addEventListener("keydown", (event) => {
  if (event.key === "Escape") {
    if (!$("#palette").hidden) return palette.close();
    if (overlay.open) return overlay.close();
    if ($("#rail").classList.contains("in")) return toggleRail(false);
  }
  if (overlay.open && event.key === "Tab") {
    const focusables = $$(
      'a[href], button:not([disabled]), input:not([disabled]), select, textarea, [tabindex]:not([tabindex="-1"])',
      overlay.open,
    ).filter((n) => n.offsetParent !== null);
    if (!focusables.length) return;
    const first = focusables[0], last = focusables[focusables.length - 1];
    if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
    else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
  }
});

/* --------------------------------------------------------------------------
   charts — hand-built SVG, no library, one visual system
   -------------------------------------------------------------------------- */

const CHART_TONES = ["clay", "teal", "lilac", "amber", "sky", "rose"];
const toneVar = (tone) => `var(--${tone})`;

function svgEl(tag, attrs = {}) {
  const node = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) if (v !== null && v !== undefined) node.setAttribute(k, v);
  return node;
}

const chartTip = {
  show(event, html) {
    const tip = $("#chartTip");
    tip.innerHTML = html;
    tip.style.left = `${event.clientX}px`;
    tip.style.top = `${event.clientY}px`;
    tip.style.opacity = "1";
  },
  hide() { $("#chartTip").style.opacity = "0"; },
};

/* A smooth curve through evenly-spaced points, the shape Shopify's own
   analytics draws.

   Monotone cubic -- Fritsch-Carlson tangents -- rather than a plain
   Catmull-Rom, which overshoots: a spline drawn between a big day and a quiet
   one dips below the axis on the way, and this chart's fill would then shade
   in a day of negative sales that never happened. Flattening the tangent
   wherever the slope changes sign is what keeps the curve inside the numbers
   it was drawn from.
*/
function splinePath(px, py) {
  const n = px.length;
  if (n < 3) return px.map((x, i) => `${i ? "L" : "M"}${x.toFixed(1)},${py[i].toFixed(1)}`).join(" ");
  const slope = [], tangent = [];
  for (let i = 0; i < n - 1; i++) slope.push((py[i + 1] - py[i]) / (px[i + 1] - px[i]));
  tangent.push(slope[0]);
  for (let i = 1; i < n - 1; i++) {
    if (slope[i - 1] * slope[i] <= 0) { tangent.push(0); continue; }
    const t = (slope[i - 1] + slope[i]) / 2;
    const limit = 3 * Math.min(Math.abs(slope[i - 1]), Math.abs(slope[i]));
    tangent.push(Math.sign(t) * Math.min(Math.abs(t), limit));
  }
  tangent.push(slope[n - 2]);

  let d = `M${px[0].toFixed(1)},${py[0].toFixed(1)}`;
  for (let i = 0; i < n - 1; i++) {
    const dx = (px[i + 1] - px[i]) / 3;
    d += ` C${(px[i] + dx).toFixed(1)},${(py[i] + tangent[i] * dx).toFixed(1)}`
      + ` ${(px[i + 1] - dx).toFixed(1)},${(py[i + 1] - tangent[i + 1] * dx).toFixed(1)}`
      + ` ${px[i + 1].toFixed(1)},${py[i + 1].toFixed(1)}`;
  }
  return d;
}

/* An area+line series. `points` is [{label, value}] already in display order;
   the axis stays LTR because it is time, and mirroring a time axis is how a
   chart starts lying about direction.

   `caption` is the window the series covers, printed once under the axis --
   the tick labels say which day, and only the caption says which stretch of
   days they were taken from. */
function lineChart(points, { height = 190, tone = "clay", fmt = num, label = "", caption = "" } = {}) {
  const W = 720, H = height, padL = 44, padR = 12, padT = 14, padB = caption ? 44 : 26;
  const svg = svgEl("svg", {
    class: "chart", viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: "none",
    role: "img", "aria-label": label || tr("رسم بياني زمني"), height,
  });
  if (!points.length) return svg;

  const values = points.map((p) => Number(p.value) || 0);
  const max = Math.max(...values, 1);
  const min = 0;
  const x = (i) => padL + (i * (W - padL - padR)) / Math.max(points.length - 1, 1);
  const y = (v) => H - padB - ((v - min) / (max - min || 1)) * (H - padT - padB);

  const grid = svgEl("g", { class: "grid" });
  const ticks = 4;
  for (let t = 0; t <= ticks; t++) {
    const value = min + ((max - min) * t) / ticks;
    grid.append(svgEl("line", { x1: padL, x2: W - padR, y1: y(value), y2: y(value) }));
    const text = svgEl("text", { x: padL - 8, y: y(value) + 3.5, "text-anchor": "end" });
    text.textContent = fmt === money ? num(value) : fmt(value);
    grid.append(text);
  }
  grid.setAttribute("class", "grid axis");
  svg.append(grid);

  const gradientId = `g${Math.random().toString(36).slice(2, 8)}`;
  const defs = svgEl("defs");
  const gradient = svgEl("linearGradient", { id: gradientId, x1: 0, y1: 0, x2: 0, y2: 1 });
  gradient.append(svgEl("stop", { offset: "0%", "stop-color": toneVar(tone), "stop-opacity": .28 }));
  gradient.append(svgEl("stop", { offset: "100%", "stop-color": toneVar(tone), "stop-opacity": 0 }));
  defs.append(gradient);
  svg.append(defs);

  const line = splinePath(points.map((_, i) => x(i)), points.map((p) => y(Number(p.value) || 0)));
  svg.append(svgEl("path", {
    d: `${line} L${x(points.length - 1).toFixed(1)},${H - padB} L${padL},${H - padB} Z`,
    fill: `url(#${gradientId})`, stroke: "none",
  }));
  svg.append(svgEl("path", {
    class: "line", d: line, stroke: toneVar(tone),
    // The viewBox stretches to the container width; without this the stroke
    // stretches with it and a wide screen gets a visibly fatter line.
    "vector-effect": "non-scaling-stroke",
  }));

  const axis = svgEl("g", { class: "axis" });
  // "16 Aug", not "16". A bare day number is unreadable the moment the window
  // crosses a month, which every window longer than a few weeks does -- and
  // the two ends of a 30-day range printed as "16" and "15" say nothing at
  // all. Wider labels mean fewer of them fit, hence the sparser step.
  const labelled = caption ? 6 : 7;
  const step = Math.max(1, Math.ceil(points.length / labelled));
  const labelY = caption ? H - 26 : H - 8;
  points.forEach((p, i) => {
    if (i % step && i !== points.length - 1) return;
    const text = svgEl("text", { x: x(i), y: labelY, "text-anchor": "middle" });
    text.textContent = p.label || p.short;
    axis.append(text);
  });
  if (caption) {
    const cap = svgEl("text", { x: padL + (W - padL - padR) / 2, y: H - 7, "text-anchor": "middle", class: "cap" });
    cap.textContent = caption;
    axis.append(cap);
  }
  svg.append(axis);

  const cursor = svgEl("line", { class: "cursor", y1: padT, y2: H - padB });
  svg.append(cursor);
  const marker = svgEl("circle", { class: "dot", r: 4.5, fill: toneVar(tone), opacity: 0 });
  svg.append(marker);

  const bandWidth = (W - padL - padR) / Math.max(points.length, 1);
  points.forEach((p, i) => {
    const band = svgEl("rect", {
      class: "hover-band", x: x(i) - bandWidth / 2, y: padT,
      width: bandWidth, height: H - padT - padB,
    });
    const move = (event) => {
      cursor.setAttribute("x1", x(i)); cursor.setAttribute("x2", x(i));
      cursor.setAttribute("opacity", 1);
      marker.setAttribute("cx", x(i)); marker.setAttribute("cy", y(Number(p.value) || 0));
      marker.setAttribute("opacity", 1);
      chartTip.show(event, `${esc(p.label)}<br><span class="tv">${esc(fmt(p.value))}</span>`);
    };
    band.addEventListener("mousemove", move);
    band.addEventListener("mouseenter", move);
    band.addEventListener("mouseleave", () => {
      cursor.setAttribute("opacity", 0); marker.setAttribute("opacity", 0); chartTip.hide();
    });
    svg.append(band);
  });
  return svg;
}

function sparkline(values, tone = "clay", { height = 34 } = {}) {
  const W = 160, H = height;
  const svg = svgEl("svg", { class: "chart spark", viewBox: `0 0 ${W} ${H}`, height, "aria-hidden": "true" });
  if (values.length < 2) return svg;
  const max = Math.max(...values, 1), min = Math.min(...values, 0);
  const x = (i) => (i * W) / (values.length - 1);
  const y = (v) => H - 3 - ((v - min) / (max - min || 1)) * (H - 6);
  const d = values.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  svg.append(svgEl("path", { d: `${d} L${W},${H} L0,${H} Z`, fill: toneVar(tone), opacity: .12, stroke: "none" }));
  svg.append(svgEl("path", {
    class: "line", d, stroke: toneVar(tone), "stroke-width": 1.9, "vector-effect": "non-scaling-stroke",
  }));
  return svg;
}

function barChart(points, { height = 190, tone = "lilac", fmt = num, label = "" } = {}) {
  const W = 720, H = height, padL = 44, padR = 12, padT = 14, padB = 26;
  const svg = svgEl("svg", {
    class: "chart", viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: "none",
    role: "img", "aria-label": label || tr("رسم بياني أعمدة"), height,
  });
  if (!points.length) return svg;
  const max = Math.max(...points.map((p) => Number(p.value) || 0), 1);
  const y = (v) => H - padB - (v / max) * (H - padT - padB);
  const slot = (W - padL - padR) / points.length;
  const barWidth = Math.max(3, Math.min(30, slot * 0.62));

  const grid = svgEl("g", { class: "grid axis" });
  for (let t = 0; t <= 3; t++) {
    const value = (max * t) / 3;
    grid.append(svgEl("line", { x1: padL, x2: W - padR, y1: y(value), y2: y(value) }));
    const text = svgEl("text", { x: padL - 8, y: y(value) + 3.5, "text-anchor": "end" });
    text.textContent = num(value);
    grid.append(text);
  }
  svg.append(grid);

  points.forEach((p, i) => {
    const value = Number(p.value) || 0;
    const cx = padL + slot * i + slot / 2;
    const rect = svgEl("rect", {
      class: "bar", x: cx - barWidth / 2, y: y(value),
      width: barWidth, height: Math.max(H - padB - y(value), value > 0 ? 2 : 0),
      fill: toneVar(p.tone || tone), opacity: .9,
    });
    rect.addEventListener("mousemove", (event) =>
      chartTip.show(event, `${esc(p.label)}<br><span class="tv">${esc(fmt(value))}</span>`));
    rect.addEventListener("mouseleave", () => chartTip.hide());
    svg.append(rect);
  });

  const axis = svgEl("g", { class: "axis" });
  const step = Math.max(1, Math.ceil(points.length / 8));
  points.forEach((p, i) => {
    if (i % step && i !== points.length - 1) return;
    const text = svgEl("text", { x: padL + slot * i + slot / 2, y: H - 8, "text-anchor": "middle" });
    text.textContent = p.short || p.label;
    axis.append(text);
  });
  svg.append(axis);
  return svg;
}

function donut(slices, { size = 132, thickness = 14, center = "" } = {}) {
  const total = slices.reduce((sum, s) => sum + (Number(s.value) || 0), 0);
  const r = (size - thickness) / 2;
  const circumference = 2 * Math.PI * r;
  const svg = svgEl("svg", { class: "donut", width: size, height: size, viewBox: `0 0 ${size} ${size}`, role: "img" });
  const g = svgEl("g", { transform: `rotate(-90 ${size / 2} ${size / 2})` });
  svg.append(g);

  if (!total) {
    g.append(svgEl("circle", { cx: size / 2, cy: size / 2, r, stroke: "var(--surface-3)", "stroke-width": thickness }));
    return svg;
  }
  let offset = 0;
  slices.forEach((slice, i) => {
    const value = Number(slice.value) || 0;
    if (value <= 0) return;
    const length = (value / total) * circumference;
    const arc = svgEl("circle", {
      cx: size / 2, cy: size / 2, r,
      stroke: toneVar(slice.tone || CHART_TONES[i % CHART_TONES.length]),
      "stroke-width": thickness,
      "stroke-dasharray": `${length - 2} ${circumference - length + 2}`,
      "stroke-dashoffset": -offset,
      "stroke-linecap": "butt",
    });
    arc.addEventListener("mousemove", (event) =>
      chartTip.show(event, `${esc(slice.label)}<br><span class="tv">${num(value)} · ${pct(value / total)}</span>`));
    arc.addEventListener("mouseleave", () => chartTip.hide());
    g.append(arc);
    offset += length;
  });
  if (center) {
    const text = svgEl("text", {
      x: size / 2, y: size / 2 + 6, "text-anchor": "middle",
      "font-size": 19, "font-weight": 700, fill: "var(--ink)", "font-family": "Inter, sans-serif",
    });
    text.textContent = center;
    svg.append(text);
  }
  return svg;
}

function barList(rows, { fmt = num, tone = "clay", limit = 8 } = {}) {
  const items = rows.slice(0, limit);
  const max = Math.max(...items.map((r) => Number(r.value) || 0), 1);
  return `<div class="barlist">${items.map((r) => `
    <div class="r" style="--accent:${toneVar(r.tone || tone)}">
      <div class="nm" title="${esc(r.label)}">${esc(r.label)}</div>
      <div class="v">${esc(fmt(r.value))}</div>
      <div class="track"><div class="fill" style="width:${((Number(r.value) || 0) / max * 100).toFixed(1)}%"></div></div>
    </div>`).join("")}</div>`;
}

/* --------------------------------------------------------------------------
   shared building blocks
   -------------------------------------------------------------------------- */

function kpi({ label, value, tone = "clay", foot = "", spark = null, iconName = null }) {
  const card = el("div", { class: "card kpi", style: `--accent:${toneVar(tone)}` });
  card.innerHTML = `
    <div class="kpi-label">${iconName ? icon(iconName, 14) : ""}${esc(label)}</div>
    <div class="kpi-value">${esc(value)}</div>
    ${foot ? `<div class="kpi-foot">${foot}</div>` : ""}`;
  if (spark && spark.length > 1) {
    const wrap = el("div", { class: "spark" });
    wrap.append(sparkline(spark, tone));
    card.append(wrap);
  }
  return card;
}

function emptyState(title, detail, iconName = "spark", action = null) {
  const node = el("div", { class: "empty" });
  node.innerHTML = `${icon(iconName, 34)}<div class="t">${esc(title)}</div><div class="d">${esc(detail)}</div>`;
  if (action) node.append(action);
  return node;
}

function skeletonTable(rows = 6) {
  return `<div class="card"><div class="card-body flush">${
    Array.from({ length: rows }, () => '<div class="skel skel-row"></div>').join("")
  }</div></div>`;
}

function skeletonTiles(count = 4) {
  return `<div class="grid g-kpi">${
    Array.from({ length: count }, () => '<div class="skel skel-tile"></div>').join("")
  }</div>`;
}

function card(title, sub, bodyHTML, headExtra = "", { flush = false } = {}) {
  return `<section class="card">
    <div class="card-head">
      <h2>${esc(title)}${sub ? ` <span class="sub">${esc(sub)}</span>` : ""}</h2>
      ${headExtra}
    </div>
    <div class="card-body${flush ? " flush" : ""}">${bodyHTML}</div>
  </section>`;
}

function tableHTML(headers, rowsHTML, { minWidth } = {}) {
  return `<div class="tablewrap"><table class="tbl"${minWidth ? ` style="min-width:${minWidth}px"` : ""}>
    <thead><tr>${headers.map((h) => `<th${h.num ? ' class="num"' : ""}>${esc(h.label ?? h)}</th>`).join("")}</tr></thead>
    <tbody>${rowsHTML}</tbody></table></div>`;
}

/* Copy-to-clipboard for the ids and phone numbers staff paste into Shopify
   and WhatsApp all day. */
async function copy(text, what = tr("النص")) {
  try {
    await navigator.clipboard.writeText(text);
    toast(TR`${what} اتنسخ`, text.length > 40 ? "" : text);
  } catch {
    toast(tr("مقدرناش ننسخ"), tr("المتصفح رافض الوصول للحافظة"), "warn");
  }
}
document.addEventListener("click", (event) => {
  const trigger = event.target.closest("[data-copy]");
  if (trigger) { event.preventDefault(); copy(trigger.dataset.copy, trigger.dataset.copyWhat || tr("النص")); }
});

/* CSV export: every table view offers one, because the thing staff ask for
   after "show me" is always "send it to me". */
function exportCSV(filename, headers, rows) {
  const cell = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const csv = "﻿" + [headers, ...rows].map((r) => r.map(cell).join(",")).join("\r\n");
  const url = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  const link = el("a", { href: url, download: filename });
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast(tr("الملف اتحمّل"), filename);
}

function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;

}

(function initTheme() {
  let saved = null;
  try { saved = localStorage.getItem(THEME_KEY); } catch { /* private window */ }
  const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;

})();

const ROUTES = Object.fromEntries(NAV.filter((n) => n.id).map((n) => [n.id, n]));

/* Whether this account may open a section.
   Cosmetic only. The endpoint behind every one of these is guarded on the
   server (`dashboard/guard.py::require_permission`) -- hiding a button is a
   courtesy to the person reading the sidebar, not a control. */
function may(permission) {
  if (!permission) return true;
  const granted = (state.me && state.me.permissions) || null;
  // No list at all means an older `/api/me` payload; treat it as unscoped
  // rather than hiding the whole dashboard from someone who can use it.
  return granted === null ? true : granted.includes(permission);
}

function visibleNav() {
  return NAV.filter((n) => (n.id ? may(n.perm) : true));
}

/* The shell around the app -- the search button, the boot text, the brand
   subtitle -- is static HTML rather than something a view renders, so it is
   marked up with `data-i18n` and translated once here. `data-i18n` carries the
   Arabic key so the markup stays readable in the source. */
function translateShell() {
  if (LANG === "ar") return;
  $$("[data-i18n]").forEach((node) => { node.textContent = trText(node.dataset.i18n); });
  $$("[data-i18n-title]").forEach((node) => {
    const text = trText(node.dataset.i18nTitle);
    node.title = text;
    node.setAttribute("aria-label", text);
  });
  document.title = "Wanas Gallery — " + trText("نظام إدارة المتجر");
}

function buildNav() {
  const nav = $("#nav");
  nav.innerHTML = "";
  const items = visibleNav();
  for (let i = 0; i < items.length; i += 1) {
    const item = items[i];
    if (item.group) {
      // A heading with nothing left under it is a heading for a section this
      // account cannot see -- drop it rather than leaving a bare label.
      const next = items[i + 1];
      if (!next || next.group) continue;
      nav.append(el("div", { class: "nav-group", text: item.group }));
      continue;
    }
    const button = el("button", {
      class: "nav-item", type: "button", dataset: { route: item.id },
      onclick: () => go(item.id),
    });
    button.innerHTML = `${icon(item.icon, 17)}<span class="label">${esc(item.label)}</span>` +
      (item.badge ? `<span class="count" data-badge="${item.badge}" hidden></span>` : "");
    nav.append(button);
  }
}

function setBadge(name, count, tone = "urgent") {
  $$(`[data-badge="${name}"]`).forEach((node) => {
    node.hidden = !count;
    node.textContent = count > 99 ? "99+" : String(count || "");
    node.dataset.tone = tone;
  });
}

function toggleRail(open) {
  $("#rail").classList.toggle("in", open);
  $("#menuBtn").setAttribute("aria-expanded", String(!!open));
}
$("#menuBtn").addEventListener("click", () => toggleRail(!$("#rail").classList.contains("in")));

const VIEWS = {};   // id -> { mount(force) }

function go(route, options = {}) {
  if (!ROUTES[route]) route = "overview";
  // A hash typed straight into the URL bar is not a way past a permission:
  // the route falls back to the one page everybody can see, and the request
  // behind it would have been refused anyway.
  if (!may(ROUTES[route].perm)) route = "overview";
  state.route = route;
  if (location.hash.slice(1) !== route) history.replaceState(null, "", `#${route}`);

  $$(".view").forEach((v) => v.classList.toggle("active", v.id === `view-${route}`));
  $$(".nav-item").forEach((b) => {
    const current = b.dataset.route === route;
    b.setAttribute("aria-current", current ? "page" : "false");
    if (!current) b.removeAttribute("aria-current");
  });

  const meta = ROUTES[route];
  $("#pageTitle").textContent = meta.title;
  $("#pageSub").textContent = meta.sub;
  $("#pageActions").innerHTML = "";
  toggleRail(false);

  if (VIEWS[route]) VIEWS[route].mount(options.force === true);
}

window.addEventListener("hashchange", () => go(location.hash.slice(1)));

/* --- command palette ------------------------------------------------------ */

const palette = {
  items: [], index: 0,

  base() {
    const routes = NAV.filter((n) => n.id && may(n.perm)).map((n) => ({
      group: tr("الأقسام"), label: n.title, icon: n.icon, run: () => go(n.id),
    }));
    // Same rule as the sidebar: a command that jumps into a section this
    // account cannot open has no business being offered.
    const commands = [
      { group: tr("أوامر"), label: tr("تحديث الصفحة الحالية"), icon: "refresh", run: () => go(state.route, { force: true }) },
      { group: tr("أوامر"), label: tr("تبديل الوضع الليلي / النهاري"), icon: "spark",
        run: () => applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark") },
      { group: tr("أوامر"), label: tr("منتج جديد"), icon: "plus", perm: "products",
        run: () => { go("products"); setTimeout(productCreateForm, 120); } },
      { group: tr("أوامر"), label: tr("مجموعة جديدة"), icon: "plus", perm: "collections",
        run: () => { go("collections"); setTimeout(collectionCreateForm, 120); } },
      { group: tr("أوامر"), label: tr("المحادثات المستنية رد"), icon: "inbox", perm: "inbox",
        run: () => { state.inbox.status = "needs_reply"; go("inbox", { force: true }); } },
      { group: tr("أوامر"), label: tr("المخزون اللي خلص"), icon: "alert", perm: "inventory",
        run: () => { inventoryView.filter = "out"; go("inventory", { force: true }); } },
      { group: tr("أوامر"), label: tr("عضو فريق جديد"), icon: "plus", perm: "manage_staff",
        run: () => { go("staff"); staffCreateForm(); } },
      { group: tr("أوامر"), label: tr("تسجيل الخروج"), icon: "x", run: logout },
    ].filter((c) => may(c.perm));
    return routes.concat(commands);
  },

  open() {
    this.items = this.base();
    this.index = 0;
    $("#paletteInput").value = "";
    $("#palette").hidden = false;
    $("#scrim").hidden = false;
    requestAnimationFrame(() => { $("#palette").classList.add("in"); $("#scrim").classList.add("in"); });
    this.render();
    $("#paletteInput").focus();
  },

  close() {
    $("#palette").classList.remove("in");
    if (!overlay.open) { $("#scrim").classList.remove("in"); setTimeout(() => { $("#scrim").hidden = true; }, 220); }
    setTimeout(() => { $("#palette").hidden = true; }, 160);
  },

  render(filter = "") {
    const needle = filter.trim().toLowerCase();
    const matches = needle
      ? this.items.filter((i) => i.label.toLowerCase().includes(needle) || i.group.toLowerCase().includes(needle))
      : this.items;
    this.matches = matches;
    this.index = Math.min(this.index, Math.max(matches.length - 1, 0));
    const list = $("#paletteList");
    list.innerHTML = matches.length
      ? matches.map((item, i) => `
          <button class="pitem" role="option" data-i="${i}" aria-selected="${i === this.index}">
            ${icon(item.icon || "spark", 16)}
            <span class="t">${esc(item.label)}</span>
            <span class="grp">${esc(item.group)}</span>
          </button>`).join("")
      : TR`<div class="empty" style="padding:var(--s-5)"><div class="d">مفيش نتيجة</div></div>`;
    $$(".pitem", list).forEach((node) => {
      node.addEventListener("click", () => this.run(Number(node.dataset.i)));
      node.addEventListener("mousemove", () => {
        this.index = Number(node.dataset.i);
        $$(".pitem", list).forEach((n) => n.setAttribute("aria-selected", n === node));
      });
    });
  },

  move(step) {
    if (!this.matches || !this.matches.length) return;
    this.index = (this.index + step + this.matches.length) % this.matches.length;
    $$(".pitem").forEach((n) => n.setAttribute("aria-selected", Number(n.dataset.i) === this.index));
    const active = $(`.pitem[data-i="${this.index}"]`);
    if (active) active.scrollIntoView({ block: "nearest" });
  },

  run(i) {
    const item = this.matches[i ?? this.index];
    if (!item) return;
    this.close();
    setTimeout(() => item.run(), 40);
  },
};

$("#paletteBtn").addEventListener("click", () => palette.open());
$("#paletteInput").addEventListener("input", (event) => palette.render(event.target.value));
$("#paletteInput").addEventListener("keydown", (event) => {
  if (event.key === "ArrowDown") { event.preventDefault(); palette.move(1); }
  else if (event.key === "ArrowUp") { event.preventDefault(); palette.move(-1); }
  else if (event.key === "Enter") { event.preventDefault(); palette.run(); }
});

document.addEventListener("keydown", (event) => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "k") {
    event.preventDefault();
    $("#palette").hidden ? palette.open() : palette.close();
    return;
  }
  if (typing || event.ctrlKey || event.metaKey || event.altKey) return;
  // Single-key jumps, the way every tool staff already use work.
  const jumps = { g: null, i: "inbox", o: "orders", p: "products", s: "inventory", a: "analytics", h: "overview" };
  if (event.key === "/") { event.preventDefault(); palette.open(); }
  else if (jumps[event.key]) { go(jumps[event.key]); }
  else if (event.key === "r") { go(state.route, { force: true }); }
});
