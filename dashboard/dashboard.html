async function logout() {
  await api("/dashboard/api/logout", { method: "POST", quiet: true });
  location.href = "/dashboard/login";
}
$("#logoutBtn").addEventListener("click", logout);

async function loadStatus() {
  if (!may("settings")) { $("#sysText").textContent = ""; return; }
  const status = await api("/dashboard/api/settings/status", { quiet: true });
  if (status.__error) return;
  state.status = status;
  const problems = [];
  if (!status.llm_key_set) problems.push(tr("مفتاح الموديل"));
  if (!status.shopify_configured) problems.push(tr("شوبيفاي"));
  if (!status.whatsapp_configured) problems.push(tr("واتساب"));
  if (!status.shopify_webhooks_configured) problems.push(tr("ويبهوك شوبيفاي"));
  $("#sysDot").dataset.tone = problems.length ? (problems.length > 1 ? "bad" : "warn") : "";
  $("#sysText").textContent = problems.length ? TR`${problems.length} إعداد ناقص` : tr("كل الأنظمة شغالة");
  $("#sysText").parentElement.title = problems.length ? problems.join(tr("، ")) : tr("كل الأنظمة شغالة");
}

/* ==========================================================================
   view: اليوم / overview
   ========================================================================== */

VIEWS.overview = {
  loaded: false,
  async mount(force) {
    if (this.loaded && !force) return;
    this.loaded = true;
    const body = $("#overviewBody");
    body.innerHTML = skeletonTiles(4) + skeletonTable(5);

    $("#pageActions").append(
      el("button", { class: "btn sm", type: "button", html: TR`${icon("refresh", 15)} تحديث`,
        onclick: () => this.mount(true) }),
    );

    // Today's page is the one screen everybody lands on, so it asks only for
    // the sections this account may see. An unasked panel is skipped, not
    // shown as a red "couldn't load" banner for something they were never
    // meant to have.
    const skipped = { __error: { code: "forbidden", message: "", status: 403 } };
    const ask = (permission, path) => (may(permission) ? api(path, { quiet: true }) : skipped);
    const [stats, inbox, queue, inventory] = await Promise.all([
      ask("analytics", "/dashboard/api/stats?days=7"),
      ask("inbox", "/dashboard/api/inbox"),
      ask("queue", "/dashboard/api/queue"),
      ask("inventory", "/dashboard/api/shopify/inventory?status=low"),
    ]);

    body.innerHTML = "";
    body.append(this.tiles(stats, inbox, queue, inventory));
    body.append(el("div", { class: "grid g-2" },
      this.revenueCard(stats), this.attentionCard(inbox, queue, inventory)));
    body.append(el("div", { class: "grid g-2" },
      this.ordersCard(stats), this.stockCard(inventory)));

    if (inbox.__error) return;
    setBadge("inbox", inbox.counts.needs_reply || 0);
    if (!queue.__error) setBadge("queue", queue.items.length, "warn");
    if (!inventory.__error) setBadge("stock", inventory.totals.out_of_stock_count, "warn");
  },

  tiles(stats, inbox, queue, inventory) {
    const grid = el("div", { class: "grid g-kpi" });
    if (stats.__error) {
      grid.innerHTML = errorBanner(stats.__error, tr("أرقام المبيعات"));
      return grid;
    }
    const series = stats.revenue_by_day.map((d) => Number(d.revenue));
    grid.append(
      kpi({ label: tr("مبيعات آخر ٧ أيام"), value: money(stats.revenue), tone: "clay", iconName: "money",
        spark: series,
        foot: TR`<span>${num(stats.order_count)} طلب</span>` }),
      kpi({ label: tr("متوسط الطلب"), value: money(stats.average_order_value), tone: "teal", iconName: "bag",
        foot: TR`<span>${num(stats.customer_count)} عميل مختلف</span>` }),
      kpi({ label: tr("مستنية رد"), value: num(inbox.__error ? 0 : inbox.counts.needs_reply), tone: "rose", iconName: "inbox",
        foot: inbox.__error ? "" : TR`<span>${num(inbox.counts.all)} محادثة نشطة</span>` }),
      kpi({ label: tr("مخزون خلص"), value: num(inventory.__error ? 0 : inventory.totals.out_of_stock_count),
        tone: "amber", iconName: "boxes",
        foot: inventory.__error ? "" : TR`<span>${num(inventory.totals.low_stock_count)} على وشك الخلاص</span>` }),
    );
    return grid;
  },

  revenueCard(stats) {
    const wrap = el("div");
    if (stats.__error) { wrap.innerHTML = card(tr("المبيعات"), "", errorBanner(stats.__error, tr("المبيعات"))); return wrap; }
    const points = stats.revenue_by_day.map((d) => ({
      label: shortDate(d.date), short: d.date.slice(8), value: Number(d.revenue),
    }));
    wrap.innerHTML = card(tr("المبيعات — آخر ٧ أيام"), tr("من شوبيفاي، البوت والموقع مع بعض"),
      `<div id="ovRevenue"></div>`,
      TR`<a class="btn sm ghost" href="#analytics">التفاصيل</a>`);
    setTimeout(() => {
      const slot = $("#ovRevenue", wrap);
      if (!slot) return;
      slot.innerHTML = "";
      slot.append(points.length
        ? lineChart(points, { tone: "clay", fmt: money, label: tr("مبيعات آخر ٧ أيام") })
        : emptyState(tr("لسه مفيش مبيعات"), tr("أول طلب هيظهر هنا"), "bag"));
    }, 0);
    return wrap;
  },

  attentionCard(inbox, queue, inventory) {
    const rows = [];
    if (!inbox.__error) {
      inbox.conversations.filter((c) => c.paused).slice(0, 4).forEach((c) => rows.push({
        tone: "rose", title: c.display_name || c.external_id,
        sub: TR`${reasonLabel(c.reason)} · مستني من ${ago(c.waiting_since)}`,
        action: () => { state.inbox.selected = c; go("inbox"); openConversation(c.channel, c.external_id); },
      }));
    }
    if (!queue.__error) {
      queue.items.slice(0, 3).forEach((item) => rows.push({
        tone: "amber", title: reasonLabel(item.reason),
        sub: item.summary || tr("بند مراجعة"),
        action: () => go("queue"),
      }));
    }
    if (!inventory.__error) {
      inventory.rows.slice(0, 3).forEach((r) => rows.push({
        tone: "sky", title: `${r.product_title} — ${[r.color, r.size].filter(Boolean).join(" / ")}`,
        sub: TR`فاضل ${r.quantity}`,
        action: () => go("inventory"),
      }));
    }

    const wrap = el("div");
    wrap.innerHTML = card(tr("محتاج تدخّل"), tr("أول حاجة تتعمل النهاردة"), "<div id='ovAttention'></div>", "", { flush: false });
    setTimeout(() => {
      const slot = $("#ovAttention", wrap);
      if (!slot) return;
      slot.innerHTML = "";
      if (!rows.length) { slot.append(emptyState(tr("كل حاجة تمام"), tr("مفيش حاجة مستنية منك دلوقتي"), "check")); return; }
      rows.forEach((r) => {
        const row = el("button", { class: "mini", type: "button", style: "width:100%;text-align:start;background:none;border:0;border-bottom:1px solid var(--line)", onclick: r.action });
        row.innerHTML = `<span class="chip" data-tone="${r.tone}" data-shape="dot"><i class="glyph"></i></span>
          <span class="m1"><span class="a">${esc(r.title)}</span><span class="b">${esc(r.sub)}</span></span>
          ${icon("search", 14)}`;

      });

  ordersCard(stats) {

    if (stats.__error) { wrap.innerHTML = ""; return wrap; }

      label: (ORDER_STATUS[k] || { label: k }).label, value: v,
      tone: (ORDER_STATUS[k] || {}).tone || CHART_TONES[i % CHART_TONES.length],
    }));
    const sources = Object.entries(stats.source_breakdown).map(([k, v]) => ({
      label: k === "chatbot" ? tr("البوت") : tr("الموقع"), value: v, tone: k === "chatbot" ? "teal" : "lilac",
    }));
    wrap.innerHTML = card(tr("الطلبات حسب الحالة"), tr("آخر ٧ أيام"),
      `<div class="donutwrap"><div id="ovDonut"></div>
        <div style="flex:1;min-width:170px">${barList(sources, { tone: "lilac" })}</div></div>`);
    setTimeout(() => {
      const slot = $("#ovDonut", wrap);
      if (!slot) return;
      slot.append(donut(statuses, { center: num(stats.order_count) }));
      slot.insertAdjacentHTML("beforeend", `<div class="legend" style="margin-top:var(--s-3)">${
        statuses.map((s) => `<span><i style="background:${toneVar(s.tone)}"></i>${esc(s.label)} ${num(s.value)}</span>`).join("")
      }</div>`);
    }, 0);
    return wrap;
  },

  stockCard(inventory) {
    const wrap = el("div");
    if (inventory.__error) { wrap.innerHTML = card(tr("المخزون"), "", errorBanner(inventory.__error, tr("المخزون"))); return wrap; }
    const rows = inventory.rows.slice(0, 8).map((r) => ({
      label: `${r.product_title} — ${[r.color, r.size].filter(Boolean).join(" / ") || r.sku}`,
      value: r.quantity, tone: r.quantity === 0 ? "rose" : "amber",
    }));
    wrap.innerHTML = card(tr("على وشك الخلاص"), TR`${num(inventory.totals.low_stock_count)} مقاس`,
      rows.length ? barList(rows, { tone: "amber" }) : TR`<div class="empty"><div class="d">المخزون كويس</div></div>`,
      TR`<a class="btn sm ghost" href="#inventory">كل المخزون</a>`);
    return wrap;
  },
};

   view: الوارد / unified inbox

const INBOX_STATUSES = [
  { id: "all", label: tr("الكل") },
  { id: "needs_reply", label: tr("مستني رد") },
  { id: "unanswered", label: tr("آخر كلمة للعميل") },
  { id: "paused", label: tr("مع الفريق") },
  { id: "bot", label: tr("مع البوت") },
];

VIEWS.inbox = {
  loaded: false,
  async mount(force) {
    $("#pageActions").append(
      el("button", { class: "btn sm", type: "button", html: TR`${icon("refresh", 15)} تحديث`,
        onclick: () => this.load(true) }),
    );
    if (!this.loaded) {
      this.loaded = true;
      this.wire();
    }
    if (force || !state.inbox.items.length) await this.load(true);
    else this.renderList();
  },

  wire() {
    const search = $("#inboxSearch");
    let timer = null;
    search.addEventListener("input", () => {
      clearTimeout(timer);
      timer = setTimeout(() => { state.inbox.q = search.value.trim(); this.load(true); }, 260);
    });

    $("#inboxStatus").innerHTML = INBOX_STATUSES.map((s) => `
      <button class="fchip" type="button" data-status="${s.id}" aria-pressed="${s.id === state.inbox.status}">
        ${esc(s.label)}<span class="n" data-count="${s.id}"></span></button>`).join("");
    $$("#inboxStatus .fchip").forEach((b) => b.addEventListener("click", () => {
      state.inbox.status = b.dataset.status;
      $$("#inboxStatus .fchip").forEach((x) => x.setAttribute("aria-pressed", x === b));
      this.load(true);
    }));

    const channels = [{ id: "", label: tr("كل القنوات") }, { id: "whatsapp", label: tr("واتساب") }, { id: "instagram_dm", label: tr("انستجرام") }];
    $("#inboxChannel").innerHTML = channels.map((c) => `
      <button class="fchip" type="button" data-channel="${c.id}" aria-pressed="${c.id === state.inbox.channel}">
        ${esc(c.label)}<span class="n" data-chcount="${c.id}"></span></button>`).join("");
    $$("#inboxChannel .fchip").forEach((b) => b.addEventListener("click", () => {
      state.inbox.channel = b.dataset.channel;
      $$("#inboxChannel .fchip").forEach((x) => x.setAttribute("aria-pressed", x === b));
      this.load(true);
    }));

    $("#backToList").addEventListener("click", () => $("#view-inbox").classList.remove("reading"));
    $("#sendBtn").addEventListener("click", sendReply);
    const box = $("#replyText");
    box.addEventListener("input", () => {
      box.style.height = "auto";
      box.style.height = `${Math.min(box.scrollHeight, 168)}px`;
    });
    box.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && (event.ctrlKey || event.metaKey)) { event.preventDefault(); sendReply(); }
    });

    // Live-ish: the list refreshes on a timer while this view is open, so a
    // new handoff appears without anyone hitting refresh. Paused only while
    // a drawer is open, so a poll never yanks the list out from under a read.
    //
    // Ten seconds, not twenty: a customer's message now reaches `sessions` on
    // arrival rather than after the bot replies, so this interval is the whole
    // remaining delay between someone writing in and staff seeing it.
    setInterval(() => {
      if (state.route === "inbox" && !overlay.open && document.visibilityState === "visible") this.load(false);
    }, 10000);
  },

  async load(showSpinner) {
    if (showSpinner) $("#convList").innerHTML = Array.from({ length: 7 },
      () => '<div class="skel skel-row" style="height:44px"></div>').join("");

    const params = new URLSearchParams();
    if (state.inbox.q) params.set("q", state.inbox.q);
    if (state.inbox.channel) params.set("channel", state.inbox.channel);
    if (state.inbox.status !== "all") params.set("status", state.inbox.status);
    const data = await api(`/dashboard/api/inbox?${params}`, { quiet: true });
    if (data.__error) {
      $("#convList").innerHTML = `<div style="padding:var(--s-4)">${errorBanner(data.__error, tr("المحادثات"))}</div>`;
      return;
    }
    state.inbox.items = data.conversations;
    state.inbox.counts = data.counts;
    setBadge("inbox", data.counts.needs_reply || 0);
    Object.entries(data.counts).forEach(([k, v]) => {
      const node = $(`#inboxStatus [data-count="${k}"]`);
      if (node) node.textContent = v ? String(v) : "";
    });
    const all = $('#inboxChannel [data-chcount=""]');
    if (all) all.textContent = data.counts.all ? String(data.counts.all) : "";
    Object.entries(data.by_channel).forEach(([k, v]) => {
      const node = $(`#inboxChannel [data-chcount="${k}"]`);
      if (node) node.textContent = String(v);
    });
    this.renderList();
  },

  renderList() {
    const list = $("#convList");
    const items = state.inbox.items;
    if (!items.length) {
      list.innerHTML = "";
      list.append(emptyState(tr("مفيش محادثات هنا"), tr("جرّب فلتر تاني أو امسح البحث"), "inbox"));
      return;
    }
    const selected = state.inbox.selected;
    list.innerHTML = items.map((c) => {
      const info = channelInfo(c.channel);
      const isSelected = selected && selected.channel === c.channel && selected.external_id === c.external_id;
      const tags = [];
      if (c.paused) tags.push(chipHTML(reasonLabel(c.reason), c.reason === "manual" ? "clay" : "rose", "ring"));
      if (c.last_role === "customer" && !c.paused) tags.push(chipHTML(tr("محتاج متابعة"), "amber", "dot"));
      tags.push(chipHTML(info.label, info.tone, "bar"));
      return `<button class="conv" role="option" aria-selected="${!!isSelected}"
          data-ch="${esc(c.channel)}" data-id="${esc(c.external_id)}">
        <span class="avatar" data-ch="${esc(c.channel)}" aria-hidden="true">${esc(info.short)}</span>
        <span class="meta">
          <span class="line1">
            <span class="nm">${esc(c.display_name || c.external_id)}</span>
            <span class="tm">${esc(ago(c.updated_at))}</span>
          </span>
          <span class="pv">${esc(c.preview || "—")}</span>
          <span class="tags">${tags.join("")}</span>
        </span>
      </button>`;
    }).join("");
    $$(".conv", list).forEach((node) => node.addEventListener("click", () =>
      openConversation(node.dataset.ch, node.dataset.id)));
  },
};

/* --- one conversation ------------------------------------------------------ */

/* How far one outbound message got on the customer's side, as WhatsApp's own
   ticks: one for accepted, two for delivered to the handset, two coloured for
   opened. `null` is deliberately not a state -- a message with no receipt is
   one nothing has been reported about (sent before receipts were recorded, or
   a channel that has none), and drawing an "unread" mark for it would be
   inventing a fact. "Delivered" is what genuinely means not-read-yet. */
const RECEIPT_STATES = {
  sent:      { ticks: 1, label: tr("اتبعتت") },
  delivered: { ticks: 2, label: tr("وصلت للعميل") },
  read:      { ticks: 2, label: tr("العميل شافها") },
};

function receiptHTML(state) {
  const spec = RECEIPT_STATES[state];
  if (!spec) return "";
  const ticks = icon("check", 11).repeat(spec.ticks);
  return `<span class="ticks" data-state="${esc(state)}" title="${esc(spec.label)}"
    role="img" aria-label="${esc(spec.label)}">${ticks}</span>`;
}

/* The footer line under a bubble: its own time, and for an outbound message
   on a channel that reports them, its receipt. `receipts` is the caller's
   decision, not this function's -- a customer's own message and an Instagram
   thread both pass false, for different reasons. */
function appendMeta(bubble, item, { receipts }) {
  const stamp = bubbleTime(item.at);
  const ticks = receipts ? receiptHTML(item.receipt) : "";
  if (!stamp && !ticks) return;
  // Messages stored before per-message timestamps existed have no `at`. They
  // show the rest of the line and no time, rather than a made-up one.
  const title = item.at ? dateTime(item.at) : tr("رسالة قديمة من قبل ما نسجّل التوقيت");
  bubble.insertAdjacentHTML("beforeend",
    `<span class="meta" title="${esc(title)}"><span>${esc(stamp)}</span>${ticks}</span>`);
}

async function openConversation(channel, externalId) {
  state.inbox.selected = { channel, external_id: externalId };
  $("#view-inbox").classList.add("reading");
  $$(".conv").forEach((n) => n.setAttribute("aria-selected",
    String(n.dataset.ch === channel && n.dataset.id === externalId)));

  $("#threadHead").hidden = false;
  $("#backToList").style.display = window.innerWidth <= 900 ? "" : "none";
  $("#log").innerHTML = '<div class="skel" style="height:70%;margin:auto;width:100%;max-width:520px"></div>';

  const data = await api(`/dashboard/api/conversations/${encodeURIComponent(channel)}/${encodeURIComponent(externalId)}`, { quiet: true });
  if (data.__error) {
    $("#log").innerHTML = errorBanner(data.__error, tr("المحادثة"));
    return;
  }
  state.inbox.detail = data;
  renderThread(data);
}

function renderThread(data) {
  const info = channelInfo(data.channel);
  $("#threadAvatar").textContent = info.short;
  $("#threadAvatar").dataset.ch = data.channel;
  // The server names the conversation (`web.customer_labels`). This used to
  // hunt the loaded inbox list for a matching row, so opening a thread from
  // search, from the command palette or from the dashboard's attention card
  // -- anywhere the row was not in `state.inbox.items` -- fell back to the
  // raw id even for a customer whose name we hold.
  $("#threadName").textContent = data.display_name || data.external_id;
  $("#threadSub").innerHTML = TR`${chipHTML(info.label, info.tone, "bar")}
    <span class="num" data-copy="${esc(data.external_id)}" data-copy-what="المعرّف"
      style="cursor:pointer" title="اضغط للنسخ">${esc(data.external_id)}</span>
    ${data.paused ? chipHTML(reasonLabel(data.reason), "rose", "ring") : chipHTML(tr("البوت شغال"), "teal", "dot")}`;

  const actions = $("#threadActions");
  actions.innerHTML = "";
  if (data.paused) {
    actions.append(el("button", { class: "btn sm", type: "button", html: TR`${icon("bot", 14)} رجّع البوت`,
      onclick: () => conversationAction("release", tr("الرد رجع للبوت")) }));
  } else {
    actions.append(el("button", { class: "btn sm", type: "button", html: TR`${icon("user", 14)} استلم المحادثة`,
      onclick: () => conversationAction("takeover", tr("المحادثة بقت معاك")) }));
  }
  actions.append(el("button", {
    class: "btn sm icon ghost", type: "button", title: tr("إعادة تعيين المحادثة"), "aria-label": tr("إعادة تعيين المحادثة"),
    html: icon("refresh", 15),
    onclick: async () => {
      const ok = await overlay.confirm(tr("إعادة تعيين المحادثة؟"),
        tr("ده بيمسح تاريخ المحادثة والسلة عشان العميل يبدأ من الأول. بيانات العميل وطلباته مش بتتمس."),
        tr("امسح وابدأ من الأول"), { danger: true });
      if (ok) conversationAction("reset", tr("المحادثة رجعت من الأول"));
    },
  }));

  const log = $("#log");
  log.innerHTML = "";
  if (!data.history.length) {
    log.append(emptyState(tr("المحادثة فاضية"), tr("لسه محصلش كلام هنا"), "inbox"));
  }
  for (const item of data.history) {
    if (item.kind === "user") {
      const bubble = el("div", { class: "bubble user" });
      bubble.innerHTML = TR`<span class="by">${icon("user", 11)} العميل</span>${esc(item.text || "")}`;
      (item.images || []).forEach((src) => bubble.insertAdjacentHTML("beforeend",
        TR`<img class="att" loading="lazy" alt="صورة من العميل" src="${mediaURL(src)}">`));
      (item.audio || []).forEach((src) => bubble.insertAdjacentHTML("beforeend",
        `<audio controls preload="none" src="${mediaURL(src)}"></audio>`));
      // Time only. A customer's own message has no "seen" state to show --
      // that is about what *they* have read, and the only thing the shop can
      // know is the other direction.
      appendMeta(bubble, item, { receipts: false });
      log.append(bubble);
    } else if (item.kind === "bot") {
      // Three voices, not two: the model, a staff member, and the automated
      // pushes (order confirmation, shipping updates, back-in-stock, cart
      // nudges) that the shop sends on its own. They all reach the same
      // WhatsApp thread, so the transcript has to say which is which.
      const who = item.by === "staff" ? "staff" : item.by === "system" ? "system" : "bot";
      const LABEL = { staff: tr("الفريق"), system: tr("رسالة تلقائية"), bot: tr("البوت") };
      const GLYPH = { staff: "user", system: "spark", bot: "bot" };
      // ...and a fourth thing the transcript has to say: whether it arrived.
      // Outside Meta's 24-hour window an automated push is refused outright,
      // and a thread that showed those exactly like delivered messages is how
      // an order update nobody received went unnoticed for days.
      const failed = item.delivery === "failed";
      const bubble = el("div", { class: `bubble ${who}${failed ? " undelivered" : ""}` });
      bubble.innerHTML = `<span class="by">${icon(GLYPH[who], 11)} ${LABEL[who]}</span>${esc(item.text || "")}`;
      if (failed) {
        bubble.insertAdjacentHTML("beforeend",
          TR`<span class="undelivered-note">${icon("alert", 11)} مـا وصلتش للعميل — محتاجة متابعة بالتليفون</span>`);
      }
      (item.attachments || []).forEach((src) => bubble.insertAdjacentHTML("beforeend",
        TR`<img class="att" loading="lazy" alt="صورة اتبعتت للعميل" src="${mediaURL(src)}">`));
      // Outbound: the time, and how far it got on the customer's side. A
      // message that never left has no receipt worth showing -- the red note
      // above already says what happened to it.
      appendMeta(bubble, item, { receipts: data.receipts && !failed });
      log.append(bubble);
    } else if (item.kind === "tools") {
      log.append(el("div", { class: "sysline", html: `${icon("spark", 12)} ${esc((item.names || []).join(tr("، ")))}` }));
    } else if (item.kind === "refusals") {
      log.append(el("div", { class: "sysline", dataset: { tone: "bad" },
        html: `${icon("alert", 12)} ${esc((item.refusals || []).map((r) => `${r.name}: ${r.error}`).join(" · "))}` }));
    }
  }
  log.scrollTop = log.scrollHeight;

  const composer = $("#composer");
  composer.hidden = false;
  $("#replyText").disabled = !data.paused;
  $("#sendBtn").disabled = !data.paused;
  $("#quickReplies").innerHTML = data.paused ? QUICK_REPLIES.map((q) =>
    `<button type="button">${esc(q)}</button>`).join("") : "";
  $$("#quickReplies button").forEach((b) => b.addEventListener("click", () => {
    const box = $("#replyText");
    box.value = box.value ? `${box.value} ${b.textContent}` : b.textContent;
    box.focus();
  }));
  $("#composerNote").innerHTML = data.paused
    ? TR`${icon("check", 13)} المحادثة معاك — البوت مش هيرد لحد ما تدوس «رجّع البوت».`
    : TR`${icon("bot", 13)} البوت ماسك المحادثة دلوقتي — استلمها الأول عشان ترد بنفسك.`;

  renderContext(data, summary);
}

const QUICK_REPLIES = [
  "أهلاً بيك 👋 معاك فريق ونس",
  "بنراجع طلبك دلوقتي وهنرد عليك حالاً",
  "الطلب اتشحن وهيوصلك خلال ٢-٤ أيام",
  "آسفين على التأخير، تحت أمرك",
];

function mediaURL(path) {
  if (/^https?:\/\//i.test(path)) return path;
  return `/dashboard/media?path=${encodeURIComponent(path)}`;
}

async function conversationAction(action, successMessage) {
  const { channel, external_id: externalId } = state.inbox.selected;
  const result = await api(
    `/dashboard/api/conversations/${encodeURIComponent(channel)}/${encodeURIComponent(externalId)}/${action}`,
    { method: "POST", quiet: true },
  );
  if (result.__error) return toastError(result.__error, tr("الأمر مانفذش"));
  toast(successMessage);
  await VIEWS.inbox.load(false);
  openConversation(channel, externalId);
}

async function sendReply() {
  const box = $("#replyText");
  const text = box.value.trim();
  if (!text) return;
  const { channel, external_id: externalId } = state.inbox.selected;
  $("#sendBtn").disabled = true;
  const result = await api(
    `/dashboard/api/conversations/${encodeURIComponent(channel)}/${encodeURIComponent(externalId)}/reply`,
    { method: "POST", body: { text }, quiet: true },
  );
  $("#sendBtn").disabled = false;
  if (result.__error) {
    // 409 here means the bot took the conversation back between load and
    // send; saying so is the difference between "try again" and "why".
    const REASONS = {
      not_paused: tr("المحادثة مش معاك — استلمها الأول وابعت"),
      // Meta's 24-hour rule. Nothing typed here can get through it, so the
      // only honest next step is a phone call.
      outside_window: tr("عدى أكتر من ٢٤ ساعة على آخر رسالة من العميل — واتساب مش هيوصّل رسالة مكتوبة. كلّمه بالتليفون"),
    };
    const message = REASONS[result.__error.code] || result.__error.message;
    return toast(tr("الرسالة مابعتتش"), message, "bad", 6000);
  }
  box.value = "";
  box.style.height = "auto";
  toast(tr("الرسالة اتبعتت"), tr("المحادثة لسه معاك — دوس «رجّع البوت» لما تخلص"));
  await VIEWS.inbox.load(false);
  openConversation(channel, externalId);
}

function renderContext(data, summary) {
  const context = $("#threadContext");
  $("#view-inbox").classList.add("with-context");
  context.hidden = false;
  const blocks = [];

  blocks.push(TR`<div class="ctx-block">
    <h3>الحالة</h3>
    <div class="kv"><span class="k">القناة</span><span class="v">${esc(channelInfo(data.channel).label)}</span></div>
    ${data.customer_name ? TR`<div class="kv"><span class="k">الاسم</span><span class="v">${esc(data.customer_name)}</span></div>` : ""}
    ${data.customer_phone && data.customer_phone !== data.external_id
      ? TR`<div class="kv"><span class="k">التليفون</span><span class="v num">${esc(data.customer_phone)}</span></div>` : ""}
    <div class="kv"><span class="k">المعرّف</span><span class="v num">${esc(data.external_id)}</span></div>
    <div class="kv"><span class="k">المسؤول</span><span class="v">${data.paused ? tr("الفريق") : tr("البوت")}</span></div>
    ${summary ? TR`<div class="kv"><span class="k">آخر نشاط</span><span class="v">${esc(dateTime(summary.updated_at))}</span></div>` : ""}
    ${summary ? TR`<div class="kv"><span class="k">عدد الرسايل</span><span class="v num">${num(summary.message_count)}</span></div>` : ""}
  </div>`);

  if (data.reason && data.reason !== "manual") {
    blocks.push(TR`<div class="ctx-block">
      <h3>سبب التحويل</h3>
      <div class="banner" style="margin-bottom:var(--s-2)">${icon("alert", 15)}<div>${esc(reasonLabel(data.reason))}</div></div>
      ${data.summary ? `<p style="font-size:12.5px;color:var(--ink-2)">${esc(data.summary)}</p>` : ""}
    </div>`);
  }

  if (summary && summary.client_id) {
    blocks.push(TR`<div class="ctx-block" id="ctxClient"><h3>العميل</h3>
      <div class="skel skel-row" style="margin:0 0 8px"></div></div>`);
  }

  context.innerHTML = blocks.join("");

  if (summary && summary.client_id) {
    api(`/dashboard/api/customers/${summary.client_id}`, { quiet: true }).then((client) => {
      const slot = $("#ctxClient", context);
      if (!slot || client.__error) return;
      slot.innerHTML = TR`<h3>العميل</h3>
        <div class="kv"><span class="k">الاسم</span><span class="v">${esc(client.full_name)}</span></div>
        <div class="kv"><span class="k">التليفون</span><span class="v num" data-copy="${esc(client.phone)}" data-copy-what="التليفون" style="cursor:pointer">${esc(client.phone)}</span></div>
        <div class="kv"><span class="k">المحافظة</span><span class="v">${esc(client.governorate || "—")}</span></div>
        <div class="kv"><span class="k">العنوان</span><span class="v">${esc(client.address || "—")}</span></div>
        <h3 style="margin-top:var(--s-4)">آخر الطلبات</h3>
        ${client.orders.length ? client.orders.slice(0, 5).map((o) => `
          <div class="kv"><span class="k num">${esc(o.reference)}</span>
          <span class="v">${esc(money(o.total))} · ${esc(o.status)}</span></div>`).join("")
          : tr('<div class="kv"><span class="v" style="color:var(--ink-3)">مفيش طلبات</span></div>')}`;
    });
  }
}

/* ==========================================================================
   view: الطلبات / orders
   ========================================================================== */

/* Shopify's search syntax is powerful and nobody remembers it. These are the
   filters staff actually ask for, written once, as buttons. */
const ORDER_PRESETS = [
  { id: "", label: tr("الكل"), q: "" },
  { id: "open", label: tr("مستنية شحن"), q: "fulfillment_status:unfulfilled AND status:open" },
  { id: "shipped", label: tr("متشحنة"), q: "fulfillment_status:shipped" },
  // Delivery is not part of `fulfillment_status` -- that one stops at
  // "fulfilled". Shopify's search has its own key for the carrier's account
  // of where the parcel got to, which is the same thing the التوصيل column
  // reads off the fulfillment.
  { id: "delivered", label: tr("متسلّمة"), q: "delivery_status:delivered" },
  { id: "bot", label: tr("من البوت"), q: "tag:chatbot" },
  { id: "site", label: tr("من الموقع"), q: "-tag:chatbot" },
  { id: "cancelled", label: tr("ملغية"), q: "status:cancelled" },
  // Payment status. Shopify's own search expresses this one, so unlike the
  // payment *method* toggle beside it (which is classified server-side from
  // the tags) these cost nothing but a query string.
  { id: "paid", label: tr("مدفوعة"), q: "financial_status:paid" },
  { id: "unpaid", label: tr("مستنية دفع"), q: "financial_status:pending" },
  { id: "refunded", label: tr("مسترجعة"), q: "financial_status:refunded" },
];

/* The two server-side toggles. Unlike ORDER_PRESETS above these are *not*
   Shopify search syntax: `payment` is classified from the order's gateways
   and `customer` from the buyer's lifetime order count, neither of which the
   search query can express -- see `integrations/shopify/admin_orders.py`. */
const ORDER_PAYMENTS = [
  { id: "all", label: tr("كل الدفع") },
  { id: "cod", label: tr("عند الاستلام") },
  { id: "online", label: tr("أونلاين") },
];
const ORDER_CUSTOMERS = [
  { id: "all", label: tr("كل العملاء") },
  { id: "returning", label: tr("عملاء قدامى") },
  { id: "new", label: tr("عملاء جدد") },
];

VIEWS.orders = {
  preset: "", search: "", payment: "all", customer: "all", rows: [], truncated: false,

  async mount(force) {
    $("#pageActions").append(
      el("button", { class: "btn sm", type: "button", html: TR`${icon("download", 15)} تصدير`,
        onclick: () => this.export() }),
      el("button", { class: "btn sm", type: "button", html: TR`${icon("refresh", 15)} تحديث`,
        onclick: () => this.load() }),
    );
    if (force || !this.rows.length) await this.load();
    else this.render();
  },

  async load() {
    const body = $("#ordersBody");
    body.innerHTML = this.toolbar() + skeletonTable(8);
    this.wire();
    const preset = ORDER_PRESETS.find((p) => p.id === this.preset);
    const parts = [preset && preset.q, this.search].filter(Boolean);
    const query = parts.join(" AND ");
    const params = new URLSearchParams();
    if (query) params.set("q", query);
    if (this.payment !== "all") params.set("payment", this.payment);
    if (this.customer !== "all") params.set("customer", this.customer);
    const qs = params.toString();
    const data = await api(`/dashboard/api/shopify/orders${qs ? `?${qs}` : ""}`, { quiet: true });
    if (data.__error) { body.innerHTML = this.toolbar() + errorBanner(data.__error, tr("الطلبات")); this.wire(); return; }
    this.rows = data.orders;
    this.truncated = !!data.truncated;
    this.render();
  },

  toolbar() {
    return TR`<div class="pagehead">
      <div class="t">
        <h2>الطلبات</h2>
        <div class="d">مصدرها شوبيفاي مباشرة — طلبات البوت وطلبات الموقع مع بعض</div>
      </div>
      <div class="row">
        <div class="field" style="min-width:230px">
          ${icon("search", 15)}
          <input id="ordersSearch" type="search" placeholder="رقم طلب، اسم، أو صيغة شوبيفاي" value="${esc(this.search)}">
        </div>
        <div class="seg">
          ${ORDER_CUSTOMERS.map((c) => `<button type="button" data-ocust="${c.id}"
            aria-pressed="${c.id === this.customer}">${esc(c.label)}</button>`).join("")}
        </div>
        <div class="seg">
          ${ORDER_PAYMENTS.map((p) => `<button type="button" data-opay="${p.id}"
            aria-pressed="${p.id === this.payment}">${esc(p.label)}</button>`).join("")}
        </div>
      </div>
      <div class="inbox-filters" style="width:100%">
        ${ORDER_PRESETS.map((p) => `<button class="fchip" type="button" data-preset="${p.id}"
          aria-pressed="${p.id === this.preset}">${esc(p.label)}</button>`).join("")}
      </div>
    </div>`;
  },

  wire() {
    const search = $("#ordersSearch");
    if (search) {
      search.addEventListener("keydown", (event) => {
        if (event.key === "Enter") { this.search = search.value.trim(); this.load(); }
      });
    }
    $$("[data-preset]").forEach((b) => b.addEventListener("click", () => {
      this.preset = b.dataset.preset; this.load();
    }));
    $$("[data-ocust]").forEach((b) => b.addEventListener("click", () => {
      this.customer = b.dataset.ocust; this.load();
    }));
    $$("[data-opay]").forEach((b) => b.addEventListener("click", () => {
      this.payment = b.dataset.opay; this.load();
    }));
  },

  render() {
    const body = $("#ordersBody");
    const totals = this.rows.reduce((acc, o) => {
      if (!o.cancelled) { acc.revenue += Number(o.total) || 0; acc.count += 1; }
      if (o.source === "chatbot") acc.bot += 1;
      if ((o.fulfillment_status || "UNFULFILLED") === "UNFULFILLED" && !o.cancelled) acc.pending += 1;
      return acc;
    }, { revenue: 0, count: 0, bot: 0, pending: 0 });

    const rowsHTML = this.rows.map((o) => `
      <tr data-clickable data-gid="${esc(o.id)}">
        <td><div class="cellmain num">${esc(o.name)}</div>
            <div class="cellsub">${esc(shortDate(o.created_at))}</div></td>
        <td><div class="cellmain">${esc(o.customer_name || "—")}</div>
            <div class="cellsub num">${esc(o.customer_phone || "")}</div></td>
        <td>${esc(o.governorate || "—")}</td>
        <td>${(o.line_items || []).length ? esc(TR`${o.line_items.length} صنف`) : "—"}</td>
        <td>${statusChip(o.fulfillment_status, o.cancelled)}</td>
        <td>${o.cancelled ? `<span class="cellsub">—</span>` : deliveryChip(o.delivery_status)}</td>
        <td>${financialChip(o.financial_status)}</td>
        <td>${paymentChip(o.payment_method)}</td>
        <td>${customerKindChip(o.customer_kind, o.customer_order_count)}</td>
        <td>${chipHTML(channelLabel(o.channel), o.channel === "web" ? "lilac" : "teal")}</td>
        <td class="num">${esc(money(o.total))}</td>
      </tr>`).join("");

    const truncated = this.truncated
      ? TR`<div class="banner">${icon("alert", 15)}
          <div>الطلبات المطابقة أكتر من اللي بنقراه في نداء واحد — الأرقام دي حد أدنى، مش كل الفترة.</div></div>`
      : "";

    body.innerHTML = this.toolbar() + truncated + `
      <div class="grid g-kpi">
        ${[[tr("إجمالي المعروض"), money(totals.revenue), "clay", "money"],
           [tr("طلبات فعّالة"), num(totals.count), "teal", "bag"],
           [tr("مستنية شحن"), num(totals.pending), "amber", "truck"],
           [tr("من البوت"), num(totals.bot), "lilac", "bot"]]
          .map(([l, v, t, ic]) => `<div class="card kpi" style="--accent:${toneVar(t)}">
            <div class="kpi-label">${icon(ic, 14)}${esc(l)}</div>
            <div class="kpi-value">${esc(v)}</div></div>`).join("")}
      </div>` +
      (this.rows.length
        ? card(tr("قائمة الطلبات"), TR`${this.rows.length} طلب`, tableHTML(
            [tr("الطلب"), tr("العميل"), tr("المحافظة"), tr("الأصناف"), tr("الشحن"), tr("التوصيل"), tr("حالة الدفع"), tr("الدفع"), tr("العميل ده"), tr("المصدر"),
             { label: tr("الإجمالي"), num: true }],
            rowsHTML, { minWidth: 1160 }), "", { flush: true })
        : `<div class="card"><div class="card-body"></div></div>`);

    this.wire();
    if (!this.rows.length) {
      $("#ordersBody .card:last-child .card-body").append(
        emptyState(tr("مفيش طلبات بالفلتر ده"), tr("جرّب فلتر تاني أو امسح البحث"), "bag"));
    }
    $$("#ordersBody tr[data-gid]").forEach((tr) =>
      tr.addEventListener("click", () => openOrder(tr.dataset.gid)));
  },

  export() {
    if (!this.rows.length) return toast(tr("مفيش بيانات للتصدير"), "", "warn");
    exportCSV("orders.csv",
      [tr("رقم الطلب"), tr("التاريخ"), tr("العميل"), tr("التليفون"), tr("المحافظة"), tr("الحالة"),
       tr("التوصيل"), tr("حالة الدفع"), tr("الدفع"),
       tr("عميل قديم/جديد"), tr("عدد طلباته"), tr("القناة"), tr("المصدر"), tr("الإجمالي")],
      this.rows.map((o) => [o.name, o.created_at, o.customer_name, o.customer_phone,
        o.governorate, o.cancelled ? tr("ملغي") : (o.fulfillment_status || ""),
        (DELIVERY_STATUS[o.delivery_status] || {}).label || o.delivery_status || "",
        (FINANCIAL_STATUS[o.financial_status] || {}).label || o.financial_status,
        PAYMENT_LABELS[o.payment_method] || o.payment_method,
        CUSTOMER_KIND_LABELS[o.customer_kind] || o.customer_kind, o.customer_order_count,
        channelLabel(o.channel), o.source, o.total]));
  },
};

async function openOrder(gid) {
  const body = overlay.drawer(tr("جاري التحميل…"), '<div class="skel" style="height:260px"></div>');
  const order = await api(`/dashboard/api/shopify/orders/${encodeURIComponent(gid)}`, { quiet: true });
  if (order.__error) { body.innerHTML = errorBanner(order.__error, tr("الطلب")); return; }

  $("#drawerTitle").textContent = TR`طلب ${order.name}`;
  const lines = (order.line_items || []).map((li) => `
    <tr>
      <td><div class="cellmain">${esc(li.title || "—")}</div><div class="cellsub num">${esc(li.sku || "")}</div></td>
      <td class="num">${num(li.quantity)}</td>
      <td>${li.sku ? TR`<button class="btn sm ghost" type="button" data-qty="${esc(li.sku)}" data-cur="${num(li.quantity)}">تعديل الكمية</button>` : ""}</td>
    </tr>`).join("");

  body.innerHTML = `
    <div class="row" style="margin-bottom:var(--s-4)">
      ${statusChip(order.fulfillment_status, order.cancelled)}
      ${order.cancelled ? "" : deliveryChip(order.delivery_status)}
      ${financialChip(order.financial_status)}
      ${chipHTML(order.local ? tr("طلب البوت") : tr("طلب الموقع"), order.local ? "teal" : "lilac")}
      <span class="spacer"></span>
      <span class="cellsub">${esc(dateTime(order.created_at))}</span>
    </div>

    <div class="grid g-2" style="margin-bottom:var(--s-4)">
      ${card(tr("العميل"), "", TR`
        <div class="kv"><span class="k">الاسم</span><span class="v">${esc(order.customer_name || "—")}</span></div>
        <div class="kv"><span class="k">التليفون</span><span class="v num" data-copy="${esc(order.customer_phone || "")}" data-copy-what="التليفون" style="cursor:pointer">${esc(order.customer_phone || "—")}</span></div>
        <div class="kv"><span class="k">المحافظة</span><span class="v">${esc(order.governorate || "—")}</span></div>
        <div class="kv"><span class="k">العنوان</span><span class="v">${esc(order.address || "—")}</span></div>`)}
      ${card(tr("الحساب"), "", TR`
        <div class="kv"><span class="k">المنتجات</span><span class="v num">${esc(money(order.subtotal))}</span></div>
        <div class="kv"><span class="k">الشحن</span><span class="v num">${esc(money(order.shipping_fee))}</span></div>
        <div class="kv" style="border-top:1px solid var(--line);margin-top:6px;padding-top:8px">
          <span class="k" style="font-weight:700">الإجمالي</span>
          <span class="v num" style="font-size:16px;font-weight:700">${esc(money(order.total))}</span></div>
        ${order.note ? TR`<div class="kv"><span class="k">ملاحظة</span><span class="v">${esc(order.note)}</span></div>` : ""}`)}
    </div>

    ${card(tr("الأصناف"), "", tableHTML([tr("الصنف"), { label: tr("الكمية"), num: true }, ""], lines, { minWidth: 420 }), "", { flush: true })}
    ${order.fulfillment_access === false ? TR`<div class="banner" style="margin-top:var(--s-4)">
      ${icon("alert", 16)}
      <div><strong>الشحن من هنا مقفول</strong><br>صلاحية أوامر الشحن مش مدّية للتطبيق على شوبيفاي. الطلب بيتقرا عادي، لكن الشحن لازم يتعمل من لوحة شوبيفاي لحد ما الصلاحية تتضاف.</div>
    </div>` : ""}`;

  const foot = [];
  if (!order.cancelled) {
    if (order.fulfillment_access !== false) {
      foot.push(el("button", { class: "btn primary", type: "button", html: TR`${icon("truck", 15)} شحن الطلب`,
        onclick: () => fulfillForm(order) }));
    }
    // Delivery, before payment on purpose: for a cash-on-delivery order this
    // *is* the payment button. Marking it delivered settles it -- locally and
    // on Shopify -- so staff should reach for this one and only fall back to
    // "علّم كمدفوع" for an order that settled some other way.
    if (order.fulfillment_status !== "UNFULFILLED" && order.delivery_status !== "DELIVERED") {
      foot.push(el("button", { class: "btn", type: "button", html: TR`${icon("check", 15)} علّم كمتسلّم`,
        onclick: async () => {
          const cod = order.payment_method === "cod";
          const ok = await overlay.confirm(tr("العميل استلم الطلب؟"),
            cod
              ? TR`طلب ${order.name} هيتسجل متسلّم، وبما إنه دفع عند الاستلام هيتسجل مدفوع كمان.`
              : TR`طلب ${order.name} هيتسجل متسلّم على شوبيفاي.`,
            tr("أيوة، استلمه"));
          if (!ok) return;
          const result = await api(`/dashboard/api/shopify/orders/${encodeURIComponent(gid)}/mark-delivered`,
            { method: "POST", quiet: true });
          if (result.__error) {
            // Naming the missing scope, not repeating Shopify's sentence about
            // it: the person reading this toast is the person who can add it.
            if (result.__error.code === "delivery_scope_missing") {
              return toast(tr("التسليم من هنا مقفول"),
                tr("صلاحية write_fulfillments مش مدّية للتطبيق على شوبيفاي"), "bad", 7000);
            }
            return toastError(result.__error, tr("التسجيل مانفذش"));
          }
          toast(tr("الطلب اتسجل متسلّم"), cod ? tr("واتسجل مدفوع") : "");
          openOrder(gid);
          VIEWS.orders.load();
        } }));
    }
    // The money moves in the street, so nothing but a person can tell this
    // shop the order settled. One way only -- Shopify has no "mark as unpaid"
    // to offer back. Marking it delivered above does this by itself for a
    // cash-on-delivery order; this is for the ones that settled some other
    // way, and it is hidden once the order is paid.
    if (order.financial_status !== "PAID") {
      foot.push(el("button", { class: "btn", type: "button", html: TR`${icon("money", 15)} علّم كمدفوع`,
        onclick: async () => {
          const ok = await overlay.confirm(tr("تأكيد استلام الفلوس؟"),
            TR`طلب ${order.name} هيتسجل مدفوع على شوبيفاي. مفيش رجوع في الخطوة دي.`,
            tr("أيوة، اتسلمت"));
          if (!ok) return;
          const result = await api(`/dashboard/api/shopify/orders/${encodeURIComponent(gid)}/mark-paid`,
            { method: "POST", quiet: true });
          if (result.__error) return toastError(result.__error, tr("التسجيل مانفذش"));
          toast(tr("الطلب اتسجل مدفوع"));
          openOrder(gid);
          VIEWS.orders.load();
        } }));
    }
    foot.push(el("button", { class: "btn danger", type: "button", html: TR`${icon("x", 15)} إلغاء الطلب`,
      onclick: async () => {
        const ok = await overlay.confirm(tr("إلغاء الطلب؟"),
          TR`طلب ${order.name} هيتلغي${order.local ? tr(" وهيترجع للمخزون، والعميل هيوصله إشعار") : tr(" على شوبيفاي")}.`,
          tr("أكيد، ألغِ الطلب"), { danger: true });
        if (!ok) return;
        const result = await api(`/dashboard/api/shopify/orders/${encodeURIComponent(gid)}/cancel`,
          { method: "POST", quiet: true });
        if (result.__error) return toastError(result.__error, tr("الإلغاء مانفذش"));
        toast(tr("الطلب اتلغى"));
        overlay.close();
        VIEWS.orders.load();
      } }));
  }
  foot.push(el("button", { class: "btn ghost", type: "button", text: tr("نسخ رقم الطلب"),
    onclick: () => copy(order.name, tr("رقم الطلب")) }));
  $("#drawerFoot").innerHTML = "";
  $("#drawerFoot").append(...foot);
  $("#drawerFoot").hidden = false;

  $$("[data-qty]", body).forEach((button) => button.addEventListener("click", () =>
    quantityForm(gid, button.dataset.qty, Number(button.dataset.cur))));
}

function fulfillForm(order) {
  const form = el("div");
  form.innerHTML = TR`
    <p class="hint" style="margin-bottom:var(--s-4)">شحن ${esc(order.name)}. رقم التتبع اختياري، لكنه اللي بيوصل للعميل في رسالة الشحن.</p>
    <label class="lbl" for="trackNo">رقم التتبع</label>
    <input class="inp" id="trackNo" placeholder="مثلاً 1234567890">
    <div style="height:var(--s-3)"></div>
    <label class="lbl" for="trackCo">شركة الشحن</label>
    <input class="inp" id="trackCo" placeholder="مثلاً بوسطة">
    <div style="height:var(--s-3)"></div>
    <label class="row" style="gap:var(--s-2);cursor:pointer">
      <input type="checkbox" id="notifyCust" checked> <span style="font-size:13px">ابعت إشعار للعميل من شوبيفاي</span>
    </label>`;
  const confirm = el("button", { class: "btn primary", text: tr("أكّد الشحن"), onclick: async () => {
    confirm.disabled = true;
    const result = await api(`/dashboard/api/shopify/orders/${encodeURIComponent(order.id)}/fulfill`, {
      method: "POST", quiet: true,
      body: {
        tracking_number: $("#trackNo").value.trim(),
        tracking_company: $("#trackCo").value.trim(),
        notify_customer: $("#notifyCust").checked,
      },
    });
    if (result.__error) { confirm.disabled = false; return toastError(result.__error, tr("الشحن مانفذش")); }
    // The form *and* the drawer behind it: the order that drawer is showing
    // was just shipped, and the list underneath is about to say so.
    overlay.closeAll();
    toast(tr("الطلب اتشحن"), tr("العميل هيوصله التتبع"));
    VIEWS.orders.load();
  } });
  overlay.modal(tr("شحن الطلب"), form, [confirm, el("button", { class: "btn", text: tr("إلغاء"), onclick: () => overlay.close() })]);
}

function quantityForm(gid, sku, current) {
  const form = el("div");
  form.innerHTML = TR`
    <p class="hint" style="margin-bottom:var(--s-4)">تعديل كمية <span class="num">${esc(sku)}</span>. صفر معناه شيل الصنف من الطلب.</p>
    <label class="lbl" for="qtyVal">الكمية الجديدة</label>
    <input class="inp num" id="qtyVal" type="number" min="0" step="1" value="${current}">`;
  const save = el("button", { class: "btn primary", text: tr("احفظ"), onclick: async () => {
    const quantity = parseInt($("#qtyVal").value, 10);
    if (!Number.isInteger(quantity) || quantity < 0) return toast(tr("رقم غير صحيح"), "", "warn");
    save.disabled = true;
    const result = await api(`/dashboard/api/shopify/orders/${encodeURIComponent(gid)}/quantity`, {
      method: "POST", quiet: true, body: { variant_id: sku, quantity },
    });
    if (result.__error) { save.disabled = false; return toastError(result.__error, tr("التعديل مانفذش")); }
    overlay.close();
    toast(tr("الكمية اتعدلت"));
    openOrder(gid);
  } });
  overlay.modal(tr("تعديل الكمية"), form, [save, el("button", { class: "btn", text: tr("إلغاء"), onclick: () => overlay.close() })]);
}

VIEWS.products = {
  rows: [], search: "",

  async mount(force) {
    $("#pageActions").append(
      el("button", { class: "btn sm primary", type: "button", html: TR`${icon("plus", 15)} منتج جديد`,
        onclick: productCreateForm }),
      el("button", { class: "btn sm", type: "button", html: TR`${icon("refresh", 15)} تحديث`, onclick: () => this.load() }),
    );
    if (force || !this.rows.length) await this.load();
    else this.render();
  },

  async load() {
    const body = $("#productsBody");
    body.innerHTML = this.toolbar() + skeletonTable(8);
    this.wire();
    const data = await api(`/dashboard/api/shopify/products${this.search ? `?q=${encodeURIComponent(this.search)}` : ""}`, { quiet: true });
    if (data.__error) { body.innerHTML = this.toolbar() + errorBanner(data.__error, tr("المنتجات")); this.wire(); return; }
    this.rows = data.products;
    this.render();
  },

  toolbar() {
    return TR`<div class="pagehead">
      <div class="t"><h2>المنتجات</h2>
        <div class="d">الإنشاء والتعديل بيروح لشوبيفاي الأول، وبعدين بيتسجل محليًا</div></div>
      <div class="field" style="min-width:240px">${icon("search", 15)}
        <input id="prodSearch" type="search" placeholder="اسم المنتج أو صيغة شوبيفاي" value="${esc(this.search)}"></div>
    </div>`;
  },

  wire() {
    const search = $("#prodSearch");
    if (search) search.addEventListener("keydown", (event) => {
      if (event.key === "Enter") { this.search = search.value.trim(); this.load(); }
    });
  },

  render() {
    const body = $("#productsBody");
    const rowsHTML = this.rows.map((p) => `
      <tr data-clickable data-gid="${esc(p.id)}">
        <td style="width:56px">${p.image_url
          ? `<img class="thumb" src="${esc(p.image_url)}" alt="" loading="lazy">`
          : `<span class="thumb" style="display:grid;place-items:center;color:var(--ink-3)">${icon("tag", 16)}</span>`}</td>
        <td><div class="cellmain">${esc(p.title)}</div><div class="cellsub">${esc(p.category || "—")}</div></td>
        <td>${chipHTML(p.status === "ACTIVE" ? tr("منشور") : p.status, p.status === "ACTIVE" ? "teal" : "amber", "dot")}</td>
        <td class="num">${num(p.variant_count)}</td>
        <td>${p.any_in_stock ? chipHTML(tr("متوفر"), "teal", "dot") : chipHTML(tr("خلص"), "rose", "bar")}</td>
      </tr>`).join("");

    body.innerHTML = this.toolbar() + (this.rows.length
      ? card(tr("كل المنتجات"), TR`${this.rows.length} منتج`,
          tableHTML(["", tr("المنتج"), tr("الحالة"), { label: tr("المقاسات"), num: true }, tr("المخزون")], rowsHTML, { minWidth: 640 }),
          "", { flush: true })
      : `<div class="card"><div class="card-body"></div></div>`);

    }

async function openProduct(gid) {
  const body = overlay.drawer(tr("جاري التحميل…"), '<div class="skel" style="height:280px"></div>');
  const product = await api(`/dashboard/api/shopify/products/${encodeURIComponent(gid)}`, { quiet: true });

  $("#drawerTitle").textContent = product.title;

  const local = product.local;
  const variantRows = product.variants.map((v) => `
    <tr>
      <td style="width:44px">${v.image_url ? `<img class="thumb" src="${esc(v.image_url)}" alt="" loading="lazy">` : ""}</td>
      <td><div class="cellmain">${esc([v.color, v.size, v.length].filter(Boolean).join(" / ") || "—")}</div>

  body.innerHTML = `
    ${product.image_url ? `<img src="${esc(product.image_url)}" alt="" style="width:100%;max-height:230px;object-fit:cover;border-radius:var(--r-md);margin-bottom:var(--s-4)">` : ""}
    ${!local ? TR`<div class="banner" style="margin-bottom:var(--s-4)">${icon("alert", 15)}

      لكن القسم والستايل والمجموعة محتاجين مزامنة الأول (scripts/shopify_sync.py).</div></div>` : ""}

    ${card(tr("بيانات المنتج"), "", TR`
      <label class="lbl" for="pTitle">الاسم</label>
      <input class="inp" id="pTitle" value="${esc(product.title)}">
      <div class="grid g-3" style="margin-top:var(--s-3)">
        <div><label class="lbl" for="pCat">التصنيف</label>
          <input class="inp" id="pCat" list="pCatList" value="${esc(product.category || "")}">
          <datalist id="pCatList"></datalist></div>
        <div><label class="lbl" for="pDept">القسم</label>
          <input class="inp" id="pDept" value="${esc(local ? local.department || "" : "")}" ${local ? "" : "disabled"}></div>
        <div><label class="lbl">المجموعات</label>
          <div class="inp" id="pColl" style="max-height:132px;overflow:auto">جاري التحميل</div>
          <div class="hint" style="margin-top:var(--s-1)">اللي متعلّم هنا هو بالظبط اللي المنتج هيبقى فيه على الموقع، والمجموعة التلقائية واحدة بس في المرة.</div></div>
        <div><label class="lbl" for="pStyle">الستايل (مفصول بفاصلة)</label>
          <input class="inp" id="pStyle" value="${esc(local && local.style ? local.style.join(tr("، ")) : "")}" ${local ? "" : "disabled"}></div>
        <div><label class="lbl" for="pChart">جدول مقاسات منشور</label>
          <select class="inp" id="pChart" ${local ? "" : "disabled"}>
            <option value="${esc(local ? local.size_chart || "" : "")}">${esc(local && local.size_chart ? local.size_chart : tr("من غير جدول"))}</option>
          </select></div>
        <div><label class="lbl" for="pChartFile">أو ارفع صورة جدول من جهازك</label>
          <input class="inp" id="pChartFile" type="file" accept="image/png,image/jpeg,image/webp,image/gif" ${local ? "" : "disabled"}>
          <div class="hint" id="pChartStatus" style="margin-top:var(--s-1)" hidden></div></div>
      </div>
      <div id="pChartEditor" style="margin-top:var(--s-3)"></div>`)}

    <div style="height:var(--s-4)"></div>
    ${card(tr("المقاسات والأسعار"), TR`${product.variants.length} مقاس`,
      tableHTML(["", tr("المقاس"), tr("السعر"), tr("المخزون"), tr("الحالة"), tr("الصورة"), ""],
        variantRows, { minWidth: 760 })
      + TR`<div class="hint" style="padding:var(--s-3)">الصورة بتتحط على كل مقاسات اللون ده، مش السطر لوحده.</div>`,
      "", { flush: true })}`;

  /* Pre-ticked from Shopify, not from the local label: Shopify is where a
     product's collections actually live, and the label is one name of what
     can be several. */
  if (local) fillCollectionPicker($("#pColl", body), (product.collections || []).map((c) => c.id), $("#pCat", body));
  else $("#pColl", body).innerHTML = "";
  fillProductTypes("pCatList");
  if (local) fillChartPicker($("#pChart", body), local.size_chart || "");

  /* Same as the create form: the picture is read the moment it is chosen, and
     the grid it fills is what actually gets saved. The sizes come from the
     product itself here rather than from typed rows. */
  const productSizes = [...new Set(product.variants.map((v) => v.size).filter(Boolean))];
  if (local) {
    $("#pChartFile", body).onchange = (event) => {
      const file = (event.target.files || [])[0];
      const host = $("#pChartEditor", body);
      const status = $("#pChartStatus", body);
      if (!file) { host.innerHTML = ""; status.hidden = true; return; }
      readChartInto(host, file, productSizes, status);
    };
  }

  const save = el("button", {
    class: "btn primary", html: TR`${icon("check", 15)} احفظ التغييرات`,
    onclick: async () => {
      if (!product.local_product_id) return toast(tr("مش ممكن الحفظ من هنا"), tr("المنتج مالوش نسخة محلية"), "warn");
      save.disabled = true;
      const updates = {};
      $$("[data-vid]", body).forEach((input) => {
        const sku = input.dataset.vid;
        if (!sku) return;
        (updates[sku] ||= { variant_id: sku })[input.dataset.f] = Number(input.value);
      });
      /* Pictures first, as in the create form: an upload that fails costs
         nothing, while one that failed after the fields were saved would
         leave the drawer looking like it had not saved at all. */
      const variantImages = [];
      for (const input of $$("[data-img]", body)) {
        const file = (input.files || [])[0];
        if (!file || !input.dataset.img) continue;
        const uploaded = await uploadImage(file, "product_image");
        if (uploaded.__error) { save.disabled = false; return toastError(uploaded.__error, tr("رفع الصورة مانفعش")); }
        variantImages.push({ variant_id: input.dataset.img, source: uploaded.source });
      }

      /* The chart picture goes up with the product photos, before anything
         is written: an upload that fails here costs nothing. */
      let chartImage = null;
      const chartFile = ($("#pChartFile").files || [])[0];
      if (chartFile) {
        const uploaded = await uploadImage(chartFile, "size_chart");
        if (uploaded.__error) { save.disabled = false; return toastError(uploaded.__error, tr("رفع جدول المقاسات مانفعش")); }
        chartImage = { file_gid: uploaded.file_gid, url: uploaded.url };
      }

      const picked = pickedCollections($("#pColl"));
      const payload = {
        title: $("#pTitle").value.trim(),
        /* A ticked automatic collection *is* the category -- that rule is how
           the product gets into it. */
        category: picked.category || $("#pCat").value.trim(),
        department: $("#pDept").value.trim() || undefined,
        /* The label is what the bot browses by, the gids are what the
           website browses by, and both follow the ticks -- nothing else
           decides a product's collections any more. "" clears the label
           rather than leaving yesterday's. */
        collection: local ? picked.title : undefined,
        collection_gids: local ? picked.gids : undefined,
        variant_images: variantImages.length ? variantImages : undefined,
        size_chart: $("#pChart").value.trim() || undefined,
        style: $("#pStyle").value.trim()
          ? $("#pStyle").value.split(/[،,]/).map((s) => s.trim()).filter(Boolean) : undefined,
        variant_updates: Object.values(updates),
      };
      const result = await api(`/dashboard/api/shopify/products/${encodeURIComponent(product.local_product_id)}/update`,
        { method: "POST", quiet: true, body: payload });
      if (result.__error) { save.disabled = false; return toastError(result.__error, tr("الحفظ مانفذش")); }

      /* A chart typed or read here is saved after the product update, for the
         same reason as on create: it points at a product, so the product's
         own fields settle first. */
      let chartNote = "";
      if (chartHasNumbers($("#pChartEditor", body))) {
        const saved = await saveChart($("#pChartEditor", body), product.local_product_id,
          $("#pTitle").value.trim(), chartImage);
        if (saved && saved.__error) chartNote = tr("بس الجدول ماتحفظش");
        else if (saved && (saved.warnings || []).length) chartNote = saved.warnings.join(" · ");
      }
      /* A collection move that Shopify refused is reported, not swallowed:
         the fields saved, but the product is not where the staff member just
         put it. */
      if ((result.warnings || []).length) {
        chartNote = [chartNote, ...result.warnings].filter(Boolean).join(" · ");
      }
      save.disabled = false;
      toast(tr("المنتج اتحدّث"), chartNote || tr("التغيير راح لشوبيفاي"), chartNote ? "warn" : undefined);
      overlay.close();
      VIEWS.products.load();
    },
  });
  /* One size at a time, from its own row. Refused by the server for a size
     that has been ordered and for a product's last one -- both are things the
     drawer cannot know without asking, so it asks rather than hiding the
     button and guessing wrong. */
  $$("[data-del]", body).forEach((button) => button.addEventListener("click", async () => {
    const sku = button.dataset.del;
    const ok = await overlay.confirm(tr("امسح المقاس ده؟"),
      TR`${sku} هيتشال من شوبيفاي ومن قاعدة البيانات. مش ممكن الرجوع فيها.`,
      tr("امسح"), { danger: true });
    if (!ok) return;
    const result = await api(`/dashboard/api/shopify/variants/${encodeURIComponent(sku)}/delete`,
      { method: "POST", quiet: true });
    if (result.__error) return toastError(result.__error, tr("المسح مانفذش"));
    toast(tr("المقاس اتمسح"), sku);
    openProduct(gid);
  }));

  const remove = el("button", {
    class: "btn danger", html: TR`${icon("trash", 15)} امسح المنتج`,
    onclick: async () => {
      if (!product.local_product_id) return toast(tr("مش ممكن المسح من هنا"), tr("المنتج مالوش نسخة محلية"), "warn");
      const ok = await overlay.confirm(tr("امسح المنتج ده؟"),
        TR`${product.title} هيتشال من شوبيفاي ومن قاعدة البيانات. مش ممكن الرجوع فيها.`,
        tr("امسح"), { danger: true });
      if (!ok) return;
      const result = await api(`/dashboard/api/shopify/products/${encodeURIComponent(product.local_product_id)}/delete`,
        { method: "POST", quiet: true });

      /* A product that has been sold cannot lose its rows -- order lines
         point at them. Archiving is the same intent without destroying the
         orders, so it is offered here rather than left as a dead end. */
      if (result.__error && result.__error.status === 409) {
        const archive = await overlay.confirm(tr("المنتج ده اتباع قبل كده"),
          TR`${result.__error.message || ""} تقفله بدل ما تمسحه؟ هيختفي من البوت ومن الموقع، والطلبات القديمة تفضل زي ما هي.`,
          tr("اقفل المنتج"), { danger: true });
        if (!archive) return;
        const archived = await api(`/dashboard/api/shopify/products/${encodeURIComponent(product.local_product_id)}/archive`,
          { method: "POST", quiet: true });
        if (archived.__error) return toastError(archived.__error, tr("الإقفال مانفذش"));
        toast(tr("المنتج اتقفل"), tr("مبقاش معروض للعملاء"));
        overlay.close();
        return VIEWS.products.load();
      }
      if (result.__error) return toastError(result.__error, tr("المسح مانفذش"));
      toast(tr("المنتج اتمسح"), product.title);
      overlay.close();
      VIEWS.products.load();
    },
  });

  $("#drawerFoot").innerHTML = "";
  $("#drawerFoot").append(save, remove,
    el("button", { class: "btn", text: tr("إغلاق"), onclick: () => overlay.close() }));
  $("#drawerFoot").hidden = false;
}

/* A picture a staff member picked off their laptop reaches Shopify base64 in
   a JSON body -- see the `uploads` route for why that rather than multipart. */
function readAsBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("read"));
    reader.onload = () => resolve(String(reader.result).split(",", 2)[1] || "");
    reader.readAsDataURL(file);
  });
}

/* The collections picker, shared by the create form and the edit drawer, and
   the only thing that decides where a product sits on the website.

   Two kinds of collection sit in this one list, because the staff member
   should not have to know which is which:

   - a manual one is a list of products, so a tick joins it and an untick
     leaves it;
   - a rule-driven one ("automatic") cannot be joined by hand at all --
     Shopify refuses the member and re-applies its rule regardless. Every one
     of this shop's category collections is that kind, with a single rule:
     TYPE EQUALS "<the collection's own name>". So a tick there writes the
     *product's type*, and Shopify files it within seconds. Same tick, same
     result, one mechanism further down.

   That second kind is therefore single-choice: a product has one type, so
   ticking T-Shirts unticks Hoodies. A rule-driven collection this cannot
   express -- more than one rule, or a rule on anything but TYPE -- stays
   disabled rather than pretending. */
function ruleType(collection) {
  const rules = collection.rules || [];
  if (!collection.smart || rules.length !== 1) return "";
  const rule = rules[0];
  return rule.column === "TYPE" && rule.relation === "EQUALS" ? (rule.condition || "") : "";
}

async function fillCollectionPicker(host, current = [], categoryInput = null) {
  if (!host) return;
  const data = await api("/dashboard/api/shopify/collections", { quiet: true }).catch(() => ({ __error: 1 }));
  if (data.__error || !data.collections) {
    host.innerHTML = TR`<div class="hint">المجموعات مش متاحة دلوقتي</div>`;
    return;
  }
  const ticked = new Set(current);
  const rows = data.collections.slice().sort((a, b) => a.title.localeCompare(b.title, "ar"));
  host.innerHTML = rows.map((c) => {
    const type = ruleType(c);
    const locked = c.smart && !type;
    return `
      <label class="row" style="gap:var(--s-2);padding:3px 0;cursor:${locked ? "not-allowed" : "pointer"}">
        <input type="checkbox" value="${esc(c.id)}" data-title="${esc(c.title)}"${
          type ? ` data-type="${esc(type)}"` : ""}${ticked.has(c.id) ? " checked" : ""}${
          locked ? " disabled" : ""}>
        <span${locked ? ' style="opacity:.6"' : ""}>${esc(c.title)}${
          c.smart ? " (" + esc(tr("تلقائية")) + ")" : ""}</span>
      </label>`;
  }).join("") || TR`<div class="hint">مفيش مجموعات</div>`;

  /* The category is the rule those collections run on, so the picker owns it
     while one of them is ticked -- two controls for one fact is how a product
     ends up typed "T-shirt" and in no collection at all, which is exactly
     what happened. */
  const sync = () => {
    const chosen = [...host.querySelectorAll("input[data-type]")].find((b) => b.checked);
    if (!categoryInput) return;
    if (chosen) {
      categoryInput.value = chosen.dataset.type;
      categoryInput.readOnly = true;
      categoryInput.style.opacity = ".7";
    } else {
      categoryInput.readOnly = false;
      categoryInput.style.opacity = "";
    }
  };
  host.addEventListener("change", (event) => {
    const box = event.target;
    if (box.checked && box.dataset.type) {
      host.querySelectorAll("input[data-type]").forEach((other) => {
        if (other !== box) other.checked = false;
      });
    }
    sync();
  });
  sync();
}

/* What the picker says, in the three shapes a save needs: the manual gids --
   which Shopify's membership is made to match exactly -- the first manual
   title, which is the single label wanas.db keeps and the bot browses by, and
   the category, which is how a rule-driven collection is joined at all.

   A rule-driven collection's gid is deliberately *not* in `gids`: sending it
   would ask Shopify to hand-add a member it always refuses, and earn a
   warning for a tick that in fact worked. */
function pickedCollections(host) {
  const boxes = host ? [...host.querySelectorAll("input[type=checkbox]")].filter((b) => b.checked) : [];
  const manual = boxes.filter((b) => !b.dataset.type);
  const typed = boxes.find((b) => b.dataset.type);
  return {
    gids: manual.map((b) => b.value),
    title: manual.length ? manual[0].dataset.title : "",
    category: typed ? typed.dataset.type : "",
  };
}

/* Every category collection on this shop is a smart collection whose only
   rule is TYPE EQUALS "<something>". A product typed "T-shirt" instead of
   "T-Shirts" therefore lands in no collection at all -- so the field offers
   what the shop already uses, while still letting a new type be typed. */
async function fillProductTypes(listId) {
  const data = await api("/dashboard/api/shopify/product-types", { quiet: true }).catch(() => ({ __error: 1 }));
  const list = document.getElementById(listId);
  if (!list || data.__error || !data.product_types) return;
  list.innerHTML = data.product_types.map((t) => `<option value="${esc(t)}"></option>`).join("");
}

/* The published-chart picker, shared by both forms. Same reason as the
   collection picker: a typed chart id that `size_charts.json` and the
   `size_charts` table both lack is a field that looks saved and answers
   nothing when a customer asks for the measurements. */
async function fillChartPicker(select, current = "") {
  if (!select) return;
  const data = await api("/dashboard/api/shopify/size-charts", { quiet: true }).catch(() => ({ __error: 1 }));
  const none = `<option value="">${esc(tr("من غير جدول"))}</option>`;
  if (data.__error || !data.charts) {
    select.innerHTML = none;
    if (current) select.insertAdjacentHTML("beforeend", `<option value="${esc(current)}" selected>${esc(current)}</option>`);
    return;
  }
  const rows = data.charts.slice();
  if (current && !rows.some((c) => c.id === current)) rows.unshift({ id: current, title: current });
  select.innerHTML = none + rows.map((c) =>
    `<option value="${esc(c.id)}"${c.id === current ? " selected" : ""}>${esc(c.title)}</option>`).join("");
  select.value = current || "";
}

async function uploadImage(file, purpose) {
  const data = await readAsBase64(file);
  return api("/dashboard/api/shopify/uploads", { method: "POST", quiet: true, body: {
    filename: file.name, content_type: file.type, data, purpose,
  } });
}

/* ==========================================================================
   جدول المقاسات / the size-chart editor

   An uploaded chart used to be a picture and nothing else: the storefront
   showed the image and the bot could send it, but neither could answer "what
   is the chest on a large" -- there were no numbers behind it, and putting
   some there meant editing `data/size_charts.json` and running a script.

   So the picture is read for you. `/size-charts/read` hands it to the vision
   model and fills the grid below in; the staff member checks it and saves.
   The reading is never saved on its own -- a misread measurement is a
   customer ordering the wrong size and posting it back, so a person always
   sees the numbers first. Same rule as `docs/MEDIA.md` states for customer
   photos: a vision reading is a hint, never a fact.
   ========================================================================== */

const CHART_STATE = new WeakMap();

/* The sizes a chart may have rows for: whatever the form's variant rows say,
   deduplicated, in the order they were typed. A chart row for a size the
   product does not sell is a row nobody can order. */
function chartSizesFrom(sizes) {
  const seen = new Set();
  return (sizes || []).map((s) => String(s || "").trim()).filter((s) => {
    if (!s || seen.has(s.toLowerCase())) return false;
    seen.add(s.toLowerCase());
    return true;
  });
}

function renderChartEditor(host, sizes, chart) {
  if (!host) return;
  const state = {
    sizes: chartSizesFrom(sizes),
    measurements: (chart && chart.measurements || []).map((m) => ({ ...m })),
    values: (chart && chart.sizes) || {},
    unit: (chart && chart.unit) || "cm",
    fromImage: !!(chart && chart.fromImage),
  };
  CHART_STATE.set(host, state);

  if (!state.sizes.length) {
    host.innerHTML = TR`<div class="hint">أضف المقاسات الأول عشان تقدر تكتب أرقام الجدول.</div>`;
    return;
  }
  if (!state.measurements.length) state.measurements = [{ key: "", label_en: "", label_ar: "" }];

  const head = state.measurements.map((m, i) => TR`<th style="min-width:120px">
      <input class="inp sm chart-en" data-i="${i}" placeholder="Width" value="${esc(m.label_en || "")}">
      <input class="inp sm chart-ar" data-i="${i}" placeholder="العرض" value="${esc(m.label_ar || "")}">
      <input type="hidden" class="chart-key" data-i="${i}" value="${esc(m.key || "")}">
    </th>`).join("");

  const rows = state.sizes.map((size) => {
    const row = state.values[size] || {};
    const cells = state.measurements.map((m, i) => {
      const v = m.key && row[m.key] != null ? row[m.key] : "";
      return `<td><input class="inp sm chart-val" data-size="${esc(size)}" data-i="${i}" type="number" step="0.5" value="${esc(String(v))}"></td>`;
    }).join("");
    return `<tr><th style="text-align:start">${esc(size)}</th>${cells}</tr>`;
  }).join("");

  host.innerHTML = TR`
    <div class="row" style="margin-bottom:var(--s-2);gap:var(--s-2);align-items:center">
      <div class="hint" style="flex:1">اكتب اسم كل قياس بالإنجليزي والعربي، والأرقام تحته لكل مقاس. سيبه فاضي لو مش موجود.</div>
      <label class="lbl" style="margin:0">الوحدة</label>
      <select class="inp sm chart-unit" style="width:auto">
        <option value="cm">cm</option>
        <option value="in">in</option>
      </select>
      <button class="btn sm ghost chart-add" type="button">أضف قياس</button>
    </div>
    <div style="overflow-x:auto"><table class="tbl chart-grid"><thead><tr><th></th>${head}</tr></thead><tbody>${rows}</tbody></table></div>`;

  const unit = host.querySelector(".chart-unit");
  if (unit) {
    unit.value = state.unit;
    unit.onchange = () => { state.unit = unit.value; };
  }
  host.querySelector(".chart-add").onclick = () => {
    const current = collectChart(host);
    current.measurements.push({ key: "", label_en: "", label_ar: "" });
    renderChartEditor(host, state.sizes, { ...current, unit: state.unit, fromImage: state.fromImage });
  };
}

/* What the grid currently says, in the shape `POST /size-charts` takes.
   Blank cells stay absent rather than becoming 0: the bot quotes these
   numbers to customers, and "0 cm" is a worse answer than "not on the
   chart". */
function collectChart(host) {
  const state = CHART_STATE.get(host);
  if (!host || !state) return { measurements: [], sizes: {}, unit: "cm", fromImage: false };

  const measurements = [];
  host.querySelectorAll(".chart-en").forEach((input) => {
    const i = Number(input.dataset.i);
    const en = input.value.trim();
    const ar = (host.querySelector(`.chart-ar[data-i="${i}"]`) || {}).value || "";
    const key = ((host.querySelector(`.chart-key[data-i="${i}"]`) || {}).value || "").trim();
    measurements[i] = { key: key || en, label_en: en, label_ar: ar.trim() };
  });

  const sizes = {};
  host.querySelectorAll(".chart-val").forEach((input) => {
    const i = Number(input.dataset.i);
    const m = measurements[i];
    const raw = input.value.trim();
    if (!m || !m.label_en || raw === "") return;
    const number = Number(raw);
    if (!Number.isFinite(number)) return;
    (sizes[input.dataset.size] = sizes[input.dataset.size] || {})[m.key || m.label_en] = number;
  });

  return {
    measurements: measurements.filter((m) => m && m.label_en),
    sizes,
    unit: state.unit,
    fromImage: state.fromImage,
  };
}

function chartHasNumbers(host) {
  const chart = collectChart(host);
  return chart.measurements.length > 0 && Object.keys(chart.sizes).length > 0;
}

/* Read the picture, then show what it said. A failure here is never fatal --
   the grid is still there to type into, which beats refusing the chart. */
async function readChartInto(host, file, sizes, statusEl) {
  const list = chartSizesFrom(sizes);
  if (!list.length) {
    renderChartEditor(host, list, null);
    return;
  }
  if (statusEl) { statusEl.hidden = false; statusEl.textContent = tr("بقرأ الجدول من الصورة…"); }
  const data = await readAsBase64(file);
  const reading = await api("/dashboard/api/shopify/size-charts/read", {
    method: "POST", quiet: true,
    body: { filename: file.name, content_type: file.type, data, sizes: list },
  }).catch(() => ({ __error: 1 }));

  if (reading.__error) {
    renderChartEditor(host, list, null);
    if (statusEl) statusEl.textContent = tr("مقدرتش أقرا الجدول من الصورة — اكتب الأرقام بنفسك.");
    return;
  }
  renderChartEditor(host, list, {
    measurements: reading.measurements, sizes: reading.sizes,
    unit: reading.unit, fromImage: true,
  });
  if (statusEl) {
    const read = Object.keys(reading.sizes || {}).length;
    statusEl.textContent = read
      ? tr("قريت الجدول من الصورة — راجع الأرقام قبل ما تحفظ.") + (reading.notes ? " " + reading.notes : "")
      : tr("الصورة مافيهاش أرقام أقدر أقراها — اكتبها بنفسك.");
  }
}

/* Save the chart the staff member confirmed. Separate from creating the
   product because it needs a product that already exists to point at. */
async function saveChart(host, productId, title, image) {
  const chart = collectChart(host);
  if (!chart.measurements.length || !Object.keys(chart.sizes).length) return null;
  return api("/dashboard/api/shopify/size-charts", {
    method: "POST", quiet: true,
    body: {
      product_id: productId, title,
      unit: chart.unit, measurements: chart.measurements, sizes: chart.sizes,
      read_from_image: chart.fromImage,
      image_url: (image && image.url) || undefined,
      image_file_gid: (image && image.file_gid) || undefined,
    },
  });
}

function productCreateForm() {
  const body = overlay.drawer(tr("منتج جديد"), TR`
    <div class="grid g-2">
      <div><label class="lbl" for="nTitle">اسم المنتج *</label><input class="inp" id="nTitle" placeholder="مثلاً: هودي ونس الشتوي"></div>
      <div><label class="lbl" for="nCat">التصنيف *</label>
