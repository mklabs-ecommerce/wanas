        <datalist id="nCatList"></datalist>
        <div class="hint" style="margin-top:var(--s-1)">المجموعات التلقائية بتتحدد بالتصنيف ده، علّم عليها فوق وهو هيتملي لوحده.</div></div>
      <div><label class="lbl" for="nDept">القسم *</label><input class="inp" id="nDept" placeholder="رجالي"></div>
      <div>
        <label class="lbl">المجموعات</label>
        <div class="inp" id="nColl" style="max-height:132px;overflow:auto">جاري التحميل</div>
        <div class="hint" style="margin-top:var(--s-1)">اختار كل المجموعات اللي المنتج هيظهر فيها على الموقع، والمجموعة التلقائية واحدة بس في المرة.
          <button class="btn sm ghost" type="button" id="nCollNew">مجموعة جديدة</button></div>
      </div>
      <div>
        <label class="lbl" for="nChart">جدول مقاسات منشور</label>
        <select class="inp" id="nChart"><option value="">جاري التحميل</option></select>
      </div>
      <div>
        <label class="lbl" for="nChartFile">أو ارفع صورة جدول من جهازك</label>
        <input class="inp" id="nChartFile" type="file" accept="image/png,image/jpeg,image/webp,image/gif">
        <div class="hint" id="nChartStatus" style="margin-top:var(--s-1)" hidden></div>
      </div>
    </div>
    <div id="nChartEditor" style="margin-top:var(--s-3)"></div>
    <div style="height:var(--s-3)"></div>
    <label class="lbl" for="nDesc">الوصف</label>
    <textarea class="inp" id="nDesc" rows="3" placeholder="وصف قصير يظهر في شوبيفاي"></textarea>

    <div style="height:var(--s-5)"></div>
    <div class="row" style="margin-bottom:var(--s-2)">
      <h3 style="font-size:14px;flex:1">المقاسات والصور</h3>
      <button class="btn sm" type="button" id="addVariant">${icon("plus", 14)} أضف مقاس</button>
    </div>
    <div class="hint" style="margin-bottom:var(--s-2)">كل سطر بيبقى SKU لوحده في شوبيفاي. المقاس مطلوب واللون اختياري. الصورة بتتربط باللون بتاع السطر، وأول صورة للون هي صورته.</div>
    <div id="variantRows"></div>`);

  /* Both pickers are filled from what exists rather than typed: a collection
     Shopify does not have and a chart id `size_charts.json` does not have are
     the same bug -- a value that looks saved and answers nothing. */
  fillCollectionPicker($("#nColl", body), [], $("#nCat", body));
  fillProductTypes("nCatList");

  /* The picture is read the moment it is chosen, not at save time: the staff
     member is looking at the form right then, which is the only moment
     checking the numbers costs them nothing. */
  $("#nChartFile", body).onchange = (event) => {
    const file = (event.target.files || [])[0];
    const host = $("#nChartEditor", body);
    const status = $("#nChartStatus", body);
    if (!file) { host.innerHTML = ""; status.hidden = true; return; }
    readChartInto(host, file, variantRowSizes(), status);
  };

  fillChartPicker($("#nChart", body));

  $("#nCollNew", body).addEventListener("click", () => {
    overlay.close();
    go("collections");
    setTimeout(collectionCreateForm, 120);
  });

  const addRow = (values = {}) => {
    const row = el("div", { class: "grid", style: "grid-template-columns:repeat(4,1fr) 1.4fr auto;gap:var(--s-2);margin-bottom:var(--s-2)" });
    row.innerHTML = TR`
      <input class="inp" data-v="size" placeholder="مقاس *" value="${esc(values.size || "")}">
      <input class="inp" data-v="color" placeholder="لون" value="${esc(values.color || "")}">
      <input class="inp num" data-v="price" type="number" min="0" placeholder="سعر *" value="${esc(values.price || "")}">
      <input class="inp num" data-v="stock_qty" type="number" min="0" placeholder="مخزون" value="${esc(values.stock_qty ?? 0)}">
      <input class="inp" data-file="image" type="file" accept="image/png,image/jpeg,image/webp,image/gif" aria-label="صورة اللون">
      <button class="btn icon ghost" type="button" aria-label="حذف السطر">${icon("x", 15)}</button>`;
    row.lastElementChild.addEventListener("click", () => row.remove());
    $("#variantRows", body).append(row);
  };
  $("#addVariant", body).addEventListener("click", () => addRow());
  addRow();

  /* The chart may only have rows for sizes this product actually sells. */
  const variantRowSizes = () =>
    $$("#variantRows > div", body).map((row) => ($("[data-v=size]", row) || {}).value || "");

  /* Sizes typed after the picture was read still get a row: re-render the
     grid on the way out rather than making the order of two fields matter. */
  $("#variantRows", body).addEventListener("change", (event) => {
    if (!event.target.matches("[data-v=size]")) return;
    const host = $("#nChartEditor", body);
    if (CHART_STATE.has(host)) renderChartEditor(host, variantRowSizes(), collectChart(host));
  });

  const create = el("button", { class: "btn primary", html: TR`${icon("check", 15)} أنشئ المنتج`, onclick: async () => {
    const rows = $$("#variantRows > div", body).map((row) => {
      const values = {};
      $$("[data-v]", row).forEach((input) => { values[input.dataset.v] = input.value.trim(); });
      values.file = ($("[data-file]", row).files || [])[0] || null;
      return values;
    }).filter((v) => v.size && v.price);

    const variants = rows.map((v) => ({
      size: v.size, color: v.color || undefined,
      price: Number(v.price), stock_qty: Number(v.stock_qty || 0),
    }));

    const newPicked = pickedCollections($("#nColl"));
    const payload = {
      title: $("#nTitle").value.trim(),
      category: newPicked.category || $("#nCat").value.trim(),
      department: $("#nDept").value.trim(), description: $("#nDesc").value.trim(),
      collection: newPicked.title || undefined,
      collection_gids: newPicked.gids,
      size_chart: $("#nChart").value || undefined,
      variants,
    };
    if (!payload.title || !payload.category || !payload.department || !variants.length) {
      return toast(tr("ناقص بيانات"), tr("الاسم والتصنيف والقسم ومقاس واحد على الأقل مطلوبين"), "warn");
    }

    create.disabled = true;
    try {
      /* Pictures go up before the product exists, on purpose: an upload that
         fails here costs nothing, while one that failed after `productCreate`
         would leave a product half made with no way back to this form. */
      const images = [];
      for (const row of rows) {
        if (!row.file) continue;
        const uploaded = await uploadImage(row.file, "product_image");
        if (uploaded.__error) { toastError(uploaded.__error, tr("رفع الصورة مانفعش")); return; }
        images.push({ color: row.color || null, source: uploaded.source });
      }
      if (images.length) payload.images = images;

      let chartImage = null;
      const chartFile = ($("#nChartFile").files || [])[0];
      if (chartFile) {
        const uploaded = await uploadImage(chartFile, "size_chart");
        if (uploaded.__error) { toastError(uploaded.__error, tr("رفع جدول المقاسات مانفعش")); return; }
        payload.size_chart_file_gid = uploaded.file_gid;
        payload.size_chart_url = uploaded.url || undefined;
        chartImage = { file_gid: uploaded.file_gid, url: uploaded.url };
      }

      const result = await api("/dashboard/api/shopify/products", { method: "POST", quiet: true, body: payload });
      if (result.__error) return toastError(result.__error, tr("الإنشاء مانفذش"));

      /* The chart is saved after the product because it has to point at one.
         A chart that fails to save leaves the product and its picture intact
         -- staff finish it from the edit drawer. */
      const warnings = (result.warnings || []).slice();
      if (chartHasNumbers($("#nChartEditor", body))) {
        const saved = await saveChart($("#nChartEditor", body), result.product_id, payload.title, chartImage);
        if (saved && saved.__error) warnings.push(tr("الجدول ماتحفظش — كمّله من صفحة المنتج"));
        else if (saved) warnings.push(...(saved.warnings || []));
      }
      if (warnings.length) toast(tr("المنتج اتعمل، بس"), warnings.join(" · "), "warn");
      else toast(tr("المنتج اتعمل"), result.product_id || "");
      overlay.close();
      go("products", { force: true });
    } finally {
      create.disabled = false;
    }
  } });
  $("#drawerFoot").innerHTML = "";
  $("#drawerFoot").append(create, el("button", { class: "btn", text: tr("إلغاء"), onclick: () => overlay.close() }));
  $("#drawerFoot").hidden = false;
}

      el("button", { class: "btn sm", type: "button", html: TR`${icon("download", 15)} تصدير`, onclick: () => this.export() }),

    else this.render();
  },

  async load() {
    const body = $("#inventoryBody");
    body.innerHTML = skeletonTiles(4) + skeletonTable(10);
    this.dirty.clear();
    const params = new URLSearchParams({ status: this.filter });
    if (this.search) params.set("q", this.search);

    setBadge("stock", data.totals.out_of_stock_count, "warn");
    this.render();
  },

  render() {
    const { rows, totals } = this.data;
    const filters = [
      { id: "all", label: tr("الكل") },
      { id: "low", label: TR`على وشك الخلاص (${totals.low_stock_count})` },
      { id: "out", label: TR`خلص (${totals.out_of_stock_count})` },
      { id: "in_stock", label: tr("متوفر") },
    ];
    const rowsHTML = rows.map((r) => TR`
      <tr>
        <td style="width:52px">${r.image_url ? `<img class="thumb" src="${esc(r.image_url)}" alt="" loading="lazy">` : ""}</td>
        <td><div class="cellmain">${esc(r.product_title)}</div>
            <div class="cellsub">${esc([r.color, r.size, r.length].filter(Boolean).join(" / ") || "—")}</div></td>
        <td class="num cellsub" data-copy="${esc(r.sku)}" data-copy-what="SKU" style="cursor:pointer">${esc(r.sku)}</td>
        <td class="num">${esc(money(r.price))}</td>
        <td>${r.quantity <= 0 ? chipHTML(tr("خلص"), "rose", "bar")
             : r.quantity <= totals.low_stock_at ? chipHTML(TR`فاضل ${r.quantity}`, "amber", "ring")

              aria-label="مخزون ${esc(r.sku)}"></td>

    $("#inventoryBody").innerHTML = TR`
      <div class="grid g-kpi">
        ${[[tr("مقاسات خلصت"), num(totals.out_of_stock_count), "rose", "alert"],
           [tr("على وشك الخلاص"), num(totals.low_stock_count), "amber", "boxes"],
           [tr("إجمالي القطع"), num(totals.total_units), "teal", "boxes"],
           [tr("قيمة المخزون بالبيع"), money(totals.retail_value), "clay", "money"]]
          .map(([l, v, t, ic]) => `<div class="card kpi" style="--accent:${toneVar(t)}">
            <div class="kpi-label">${icon(ic, 14)}${esc(l)}</div><div class="kpi-value">${esc(v)}</div></div>`).join("")}
      </div>
      ${this.data.truncated ? TR`<div class="banner">${icon("alert", 15)}<div>المتجر أكبر من إننا نقراه كله في نداء واحد — الأرقام دي حد أدنى.</div></div>` : ""}
      <div class="row">
        <div class="inbox-filters" style="flex:1">
          ${filters.map((f) => `<button class="fchip" type="button" data-inv="${f.id}"
            aria-pressed="${f.id === this.filter}">${esc(f.label)}</button>`).join("")}

        <div class="field" style="min-width:210px">${icon("search", 15)}
          <input id="invSearch" type="search" placeholder="اسم، SKU، لون…" value="${esc(this.search)}"></div>

      ${card(tr("المخزون"), TR`${num(this.data.match_count)} مقاس — الأقل أولاً`,

      if (event.key === "Enter") { this.search = search.value.trim(); this.load(); }
    });

    // Edits are batched: someone recounting a shelf changes eight rows and
    // presses save once, instead of firing eight writes at Shopify.
    $$("[data-item]").forEach((input) => input.addEventListener("input", () => {
      const value = parseInt(input.value, 10);
      const was = Number(input.dataset.was);
      if (Number.isInteger(value) && value >= 0 && value !== was) this.dirty.set(input.dataset.item, value);
      else this.dirty.delete(input.dataset.item);

    const slot = $("#invSaveSlot");

    const save = el("button", {
      class: "btn sm primary", html: TR`${icon("check", 14)} احفظ ${this.dirty.size} تعديل`,
      onclick: async () => {
        save.disabled = true;

        if (result.__error) { save.disabled = false; return toastError(result.__error, tr("الحفظ مانفذش")); }
        toast(tr("المخزون اتحدّث"), TR`${updates.length} مقاس`);
        this.load();
      },
    });
    slot.append(save);
  },

  export() {
    if (!this.data) return;
    exportCSV("inventory.csv", [tr("المنتج"), "SKU", tr("اللون"), tr("المقاس"), tr("السعر"), tr("المخزون")],
      this.data.rows.map((r) => [r.product_title, r.sku, r.color, r.size, r.price, r.quantity]));
  },
};

        <div style="height:96px;background:${c.image_url ? `center/cover url('${esc(c.image_url)}')` : "linear-gradient(135deg,var(--clay-tint),var(--lilac-tint))"}"></div>
        <div class="card-body" style="padding:var(--s-4)">
          <div class="row" style="gap:6px;margin-bottom:6px">
            ${chipHTML(c.smart ? tr("ذكية") : tr("يدوية"), c.smart ? "lilac" : "sky", "dot")}
            <span class="spacer"></span>
            <span class="cellsub num">${num(c.product_count)} منتج</span>
          </div>
          <div class="cellmain" style="font-size:14px">${esc(c.title)}</div>
          <div class="cellsub num" dir="ltr">${esc(c.handle)}</div>
        </div>
      </button>`).join("")}</div>`;
    $$("[data-gid]", body).forEach((node) => node.addEventListener("click", () => openCollection(node.dataset.gid)));
  },
};

async function openCollection(gid) {
  const body = overlay.drawer(tr("جاري التحميل…"), '<div class="skel" style="height:240px"></div>');
  const collection = await api(`/dashboard/api/shopify/collections/${encodeURIComponent(gid)}`, { quiet: true });
  if (collection.__error) { body.innerHTML = errorBanner(collection.__error, tr("المجموعة")); return; }
  $("#drawerTitle").textContent = collection.title;

  const products = collection.products.map((p) => TR`
    <tr>
      <td style="width:52px">${p.image_url ? `<img class="thumb" src="${esc(p.image_url)}" alt="" loading="lazy">` : ""}</td>
      <td><div class="cellmain">${esc(p.title)}</div>
          <div class="cellsub">${esc(p.status === "ACTIVE" ? tr("منشور") : p.status)} · ${num(p.inventory)} قطعة</div></td>
      <td>${collection.smart ? "" : TR`<button class="btn sm ghost" type="button" data-rm="${esc(p.id)}">شيل</button>`}</td>
    </tr>`).join("");

  body.innerHTML = `
    ${collection.smart ? TR`<div class="banner" data-tone="info" style="margin-bottom:var(--s-4)">${icon("alert", 15)}
      <div><strong>مجموعة ذكية</strong><br>أعضاؤها بيتحددوا بقواعد شوبيفاي، فمش بنضيف أو نشيل منها من هنا —
      أي تعديل يدوي شوبيفاي هيلغيه أول ما يعيد تطبيق القواعد.</div></div>` : ""}

    ${card(tr("بيانات المجموعة"), "", TR`
      <label class="lbl" for="cTitle">الاسم</label>
      <input class="inp" id="cTitle" value="${esc(collection.title)}">
      <div style="height:var(--s-3)"></div>
      <label class="lbl" for="cDesc">الوصف</label>
      <textarea class="inp" id="cDesc" rows="3">${esc((collection.description_html || "").replace(/<[^>]+>/g, ""))}</textarea>`)}

    <div style="height:var(--s-4)"></div>
    ${card(tr("المنتجات"), TR`${collection.products.length} منتج`,
      products ? tableHTML(["", tr("المنتج"), ""], products, { minWidth: 420 })
               : TR`<div class="empty"><div class="d">المجموعة فاضية</div></div>`, "", { flush: true })}`;

  $$("[data-rm]", body).forEach((button) => button.addEventListener("click", async () => {
    button.disabled = true;
    const result = await api(`/dashboard/api/shopify/collections/${encodeURIComponent(gid)}/products/remove`,
      { method: "POST", quiet: true, body: { product_ids: [button.dataset.rm] } });
    if (result.__error) { button.disabled = false; return toastError(result.__error, tr("الحذف مانفذش")); }
    toast(tr("المنتج اتشال"), tr("شوبيفاي بيطبّق التغيير خلال ثواني"));
    setTimeout(() => openCollection(gid), 900);
  }));

  const foot = [el("button", { class: "btn primary", html: TR`${icon("check", 15)} احفظ`, onclick: async () => {
    const result = await api(`/dashboard/api/shopify/collections/${encodeURIComponent(gid)}/update`, {
      method: "POST", quiet: true,
      body: { title: $("#cTitle").value.trim(), description_html: $("#cDesc").value.trim() },
    });
    if (result.__error) return toastError(result.__error, tr("الحفظ مانفذش"));
    toast(tr("المجموعة اتحدّثت"));
    overlay.close();
    VIEWS.collections.load();
  } })];
  if (!collection.smart) {
    foot.push(el("button", { class: "btn", html: TR`${icon("plus", 15)} ضيف منتجات`, onclick: () => addToCollectionForm(gid) }));
  }
  foot.push(el("button", { class: "btn ghost", text: tr("إغلاق"), onclick: () => overlay.close() }));
  $("#drawerFoot").innerHTML = "";
  $("#drawerFoot").append(...foot);
  $("#drawerFoot").hidden = false;
}

async function addToCollectionForm(gid) {
  const body = overlay.modal(tr("ضيف منتجات للمجموعة"), '<div class="skel" style="height:200px"></div>');
  const data = await api("/dashboard/api/shopify/products", { quiet: true });
  if (data.__error) { body.innerHTML = errorBanner(data.__error, tr("المنتجات")); return; }
  body.innerHTML = TR`<div class="field" style="margin-bottom:var(--s-3)">${icon("search", 15)}
      <input id="acSearch" type="search" placeholder="فلترة سريعة"></div>
    <div id="acList" style="max-height:44dvh;overflow:auto">${data.products.map((p) => TR`
      <label class="mini" style="cursor:pointer">
        <input type="checkbox" value="${esc(p.id)}">
        ${p.image_url ? `<img class="thumb" src="${esc(p.image_url)}" alt="" loading="lazy">` : ""}
        <span class="m1"><span class="a">${esc(p.title)}</span>
        <span class="b">${esc(p.category || "")} · ${num(p.variant_count)} مقاس</span></span>
      </label>`).join("")}</div>`;
  $("#acSearch", body).addEventListener("input", (event) => {
    const needle = event.target.value.trim().toLowerCase();
    $$("#acList label", body).forEach((row) => {
      row.style.display = row.textContent.toLowerCase().includes(needle) ? "" : "none";
    });
  });
  const add = el("button", { class: "btn primary", text: tr("ضيف المختار"), onclick: async () => {
    const ids = $$('#acList input:checked', body).map((i) => i.value);
    if (!ids.length) return toast(tr("اختار منتج على الأقل"), "", "warn");
    add.disabled = true;
    const result = await api(`/dashboard/api/shopify/collections/${encodeURIComponent(gid)}/products/add`,
      { method: "POST", quiet: true, body: { product_ids: ids } });
    if (result.__error) { add.disabled = false; return toastError(result.__error, tr("الإضافة مانفذتش")); }
    overlay.close();
    toast(tr("المنتجات اتضافت"), TR`${ids.length} منتج`);
    setTimeout(() => openCollection(gid), 600);
  } });
  $("#modalFoot").innerHTML = "";
  $("#modalFoot").append(add, el("button", { class: "btn", text: tr("إلغاء"), onclick: () => overlay.close() }));
  $("#modalFoot").hidden = false;
}

function collectionCreateForm() {
  const create = el("button", { class: "btn primary", text: tr("أنشئ"), onclick: async () => {
    const title = $("#ncTitle").value.trim();
    if (!title) return toast(tr("الاسم مطلوب"), "", "warn");
    create.disabled = true;
    const result = await api("/dashboard/api/shopify/collections", {
      method: "POST", quiet: true,

    create.disabled = false;
    if (result.__error) return toastError(result.__error, tr("الإنشاء مانفذش"));

    <label class="lbl" for="ncTitle">الاسم *</label>

    <div style="height:var(--s-3)"></div>
    <label class="lbl" for="ncDesc">الوصف</label>

    <p class="hint">المجموعة بتتعمل يدوية — تقدر تضيف منتجاتها بعد الإنشاء.</p>`,
    [create, el("button", { class: "btn", text: tr("إلغاء"), onclick: () => overlay.close() })]);
}

/* ==========================================================================
   view: العملاء / customers
   ========================================================================== */

/* The order-count presets the owner asked for by name, plus an "any other
   number" escape hatch -- a shop that wants "who ordered exactly 7 times"
   should not need a new deploy to ask it. */
const CUSTOMER_ORDER_PRESETS = ["", "1", "2", "3"];

/* Three tabs over one list, not three lists. They are the same rows filtered
   server-side (`customer_ledger.in_segment`), so every column exists on every
   tab -- switching tab used to change the shape of the table, because the two
   tabs came from two routes returning two different customer dicts.

   A person who bought once in a conversation and once on the site is on both
   the bot tab and the web tab. That is the honest answer; picking one channel
   per person means being wrong about the other sale. */
const CUSTOMER_SEGMENTS = [
  { id: "all", label: tr("كل العملاء") },
  { id: "bot", label: tr("عملاء البوت") },
  { id: "web", label: tr("عملاء الموقع") },
];

const channelChips = (channels) =>
  (channels && channels.length)
    ? channels.map((ch) => chipHTML(channelLabel(ch), ch === "web" ? "sky" : "teal")).join(" ")
    : `<span class="cellsub">—</span>`;

VIEWS.customers = {
  segment: "all", search: "", data: null, searchTimer: null, searchFocused: false,
  ordersCount: "", ordersOp: "eq", governorate: "", sort: "recent",

  async mount(force) {
    $("#pageActions").append(
      el("button", { class: "btn sm", type: "button", html: TR`${icon("refresh", 15)} تحديث`, onclick: () => this.load() }),
    );
    if (force || !this.data) await this.load();
    else this.render();
  },

  async load() {
    $("#customersBody").innerHTML = this.toolbar() + skeletonTable(8);
    this.wire();
    this.restoreSearchFocus();
    const params = new URLSearchParams();
    if (this.segment !== "all") params.set("segment", this.segment);
    if (this.search) params.set("q", this.search);
    if (this.ordersCount !== "") params.set("orders_count", this.ordersCount);
    if (this.ordersCount !== "") params.set("orders_op", this.ordersOp);
    if (this.governorate) params.set("governorate", this.governorate);
    if (this.sort !== "recent") params.set("sort", this.sort);
    const qs = params.toString();
    const data = await api(`/dashboard/api/shopify/customers${qs ? `?${qs}` : ""}`, { quiet: true });
    if (data.__error) {
      $("#customersBody").innerHTML = this.toolbar() + errorBanner(data.__error, tr("العملاء"));
      this.wire(); this.restoreSearchFocus(); return;
    }
    this.data = data;
    this.render();
  },

  toolbar() {
    return TR`<div class="pagehead">
      <div class="t"><h2>العملاء</h2>
        <div class="d">كل اللي اشترى — من المحادثة أو من الموقع — بنفس الأعمدة</div></div>
      <div class="row">
        <div class="seg">
          ${CUSTOMER_SEGMENTS.map((s) => `<button type="button" data-cseg="${s.id}"
            aria-pressed="${this.segment === s.id}">${esc(s.label)}</button>`).join("")}
        </div>
        <div class="field" style="min-width:220px">${icon("search", 15)}
          <input id="custSearch" type="search" placeholder="اسم أو تليفون" value="${esc(this.search)}"></div>
      </div>
      ${this.filtersHTML()}
    </div>`;
  },

  filtersHTML() {
    const governorates = (this.data && this.data.governorates) || [];
    const custom = this.ordersCount !== "" && !CUSTOMER_ORDER_PRESETS.includes(this.ordersCount);
    return TR`<div class="row" style="width:100%;flex-wrap:wrap">
      <label class="lbl" for="custOrders" style="margin:0">عدد الطلبات</label>
      <select class="inp" id="custOrders" style="max-width:150px">
        <option value="" ${this.ordersCount === "" ? "selected" : ""}>الكل</option>
        <option value="1" ${this.ordersCount === "1" ? "selected" : ""}>١</option>
        <option value="2" ${this.ordersCount === "2" ? "selected" : ""}>٢</option>
        <option value="3" ${this.ordersCount === "3" ? "selected" : ""}>٣</option>
        <option value="custom" ${custom ? "selected" : ""}>رقم تاني…</option>
      </select>
      <input class="inp num" id="custOrdersN" type="number" min="0" step="1" placeholder="اكتب رقم"
        style="max-width:120px" value="${esc(custom ? this.ordersCount : "")}" ${custom ? "" : "hidden"}>
      <div class="seg" ${this.ordersCount === "" ? "hidden" : ""}>
        <button type="button" data-cop="eq" aria-pressed="${this.ordersOp === "eq"}">بالظبط</button>
        <button type="button" data-cop="gte" aria-pressed="${this.ordersOp === "gte"}">أو أكتر</button>
      </div>

      <label class="lbl" for="custGov" style="margin:0">المحافظة</label>
      <select class="inp" id="custGov" style="max-width:180px">
        <option value="">كل المحافظات</option>
        ${governorates.map((g) => `<option value="${esc(g.key)}"
          ${this.governorate === g.key ? "selected" : ""}>${esc(LANG === "en" ? g.key : g.label_ar)}</option>`).join("")}
        <option value="__unknown__" ${this.governorate === "__unknown__" ? "selected" : ""}>من غير محافظة</option>
      </select>

      <div class="seg">
        <button type="button" data-csort="recent" aria-pressed="${this.sort === "recent"}">الأحدث</button>
        <button type="button" data-csort="orders_desc" aria-pressed="${this.sort === "orders_desc"}">الأكتر طلبات</button>
        <button type="button" data-csort="orders_asc" aria-pressed="${this.sort === "orders_asc"}">الأقل طلبات</button>
      </div>
    </div>`;
  },

  /* Every render rebuilds the toolbar, which destroys the search input the
     person is typing into. Harmless when a button caused the render; fatal
     for search-as-you-type, where it would eat focus on every result that
     came back. So focus and caret are put back on the fresh input. */
  restoreSearchFocus() {
    if (!this.searchFocused) return;
    const field = $("#custSearch");
    if (!field) return;
    field.focus();
    const end = field.value.length;
    try { field.setSelectionRange(end, end); } catch (_) { /* type=search in some browsers */ }
  },

  wire() {
    $$("[data-cseg]").forEach((b) => b.addEventListener("click", () => { this.segment = b.dataset.cseg; this.load(); }));
    const search = $("#custSearch");
    if (search) {
      // Results while typing. Debounced rather than fired per keystroke:
      // "hazem" is five queries, and each one pages through the whole
      // customer list. 300ms is about the gap between words. Enter still
      // works, and skips the wait.
      const run = (value) => {
        const wanted = value.trim();
        if (wanted === this.search) return;
        this.search = wanted;
        this.load();
      };
      search.addEventListener("focus", () => { this.searchFocused = true; });
      search.addEventListener("blur", () => { this.searchFocused = false; });
      search.addEventListener("input", () => {
        clearTimeout(this.searchTimer);
        this.searchTimer = setTimeout(() => run(search.value), 300);
      });
      search.addEventListener("keydown", (event) => {
        if (event.key === "Enter") { clearTimeout(this.searchTimer); run(search.value); }
      });
    }

    const orders = $("#custOrders");
    if (orders) orders.addEventListener("change", () => {
      if (orders.value === "custom") {
        // Wait for a number before asking the server anything -- reloading on
        // "رقم تاني…" alone would clear the list and look like a bug.
        const field = $("#custOrdersN");
        field.hidden = false;
        field.focus();
        return;
      }
      this.ordersCount = orders.value;
      this.load();
    });
    const custom = $("#custOrdersN");
    if (custom) custom.addEventListener("change", () => {
      this.ordersCount = custom.value.trim();
      this.load();
    });
    $$("[data-cop]").forEach((b) => b.addEventListener("click", () => { this.ordersOp = b.dataset.cop; this.load(); }));
    $$("[data-csort]").forEach((b) => b.addEventListener("click", () => { this.sort = b.dataset.csort; this.load(); }));
    const gov = $("#custGov");
    if (gov) gov.addEventListener("change", () => { this.governorate = gov.value; this.load(); });
  },

  render() {
    const rows = this.data.customers;
    /* "طلبات" and "أنفق" are the orders that still stand and what they came
       to; "ملغي" and "قيمة الملغي" are the cancelled ones, kept as their own
       pair rather than folded in. A cancelled sale counted as revenue is the
       one mistake this screen must not make. */
    const rowsHTML = rows.map((c) => `
      <tr data-clickable ${c.source === "bot" ? `data-cid="${esc(c.client_id)}"` : `data-gid="${esc(c.id)}"`}>
        <td><div class="cellmain">${esc(c.name || "—")}</div><div class="cellsub num">${esc(c.phone || c.email || "")}</div></td>
        <td>${esc(c.governorate || "—")}</td>
        <td>${channelChips(c.channels)}</td>
        <td class="num">${num(c.order_count)}</td>
        <td class="num">${c.amount_spent === null ? "—" : esc(money(c.amount_spent))}</td>
        <td class="num">${c.cancelled_count ? esc(num(c.cancelled_count)) : `<span class="cellsub">—</span>`}</td>
        <td class="num">${c.cancelled_count ? esc(money(c.cancelled_amount)) : `<span class="cellsub">—</span>`}</td>
      </tr>`).join("");

    const truncated = this.data.truncated
      ? TR`<div class="banner">${icon("alert", 15)}
          <div>العملاء أكتر من اللي بنقراه في نداء واحد — القايمة دي حد أدنى، مش كل اللي مطابق.</div></div>`
      : "";

    const label = (CUSTOMER_SEGMENTS.find((s) => s.id === this.segment) || CUSTOMER_SEGMENTS[0]).label;
    $("#customersBody").innerHTML = this.toolbar() + truncated + card(
      label, `${rows.length}`,
      rows.length ? tableHTML(
        [tr("العميل"), tr("المحافظة"), tr("القنوات"), { label: tr("طلبات"), num: true },
         { label: tr("أنفق"), num: true }, { label: tr("ملغي"), num: true },
         { label: tr("قيمة الملغي"), num: true }],
        rowsHTML, { minWidth: 780 }) : "", "", { flush: true });
    this.wire();
    if (!rows.length) {
      $("#customersBody .card:last-child .card-body").append(
        emptyState(tr("مفيش عملاء"), tr("لسه محدش اشترى"), "users"));
    }
    $$("#customersBody tr[data-gid]").forEach((tr) => tr.addEventListener("click", () => openShopifyCustomer(tr.dataset.gid)));
    $$("#customersBody tr[data-cid]").forEach((tr) => tr.addEventListener("click", () => openLocalCustomer(tr.dataset.cid)));
    this.restoreSearchFocus();
  },
};

/* One drawer body for both kinds of customer. The bot side reads Postgres and
   the store side reads Shopify, but both arrive shaped like
   `admin_orders.order_summary`, so the same four KPIs and the same order
   table are drawn from the same keys -- which is the whole point of the
   ledger: two screens that cannot disagree about what a customer spent. */
function customerDrawerHTML(customer, extraRows) {
  const orders = (customer.orders || []).map((o) => `
    <tr ${o.id ? `data-clickable data-ogid="${esc(o.id)}"` : ""}>
      <td><div class="cellmain num">${esc(o.name || "—")}</div>
          <div class="cellsub">${esc(shortDate(o.created_at))}</div></td>
      <td>${statusChip(o.fulfillment_status, o.cancelled)}</td>
      <td>${paymentChip(o.payment_method)}</td>
      <td>${chipHTML(channelLabel(o.channel), o.channel === "web" ? "sky" : "teal")}</td>
      <td>${esc(o.governorate || "—")}</td>
      <td class="num">${esc(money(o.total))}</td>
    </tr>`).join("");

  return TR`
    <div class="grid g-kpi" style="margin-bottom:var(--s-4)">
      ${[[tr("طلبات قايمة"), num(customer.order_count), "teal"],
         [tr("إجمالي الإنفاق"), money(customer.amount_spent || 0), "clay"],
         [tr("طلبات ملغية"), num(customer.cancelled_count || 0), "rose"],
         [tr("قيمة الملغي"), money(customer.cancelled_amount || 0), "amber"]]
        .map(([l, v, t]) => `<div class="card kpi" style="--accent:${toneVar(t)}">
          <div class="kpi-label">${esc(l)}</div><div class="kpi-value">${esc(v)}</div></div>`).join("")}
    </div>
    ${card(tr("بيانات التواصل"), channelChips(customer.channels), TR`
      <div class="kv"><span class="k">التليفون</span><span class="v num">${esc(customer.phone || "—")}</span></div>
      <div class="kv"><span class="k">الإيميل</span><span class="v" dir="ltr">${esc(customer.email || "—")}</span></div>
      <div class="kv"><span class="k">المحافظة</span><span class="v">${esc(customer.governorate || "—")}</span></div>
      ${extraRows || ""}`)}
    <div style="height:var(--s-4)"></div>
    ${card(tr("الطلبات"), `${(customer.orders || []).length}`,
      orders ? tableHTML([tr("الطلب"), tr("الشحن"), tr("الدفع"), tr("القناة"), tr("المحافظة"),
                          { label: tr("الإجمالي"), num: true }], orders, { minWidth: 620 })
             : TR`<div class="empty"><div class="d">مفيش طلبات</div></div>`, "", { flush: true })}`;
}

/* A row in the drawer opens the order itself. Only where there is a Shopify
   order to open -- a local row from before `shopify_order_id` existed has
   nothing to point at, and a click that silently does nothing is worse than a
   row that is plainly not clickable. */
function wireDrawerOrders(body) {
  $$("tr[data-ogid]", body).forEach((row) =>
    row.addEventListener("click", () => openOrder(row.dataset.ogid)));
}

async function openShopifyCustomer(gid) {
  const body = overlay.drawer(tr("جاري التحميل…"), '<div class="skel" style="height:220px"></div>');
  const customer = await api(`/dashboard/api/shopify/customers/${encodeURIComponent(gid)}`, { quiet: true });
  if (customer.__error) { body.innerHTML = errorBanner(customer.__error, tr("العميل")); return; }
  $("#drawerTitle").textContent = customer.name || tr("عميل");
  body.innerHTML = customerDrawerHTML(customer,
    TR`<div class="kv"><span class="k">العنوان</span><span class="v">${esc(customer.address || "—")}</span></div>`);
  wireDrawerOrders(body);
}

async function openLocalCustomer(clientId) {
  const body = overlay.drawer(tr("جاري التحميل…"), '<div class="skel" style="height:220px"></div>');
  const customer = await api(`/dashboard/api/customers/${clientId}`, { quiet: true });
  if (customer.__error) { body.innerHTML = errorBanner(customer.__error, tr("العميل")); return; }
  $("#drawerTitle").textContent = customer.full_name;
  body.innerHTML = customerDrawerHTML({ ...customer, name: customer.full_name },
    TR`<div class="kv"><span class="k">العنوان</span><span class="v">${esc(customer.address || "—")}</span></div>
       <div class="kv"><span class="k">أول ظهور</span><span class="v">${esc(dateTime(customer.created_at))}</span></div>`);
  wireDrawerOrders(body);
}

   view: التحليلات / analytics — commerce and conversations on one page
   ========================================================================== */

/* The two commerce toggles. They narrow every number on the sales tab, not
   one chart -- see `domain/services/dashboard_stats.summarize`. */
const ANALYTICS_PAYMENTS = [
  { id: "all", label: tr("كل الدفع") },
  { id: "cod", label: tr("عند الاستلام") },
  { id: "online", label: tr("أونلاين") },
];
const ANALYTICS_CHANNELS = [
  { id: "all", label: tr("كل القنوات") },
  { id: "web", label: tr("الموقع") },
  { id: "whatsapp", label: tr("واتساب") },
  { id: "instagram_dm", label: tr("انستجرام") },
];

VIEWS.analytics = {
  days: 30, stats: null, insights: null, tab: "sales", payment: "all", channel: "all",
  // A custom window, both ends inclusive. Null means "use the `days` preset";
  // the two are never both in play, which is also how the server reads them
  // (`dashboard/ranges.py`).
  start: null, end: null,

  async mount(force) {
    $("#pageActions").append(
      el("button", { class: "btn sm", type: "button", html: TR`${icon("download", 15)} تصدير`, onclick: () => this.export() }),
      el("button", { class: "btn sm", type: "button", html: TR`${icon("refresh", 15)} تحديث`, onclick: () => this.load() }),
    );
    if (force || !this.stats) await this.load();
    else this.render();
  },

  async load() {
    $("#analyticsBody").innerHTML = skeletonTiles(4) + `<div class="skel" style="height:230px;border-radius:var(--r-lg)"></div>`;
    const params = new URLSearchParams();
    if (this.start && this.end) { params.set("start", this.start); params.set("end", this.end); }
    else params.set("days", String(this.days));
    const window_ = params.toString();
    if (this.payment !== "all") params.set("payment", this.payment);
    if (this.channel !== "all") params.set("channel", this.channel);
    const [stats, insights] = await Promise.all([
      api(`/dashboard/api/stats?${params}`, { quiet: true }),
      // The conversations side has no notion of payment method, and its
      // channel filter would mean something different (a conversation, not an
      // order), so it is asked the unfiltered question -- but over the *same*
      // window, or the two tabs of one page answer about different fortnights.
      api(`/dashboard/api/insights?${window_}`, { quiet: true }),
    ]);
    this.stats = stats;
    this.insights = insights;
    this.render();
  },

  head() {
    const custom = Boolean(this.start && this.end);
    const today = new Date().toISOString().slice(0, 10);
    return TR`<div class="pagehead">
      <div class="t"><h2>التحليلات</h2>
        <div class="d">المبيعات من شوبيفاي (المتجر كله)، والمحادثات من قاعدة البيانات المحلية</div></div>
      <div class="row">
        <div class="seg" id="anTabs">
          <button type="button" data-antab="sales" aria-pressed="${this.tab === "sales"}">المبيعات</button>
          <button type="button" data-antab="talk" aria-pressed="${this.tab === "talk"}">المحادثات</button>
        </div>
        <div class="seg" id="anRange">
          ${[7, 30, 90].map((d) => TR`<button type="button" data-days="${d}"
            aria-pressed="${!custom && d === this.days}">${d} يوم</button>`).join("")}
          <button type="button" data-anrange="custom" aria-pressed="${custom}">${tr("فترة محددة")}</button>
        </div>
      </div>
      ${custom ? TR`<div class="row" style="width:100%;flex-wrap:wrap">
        <label class="lbl" for="anStart" style="margin:0">من</label>
        <input class="inp" id="anStart" type="date" style="max-width:170px" max="${today}" value="${esc(this.start || "")}">
        <label class="lbl" for="anEnd" style="margin:0">إلى</label>
        <input class="inp" id="anEnd" type="date" style="max-width:170px" max="${today}" value="${esc(this.end || "")}">
        <button class="btn sm" type="button" id="anToday">اليوم بس</button>
        <span class="hint">يوم واحد؟ حط نفس التاريخ في الاتنين.</span>
      </div>` : ""}
      ${this.tab === "sales" ? `<div class="row" style="width:100%;flex-wrap:wrap">
        <div class="seg">
          ${ANALYTICS_PAYMENTS.map((x) => `<button type="button" data-anpay="${x.id}"
            aria-pressed="${x.id === this.payment}">${esc(x.label)}</button>`).join("")}
        </div>
        <div class="seg">
          ${ANALYTICS_CHANNELS.map((x) => `<button type="button" data-anch="${x.id}"
            aria-pressed="${x.id === this.channel}">${esc(x.label)}</button>`).join("")}
        </div>
      </div>` : ""}
    </div>`;
  },

  render() {
    const body = $("#analyticsBody");
    body.innerHTML = this.head() + (this.tab === "sales" ? this.salesHTML() : this.talkHTML());

    $$("[data-days]").forEach((b) => b.addEventListener("click", () => {
      this.days = Number(b.dataset.days);
      // Picking a preset leaves the custom window rather than remembering it:
      // a range still stored while "30 days" is lit is the kind of state that
      // makes the next click answer a question nobody asked.
      this.start = this.end = null;
      this.load();
    }));
    $$("[data-anrange]").forEach((b) => b.addEventListener("click", () => {
      // Open the pickers pre-filled with the preset currently on screen, so
      // the first thing shown is the range they were already looking at.
      const end = new Date();
      const start = new Date(end.getTime() - (this.days - 1) * 86400000);
      this.start = start.toISOString().slice(0, 10);
      this.end = end.toISOString().slice(0, 10);
      // Refetch rather than re-render. The window is the same span as the
      // preset it came from, so the numbers barely move -- but re-rendering
      // would paint the *old* payload under the new date labels, and a chart
      // captioned with a window it was not computed from is the exact
      // mislabelling the server's range allow-list exists to prevent.
      this.load();
    }));
    const applyRange = () => {
      const start = $("#anStart").value, end = $("#anEnd").value;
      if (!start || !end) return;
      if (start > end) return toast(tr("تاريخ البداية بعد النهاية"), "", "warn");
      this.start = start;
      this.end = end;
      this.load();
    };
    ["#anStart", "#anEnd"].forEach((sel) => {
      const node = $(sel);
      if (node) node.addEventListener("change", applyRange);
    });
    const todayBtn = $("#anToday");
    if (todayBtn) todayBtn.addEventListener("click", () => {
      this.start = this.end = new Date().toISOString().slice(0, 10);
      this.load();
    });
    $$("[data-antab]").forEach((b) => b.addEventListener("click", () => { this.tab = b.dataset.antab; this.render(); }));
    $$("[data-anpay]").forEach((b) => b.addEventListener("click", () => { this.payment = b.dataset.anpay; this.load(); }));
    $$("[data-anch]").forEach((b) => b.addEventListener("click", () => { this.channel = b.dataset.anch; this.load(); }));

    if (this.tab === "sales") this.drawSales();
    else this.drawTalk();
  },

  salesHTML() {
    const stats = this.stats;
    if (stats.__error) return errorBanner(stats.__error, tr("أرقام المبيعات"));
    const days = stats.revenue_by_day;
    const half = Math.floor(days.length / 2);
    const sum = (arr) => arr.reduce((a, d) => a + Number(d.revenue), 0);
    const first = sum(days.slice(0, half)), second = sum(days.slice(half));
    const trend = first ? (second - first) / first : 0;
    const dir = Math.abs(trend) < 0.02 ? "flat" : trend > 0 ? "up" : "down";
    const arrow = dir === "up" ? "▲" : dir === "down" ? "▼" : "■";

    return TR`
      ${stats.truncated ? TR`<div class="banner">${icon("alert", 15)}<div>الفترة دي فيها طلبات أكتر من اللي بنقراه في نداء واحد — الأرقام حد أدنى.</div></div>` : ""}
      ${stats.excluded_test_orders ? TR`<div class="banner" data-tone="info">${icon("alert", 15)}
        <div>${num(stats.excluded_test_orders)} طلب اختبار من أرقام الفريق مستبعد من كل رقم في الصفحة دي.</div></div>` : ""}
      <div class="grid g-kpi">
        <div class="card kpi" style="--accent:var(--clay)">
          <div class="kpi-label">${icon("money", 14)}الإيرادات</div>
          <div class="kpi-value">${esc(money(stats.revenue))}</div>
          <div class="kpi-foot"><span class="delta" data-dir="${dir}">${arrow} ${esc(pct(Math.abs(trend)))}</span>
            <span>مقارنة بأول نص الفترة</span></div>
          <div class="spark" id="anSpark"></div>
        </div>
        <div class="card kpi" style="--accent:var(--rose)">
          <div class="kpi-label">${icon("money", 14)}إجمالي المبيعات</div>
          <div class="kpi-value">${esc(money(stats.sales.total_sales))}</div>
          <div class="kpi-foot"><span>زي تقرير المبيعات في شوبيفاي</span></div>
        </div>
        <div class="card kpi" style="--accent:var(--amber)">
          <div class="kpi-label">${icon("chart", 14)}صافي المبيعات</div>
          <div class="kpi-value">${esc(money(stats.sales.net_sales))}</div>
          <div class="kpi-foot"><span>من غير شحن ولا ضرايب</span></div>
        </div>
        <div class="card kpi" style="--accent:var(--teal)">
          <div class="kpi-label">${icon("bag", 14)}الطلبات</div>
          <div class="kpi-value">${num(stats.order_count)}</div>
          <div class="kpi-foot"><span>${num(stats.cancelled_count)} ملغي</span></div>
        </div>
        <div class="card kpi" style="--accent:var(--lilac)">
          <div class="kpi-label">${icon("chart", 14)}متوسط الطلب</div>
          <div class="kpi-value">${esc(money(stats.average_order_value))}</div>
        </div>
        <div class="card kpi" style="--accent:var(--sky)">
          <div class="kpi-label">${icon("users", 14)}عملاء مختلفين</div>
          <div class="kpi-value">${num(stats.customer_count)}</div>
        </div>
        ${this.conversionCard()}
      </div>
      ${this.conversionNote()}

      ${card(tr("إجمالي المبيعات يوم بيوم"), this.rangeLabel(), `<div id="anTotalSales"></div>`)}
      ${card(tr("صافي المبيعات يوم بيوم"), this.rangeLabel(), `<div id="anNetSales"></div>`)}
      ${card(tr("تفصيل المبيعات"), this.rangeLabel(), this.salesBreakdown())}

      <div class="grid g-2">
        ${card(tr("عدد الطلبات يوميًا"), "", `<div id="anOrders"></div>`)}
        ${card(tr("الأكثر مبيعًا"), tr("بالقطعة"), this.stats.best_sellers.length
          ? barList(this.stats.best_sellers.map((b) => ({ label: b.title, value: b.quantity })), { tone: "clay" })
          : TR`<div class="empty"><div class="d">مفيش مبيعات في الفترة دي</div></div>`)}
      </div>

      ${card(tr("الطلبات حسب المحافظة"), this.rangeLabel(), `<div id="anGovernorate"></div>`)}

      <div class="grid g-2">
        ${card(tr("حالة الطلبات"), "", `<div class="donutwrap"><div id="anStatus"></div><div id="anStatusLegend" style="flex:1"></div></div>`)}
        ${card(tr("القنوات"), tr("الموقع مقابل البوت"), `<div class="donutwrap"><div id="anChannelMix"></div><div id="anChannelLegend" style="flex:1"></div></div>`)}
      </div>

      <div class="grid g-2">
        ${card(tr("طريقة الدفع"), tr("من الطلبات الفعّالة"), `<div class="donutwrap"><div id="anPayment"></div><div id="anPaymentLegend" style="flex:1"></div></div>`)}
        ${card(tr("قدامى وجدد"), tr("حسب عدد طلبات العميل الكلي في المتجر"), `<div class="donutwrap"><div id="anKind"></div><div id="anKindLegend" style="flex:1"></div></div>`)}
      </div>`;
  },

  /* The two figures shown as the sum they are, in Shopify's own order and
     with Shopify's own words: gross, less discounts, less returns, is net;
     plus shipping and taxes is total. Printed as rows rather than explained
     in a sentence so that a staff member holding the admin's Sales report
     next to this page can read down both at once.

     The one place the two part company is said out loud underneath: every
     figure on this page excludes cancelled orders, and Shopify's report
     counts them. */
  salesBreakdown() {
    const s = this.stats.sales;
    if (!s) return "";
    const row = (label, value, strong = false) => TR`<div class="kv">
      <span class="k" style="min-width:150px${strong ? ";font-weight:600;color:var(--ink-1)" : ""}">${label}</span>
      <span class="v num">${esc(money(value))}</span></div>`;
    return TR`
      ${row(tr("المبيعات قبل الخصم"), s.gross_sales)}
      ${row(tr("الخصومات"), s.discounts)}
      ${row(tr("المرتجعات"), s.returns)}
      ${row(tr("صافي المبيعات"), s.net_sales, true)}
      ${row(tr("الشحن"), s.shipping)}
      ${row(tr("الضرايب"), s.taxes)}
      ${row(tr("إجمالي المبيعات"), s.total_sales, true)}
      <div class="kpi-foot" style="margin-top:var(--s-3)"><span>الأرقام دي من غير الطلبات الملغية، وتقرير شوبيفاي بيعدّها</span></div>`;
  },

  /* What the cards say they are showing. A custom window has to name its own
     dates -- "30 days" over a chart of five is exactly the mislabelling the
     preset allow-list exists to prevent. */
  /* The window itself, both ends dated, for printing under a chart's axis.
     `rangeLabel` says "30 days" for a preset, which is the right thing on a
     card's subtitle and the wrong thing under an axis: the ticks there are
     dates, so what they need beside them is the two dates they run between.
     Read off the payload rather than off the series -- a stretch with no
     orders at either end would otherwise caption a chart with a window
     narrower than the one that was asked for. */
  rangeCaption() {
    const stats = this.stats || {};
    if (!stats.start || !stats.end) return this.rangeLabel();
    return `${shortDate(stats.start)} — ${shortDate(stats.end)}`;
  },

  rangeLabel() {
    if (this.start && this.end) {
      return this.start === this.end
        ? shortDate(this.start)
        : `${shortDate(this.start)} → ${shortDate(this.end)}`;
    }
    return `${this.days} ${tr("يوم")}`;
  },

  /* Orders the bot closed, over conversations the bot held.

     Not a site-wide conversion rate and never labelled as one: the Shopify
     Admin API this app reads has no traffic or session data at all (see
     `domain/services/dashboard_stats.py`). It is a count over a count, from
     two different sources, and the caption under it says exactly that.

     The numerator moves with the toggles and the denominator has to move with
     it, or the card renders a confident percentage that is simply wrong low.
     The channel toggle has a matching denominator (`insights.by_channel`).
     The payment toggle has none -- a conversation has no payment method --
     and the website has no bot conversations at all, so in both of those
     cases the honest answer is not to show the card rather than to divide by
     something that does not match. */
  conversion() {
    const stats = this.stats, insights = this.insights;
    if (!stats || stats.__error || !insights || insights.__error) return null;
    // Filtering the orders by how they were paid leaves nothing to divide by:
    // `conversations` counts every conversation regardless.
    if (this.payment !== "all") return null;
    // "الموقع" is by definition the orders no conversation preceded.
    if (this.channel === "web") return null;

    const conversations = this.channel === "all"
      ? insights.totals.conversations
      : (insights.by_channel[this.channel] || 0);
    if (!conversations) return null;
    return { rate: (stats.bot_order_count || 0) / conversations, orders: stats.bot_order_count || 0, conversations };
  },

  conversionCard() {
    const c = this.conversion();
    if (!c) return "";
    return TR`<div class="card kpi" style="--accent:var(--amber)">
      <div class="kpi-label">${icon("spark", 14)}محادثة ← طلب</div>
      <div class="kpi-value">${esc(pct(c.rate))}</div>
      <div class="kpi-foot"><span>${num(c.orders)} طلب من ${num(c.conversations)} محادثة</span></div>
    </div>`;
  },

  conversionNote() {
    if (!this.conversion()) return "";
    const scope = this.channel === "all" ? "" : TR` (${esc(channelLabel(this.channel))} بس)`;
    return TR`<div class="banner" data-tone="info">${icon("alert", 15)}
      <div><strong>محادثة ← طلب</strong>${scope} مش نسبة تحويل الموقع: شوبيفاي مابيديناش عدد زوار المتجر أصلاً.
      دي طلبات البوت في الفترة دي مقسومة على المحادثات اللي البوت اشتغل فيها — رقم على رقم، والمحادثة
      اللي ابتدت قبل الفترة أو الطلب اللي اتقفل بعدها مش متطابقين بالظبط. لو فلترت بطريقة الدفع
      الرقم ده بيختفي، لأن المحادثة مالهاش طريقة دفع تتقسم عليها.</div></div>`;
  },

  drawSales() {
    const stats = this.stats;
    if (stats.__error) return;
    const days = stats.revenue_by_day;
    const orderPoints = days.map((d) => ({ label: shortDate(d.date), short: d.date.slice(8), value: d.orders }));

    const spark = $("#anSpark");
    if (spark) spark.append(sparkline(days.map((d) => Number(d.revenue)), "clay"));

    const caption = this.rangeCaption();
    const salesChart = (slot, key, tone, label) => {
      const node = $(slot);
      if (!node) return;
      const pts = days.map((d) => ({ label: shortDate(d.date), value: Number(d[key]) }));
      node.innerHTML = "";
      node.append(pts.length ? lineChart(pts, { tone, fmt: money, height: 250, label, caption })
        : emptyState(tr("مفيش بيانات"), tr("مفيش طلبات في الفترة دي"), "chart"));
    };
    salesChart("#anTotalSales", "total_sales", "clay", tr("إجمالي المبيعات يوميًا"));
    salesChart("#anNetSales", "net_sales", "amber", tr("صافي المبيعات يوميًا"));

    const orders = $("#anOrders");
    if (orders) {
      orders.innerHTML = "";
      orders.append(orderPoints.length ? barChart(orderPoints, { tone: "teal", label: tr("عدد الطلبات يوميًا") })
        : emptyState(tr("مفيش بيانات"), "", "chart"));
    }

    const statuses = Object.entries(stats.status_breakdown).map(([k, v], i) => ({
      label: (ORDER_STATUS[k] || { label: k }).label, value: v,
      tone: (ORDER_STATUS[k] || {}).tone || CHART_TONES[i % CHART_TONES.length],
    }));
    const statusSlot = $("#anStatus");
    if (statusSlot) {
      statusSlot.append(donut(statuses, { center: num(stats.order_count + stats.cancelled_count) }));
      $("#anStatusLegend").innerHTML = barList(statuses, { tone: "teal" });
    }
    const governorates = (stats.orders_by_governorate || []).map((g) => ({
      // The empty key is a real bucket -- an order whose address carried no
      // province. Dropping it would stop the bars adding up to the order
      // count printed above them.
      label: g.governorate || tr("غير محدد"),
      short: (g.governorate || tr("غير محدد")).slice(0, 6),
      value: g.orders,
    }));
    const govSlot = $("#anGovernorate");
    if (govSlot) {
      govSlot.innerHTML = "";
      govSlot.append(governorates.length
        ? barChart(governorates, { tone: "sky", label: tr("الطلبات حسب المحافظة"), height: 230 })
        : emptyState(tr("مفيش بيانات"), tr("مفيش طلبات في الفترة دي"), "chart"));
    }

    const mixes = [

        this.stats.revenue_by_day.map((d) => [d.date, d.revenue, d.orders]));

          this.insights.new_contacts_by_day[i] ? this.insights.new_contacts_by_day[i].count : 0,

  },
};

          ${swap ? TR`<div class="grid g-2" style="margin-top:var(--s-3)">

            <div><label class="lbl">إلى مقاس</label>

VIEWS.staff = {
  data: null,

  async mount(force) {
    $("#pageActions").append(

              <div class="cellsub">${esc(shortDate(s.created_at))}</div></td>
          <td>${chipHTML(ROLE_LABELS[s.role] || s.role, owner ? "clay" : "lilac")}</td>
          <td>${chipHTML(s.is_active ? tr("نشط") : tr("موقوف"), s.is_active ? "teal" : "rose", "dot")}</td>

    $("#staffBody").innerHTML = TR`
      <div class="banner" data-tone="info">${icon("alert", 15)}

/* The permission tick-list, shared by the create and edit forms so the two can
   never drift into offering different sets. */
function permissionChecklist(permissions, granted, { disabled = false } = {}) {
  return `<div class="grid g-2" id="permGrid">${permissions.map((p) => `
    <label class="flagrow" style="cursor:${disabled ? "default" : "pointer"}">
      <div class="i">
        <div class="l">${esc(pick(p, "label"))}</div>
        <div class="d">${esc(pick(p, "description"))}</div>
      </div>
      <input type="checkbox" data-perm="${esc(p.key)}" ${granted.includes(p.key) ? "checked" : ""}
        ${disabled ? "disabled" : ""} aria-label="${esc(pick(p, "label"))}">
    </label>`).join("")}</div>`;
}

function checkedPermissions() {
  return $$("#permGrid [data-perm]").filter((i) => i.checked).map((i) => i.dataset.perm);
}

async function staffCreateForm() {
  // The tick-list is built from the catalog the Team list carries. Opening
  // this before that fetch has landed would render an empty grid, and
  // creating from it would post `permissions: []` -- an account with no
  // access at all, silently, because a panel had not loaded yet.
  if (!VIEWS.staff.data) await VIEWS.staff.load();
  const permissions = (VIEWS.staff.data || {}).permissions || [];
  const body = overlay.drawer(tr("عضو فريق جديد"), TR`
    <div class="grid g-2">
      <div><label class="lbl" for="stUser">اسم الدخول *</label>
        <input class="inp" id="stUser" autocomplete="off" dir="ltr"></div>
      <div><label class="lbl" for="stPass">كلمة السر *</label>
        <input class="inp" id="stPass" type="password" autocomplete="new-password" dir="ltr"></div>
    </div>
    <div class="hint" style="margin:var(--s-2) 0">٨ حروف على الأقل.</div>
    <label class="lbl" for="stRole">الدور</label>
    <select class="inp" id="stRole">
      <option value="staff">عضو فريق — بيشوف اللي تحت بس</option>
      <option value="owner">مالك — بيشوف كل حاجة</option>
    </select>
    <div style="height:var(--s-4)"></div>
    <div id="stPerms">${permissionChecklist(permissions, [])}</div>
    <div style="height:var(--s-4)"></div>
    <div class="row"><button class="btn primary" type="button" id="stSave">${icon("check", 15)} إنشاء الحساب</button></div>`);

  const syncRole = () => { $("#stPerms").hidden = $("#stRole").value === "owner"; };
  $("#stRole").addEventListener("change", syncRole);
  syncRole();

  $("#stSave").addEventListener("click", async () => {
    const role = $("#stRole").value;
    const result = await api("/dashboard/api/staff", {
      method: "POST", quiet: true,
      body: {
        username: $("#stUser").value.trim(),
        password: $("#stPass").value,
        role,
        permissions: role === "owner" ? null : checkedPermissions(),
      },
    });
    if (result.__error) return toastError(result.__error, tr("مانفعش نعمل الحساب"));
    toast(tr("الحساب اتعمل"), result.username);
    overlay.close();
    VIEWS.staff.load();
  });
  return body;
}

function staffEditForm(member, permissions, isMe) {
  const owner = member.role === "owner";
  overlay.drawer(member.username, TR`
    ${isMe ? TR`<div class="banner" data-tone="info">${icon("alert", 15)}
      <div>ده حسابك انت. الدور والصلاحيات بتاعتك مش بتتغير من هنا — عشان محدش يقفل على نفسه بالغلط.</div></div>
      <div style="height:var(--s-3)"></div>` : ""}
    <label class="lbl" for="stRole">الدور</label>
    <select class="inp" id="stRole" ${isMe ? "disabled" : ""}>
      <option value="staff" ${owner ? "" : "selected"}>عضو فريق</option>
      <option value="owner" ${owner ? "selected" : ""}>مالك</option>
    </select>
    <div style="height:var(--s-4)"></div>
    <div id="stPerms">${permissionChecklist(permissions, member.permissions, { disabled: isMe })}</div>
    <div style="height:var(--s-4)"></div>
    <label class="lbl" for="stPass">كلمة سر جديدة (سيبها فاضية لو مش هتتغير)</label>
    <input class="inp" id="stPass" type="password" autocomplete="new-password" dir="ltr">
    <div style="height:var(--s-4)"></div>
    <div class="row">
      <button class="btn primary" type="button" id="stSave">${icon("check", 15)} حفظ</button>
      ${isMe ? "" : `<button class="btn ${member.is_active ? "danger" : ""}" type="button" id="stToggle">
        ${member.is_active ? tr("إيقاف الحساب") : tr("تفعيل الحساب")}</button>`}
    </div>`);

  const syncRole = () => { $("#stPerms").hidden = $("#stRole").value === "owner"; };
  $("#stRole").addEventListener("change", syncRole);
  syncRole();

  const save = async (extra) => {
    const role = $("#stRole").value;
    const body = { ...extra };
    if (!isMe) {
      body.role = role;
      if (role !== "owner") body.permissions = checkedPermissions();
    }
    const password = $("#stPass").value;
    if (password) body.password = password;
    const result = await api(`/dashboard/api/staff/${member.staff_id}`,
      { method: "POST", quiet: true, body });
    if (result.__error) return toastError(result.__error, tr("التعديل مانفذش"));
    toast(tr("اتحفظ"));
    overlay.close();
    VIEWS.staff.load();
  };

  $("#stSave").addEventListener("click", () => save({}));
  const toggle = $("#stToggle");
  if (toggle) toggle.addEventListener("click", () => save({ is_active: !member.is_active }));
}

              <div class="d">${esc(pick(f, "description"))}</div>
              ${f.overridden ? TR`<div class="m">اتغيرت بواسطة ${esc(f.updated_by || tr("الفريق"))} · ${esc(dateTime(f.updated_at))}</div>` : ""}
            </div>
            <label class="switch">
              <input type="checkbox" data-flag="${esc(f.key)}" ${f.value ? "checked" : ""}
                aria-label="${esc(pick(f, "label"))}">
              <span class="track"></span><span class="knob"></span>
            </label>
          </div>`).join(""), "", { flush: true })}

      ${card(tr("أرقام الاختبار"), tr("الأرقام دي مستبعدة من كل أرقام صفحة التحليلات"), TR`
        <div class="row" style="margin-bottom:var(--s-3)">
          <input class="inp num" id="tnPhone" placeholder="رقم التليفون" style="max-width:200px" dir="ltr">
          <input class="inp" id="tnNote" placeholder="ملاحظة (اختياري)" style="max-width:260px">
          <button class="btn primary" type="button" id="tnAdd">${icon("plus", 15)} ضيف</button>
        </div>
        <div id="tnList">${numbers.__error ? errorBanner(numbers.__error, tr("الأرقام"))
          : numbers.numbers.length ? numbers.numbers.map((n) => TR`
            <div class="mini">
              <span class="m1"><span class="a num" dir="ltr">${esc(n.phone)}</span>
                <span class="b">${esc(n.note || "")} ${n.added_by ? `· ${esc(n.added_by)}` : ""}</span></span>
              <button class="btn sm ghost" type="button" data-rmnum="${esc(n.phone)}" aria-label="حذف">${icon("x", 15)}</button>
            </div>`).join("")
          : TR`<div class="empty" style="padding:var(--s-4)"><div class="d">مفيش أرقام اختبار</div></div>`}</div>`)}

      ${card(tr("حالة النظام"), tr("قراءة فقط"), status.__error ? errorBanner(status.__error, tr("الحالة")) : `
        <div class="grid g-2">
          ${[[tr("مزود الموديل"), status.llm_provider, true],
             [tr("مفتاح الموديل"), status.llm_key_set ? tr("متسجّل") : tr("ناقص"), status.llm_key_set],
             [tr("واتساب"), status.whatsapp_configured ? tr("مظبوط") : tr("ناقص"), status.whatsapp_configured],
             [tr("شوبيفاي"), status.shopify_configured ? tr("مظبوط") : tr("ناقص"), status.shopify_configured],
             [tr("ويبهوك شوبيفاي"), status.shopify_webhooks_configured ? tr("مظبوط") : tr("ناقص — يعني مفيش رسايل تتبع"), status.shopify_webhooks_configured],
             [tr("دخول اللوحة"), status.dashboard_configured ? tr("مظبوط") : tr("ناقص"), status.dashboard_configured]]
            .map(([label, value, ok]) => `<div class="kv">
              <span class="k">${esc(label)}</span>
              <span class="v">${chipHTML(String(value), ok ? "teal" : "rose", ok ? "dot" : "bar")}</span></div>`).join("")}
        </div>`)}

      ${card(tr("المظهر"), tr("بيتحفظ في المتصفح ده بس"), TR`
        <div class="row">
          <div class="seg">
            <button type="button" data-theme-set="light" aria-pressed="${document.documentElement.dataset.theme === "light"}">نهاري</button>
            <button type="button" data-theme-set="dark" aria-pressed="${document.documentElement.dataset.theme === "dark"}">ليلي</button>
          </div>
          <span class="hint">اختصار: زرار القمر في الشريط الجانبي.</span>
        </div>`)}

      ${card(tr("اختصارات لوحة المفاتيح"), "", `
        <div class="grid g-2">
          ${[[tr("Ctrl K أو /"), tr("لوحة الأوامر والبحث")], ["I", tr("الوارد")], ["O", tr("الطلبات")], ["P", tr("المنتجات")],
             ["S", tr("المخزون")], ["A", tr("التحليلات")], ["H", tr("اليوم")], ["R", tr("تحديث الصفحة")],
             ["Ctrl Enter", tr("إرسال الرد")], ["Esc", tr("إغلاق أي نافذة")]]
            .map(([k, d]) => `<div class="kv"><span class="k"><kbd style="font-family:var(--font-num);background:var(--surface-3);border-radius:var(--r-xs);padding:2px 7px">${esc(k)}</kbd></span>
              <span class="v">${esc(d)}</span></div>`).join("")}
        </div>`)}`;

    $$("[data-flag]").forEach((input) => input.addEventListener("change", async () => {
      const result = await api(`/dashboard/api/settings/flags/${encodeURIComponent(input.dataset.flag)}`,
        { method: "POST", quiet: true, body: { value: input.checked } });
      if (result.__error) { input.checked = !input.checked; return toastError(result.__error, tr("مانفعش نغيّر الميزة")); }
      toast(input.checked ? tr("الميزة اتفتحت") : tr("الميزة اتقفلت"));
    }));

    const add = $("#tnAdd");
    if (add) add.addEventListener("click", async () => {
      const phone = $("#tnPhone").value.trim();
      if (!phone) return toast(tr("اكتب الرقم"), "", "warn");
      const result = await api("/dashboard/api/settings/test-numbers",
        { method: "POST", quiet: true, body: { phone, note: $("#tnNote").value.trim() } });
      if (result.__error) return toastError(result.__error, tr("الإضافة مانفذتش"));
      toast(tr("الرقم اتضاف"));
      this.mount(true);
    });

    $$("[data-rmnum]").forEach((b) => b.addEventListener("click", async () => {
      const result = await api(`/dashboard/api/settings/test-numbers/${encodeURIComponent(b.dataset.rmnum)}`,
        { method: "DELETE", quiet: true });
      if (result.__error) return toastError(result.__error, tr("الحذف مانفذش"));
      toast(tr("الرقم اتشال"));
      this.mount(true);
    }));

    $$("[data-theme-set]").forEach((b) => b.addEventListener("click", () => {
      applyTheme(b.dataset.themeSet);
      $$("[data-theme-set]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    }));
  },
};

/* ==========================================================================
   boot
   ========================================================================== */

async function boot() {
  const me = await api("/dashboard/api/me", { quiet: true });
  if (me.__error) { location.href = "/dashboard/login"; return; }
  state.me = me;

  $("#meName").textContent = me.username;
  $("#meAvatar").textContent = (me.username || tr("؟")).slice(0, 1).toUpperCase();

  translateShell();
  buildNav();
  $("#boot").remove();
  $("#app").hidden = false;

  go(location.hash.slice(1) || "overview");
  loadStatus();

  // Badges are business state, not page state: they stay current while
  // someone sits on a page that has nothing to do with them.
  setInterval(async () => {
    if (document.visibilityState !== "visible") return;
    if (may("inbox")) {
      const inbox = await api("/dashboard/api/inbox?status=needs_reply", { quiet: true });
      if (!inbox.__error) setBadge("inbox", inbox.counts.needs_reply || 0);
    }
    if (may("queue")) {
      const queue = await api("/dashboard/api/queue", { quiet: true });
      if (!queue.__error) setBadge("queue", queue.items.length, "warn");
    }
  }, 60000);
}

boot();

</script>
</body>
</html>
