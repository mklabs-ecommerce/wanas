VIEWS.inbox = {
  loaded: false,
  async mount(force) {
    $("#pageActions").append(
      el("button", { class: "btn sm", type: "button", html: `${icon("refresh", 15)} تحديث`,
        onclick: () => this.load(true) }),
    );
    if (!this.loaded) {
      this.loaded = true;
      this.wire();
    }
    if (force || !state.inbox.items.length) await this.load(true);
    else this.renderList();
  },

  wire() {
    const search = $("#inboxSearch");
    let timer = null;
    search.addEventListener("input", () => {
      clearTimeout(timer);
      timer = setTimeout(() => { state.inbox.q = search.value.trim(); this.load(true); }, 260);
    });

    $("#inboxStatus").innerHTML = INBOX_STATUSES.map((s) => `
      <button class="fchip" type="button" data-status="${s.id}" aria-pressed="${s.id === state.inbox.status}">
        ${esc(s.label)}<span class="n" data-count="${s.id}"></span></button>`).join("");
    $$("#inboxStatus .fchip").forEach((b) => b.addEventListener("click", () => {
      state.inbox.status = b.dataset.status;
      $$("#inboxStatus .fchip").forEach((x) => x.setAttribute("aria-pressed", x === b));
      this.load(true);
    }));

    const channels = [{ id: "", label: "كل القنوات" }, { id: "whatsapp", label: "واتساب" }, { id: "instagram_dm", label: "انستجرام" }];
    $("#inboxChannel").innerHTML = channels.map((c) => `
      <button class="fchip" type="button" data-channel="${c.id}" aria-pressed="${c.id === state.inbox.channel}">
        ${esc(c.label)}<span class="n" data-chcount="${c.id}"></span></button>`).join("");
    $$("#inboxChannel .fchip").forEach((b) => b.addEventListener("click", () => {
      state.inbox.channel = b.dataset.channel;
      $$("#inboxChannel .fchip").forEach((x) => x.setAttribute("aria-pressed", x === b));
      this.load(true);
    }));

    $("#backToList").addEventListener("click", () => $("#view-inbox").classList.remove("reading"));
    $("#sendBtn").addEventListener("click", sendReply);
    const box = $("#replyText");
    box.addEventListener("input", () => {
      box.style.height = "auto";
      box.style.height = `${Math.min(box.scrollHeight, 168)}px`;
    });
    box.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && (event.ctrlKey || event.metaKey)) { event.preventDefault(); sendReply(); }
    });

    // Live-ish: the list refreshes on a timer while this view is open, so a
    // new handoff appears without anyone hitting refresh. Paused only while
    // a drawer is open, so a poll never yanks the list out from under a read.
    //
    // Ten seconds, not twenty: a customer's message now reaches `sessions` on
    // arrival rather than after the bot replies, so this interval is the whole
    // remaining delay between someone writing in and staff seeing it.
    setInterval(() => {
      if (state.route === "inbox" && !overlay.open && document.visibilityState === "visible") this.load(false);
    }, 10000);
  },

  async load(showSpinner) {
    if (showSpinner) $("#convList").innerHTML = Array.from({ length: 7 },
      () => '<div class="skel skel-row" style="height:44px"></div>').join("");

    const params = new URLSearchParams();
    if (state.inbox.q) params.set("q", state.inbox.q);
    if (state.inbox.channel) params.set("channel", state.inbox.channel);
    if (state.inbox.status !== "all") params.set("status", state.inbox.status);
    const data = await api(`/dashboard/api/inbox?${params}`, { quiet: true });
    if (data.__error) {
      $("#convList").innerHTML = `<div style="padding:var(--s-4)">${errorBanner(data.__error, "المحادثات")}</div>`;
      return;
    }
    state.inbox.items = data.conversations;
    state.inbox.counts = data.counts;
    setBadge("inbox", data.counts.needs_reply || 0);
    Object.entries(data.counts).forEach(([k, v]) => {
      const node = $(`#inboxStatus [data-count="${k}"]`);
      if (node) node.textContent = v ? String(v) : "";
    });
    const all = $('#inboxChannel [data-chcount=""]');
    if (all) all.textContent = data.counts.all ? String(data.counts.all) : "";
    Object.entries(data.by_channel).forEach(([k, v]) => {
      const node = $(`#inboxChannel [data-chcount="${k}"]`);
      if (node) node.textContent = String(v);
    });
    this.renderList();
  },

  renderList() {
    const list = $("#convList");
    const items = state.inbox.items;
    if (!items.length) {
      list.innerHTML = "";
      list.append(emptyState("مفيش محادثات هنا", "جرّب فلتر تاني أو امسح البحث", "inbox"));
      return;
    }
    const selected = state.inbox.selected;
    list.innerHTML = items.map((c) => {
      const info = channelInfo(c.channel);
      const isSelected = selected && selected.channel === c.channel && selected.external_id === c.external_id;
      const tags = [];
      if (c.paused) tags.push(chipHTML(reasonLabel(c.reason), c.reason === "manual" ? "clay" : "rose", "ring"));
      if (c.last_role === "customer" && !c.paused) tags.push(chipHTML("محتاج متابعة", "amber", "dot"));
      tags.push(chipHTML(info.label, info.tone, "bar"));
      return `<button class="conv" role="option" aria-selected="${!!isSelected}"
          data-ch="${esc(c.channel)}" data-id="${esc(c.external_id)}">
        <span class="avatar" data-ch="${esc(c.channel)}" aria-hidden="true">${esc(info.short)}</span>
        <span class="meta">
          <span class="line1">
            <span class="nm">${esc(c.customer_name || c.external_id)}</span>
            <span class="tm">${esc(ago(c.updated_at))}</span>
          </span>
          <span class="pv">${esc(c.preview || "—")}</span>
          <span class="tags">${tags.join("")}</span>
        </span>
      </button>`;
    }).join("");
    $$(".conv", list).forEach((node) => node.addEventListener("click", () =>
      openConversation(node.dataset.ch, node.dataset.id)));
  },
};

/* --- one conversation ------------------------------------------------------ */

async function openConversation(channel, externalId) {
  state.inbox.selected = { channel, external_id: externalId };
  $("#view-inbox").classList.add("reading");
  $$(".conv").forEach((n) => n.setAttribute("aria-selected",
    String(n.dataset.ch === channel && n.dataset.id === externalId)));

  $("#threadHead").hidden = false;
  $("#backToList").style.display = window.innerWidth <= 900 ? "" : "none";
  $("#log").innerHTML = '<div class="skel" style="height:70%;margin:auto;width:100%;max-width:520px"></div>';

  const data = await api(`/dashboard/api/conversations/${encodeURIComponent(channel)}/${encodeURIComponent(externalId)}`, { quiet: true });
  if (data.__error) {
    $("#log").innerHTML = errorBanner(data.__error, "المحادثة");
    return;
  }
  state.inbox.detail = data;
  renderThread(data);
}

function renderThread(data) {
  const info = channelInfo(data.channel);
  $("#threadAvatar").textContent = info.short;
  $("#threadAvatar").dataset.ch = data.channel;
  const summary = state.inbox.items.find((c) => c.channel === data.channel && c.external_id === data.external_id);
  $("#threadName").textContent = (summary && summary.customer_name) || data.external_id;
  $("#threadSub").innerHTML = `${chipHTML(info.label, info.tone, "bar")}
    <span class="num" data-copy="${esc(data.external_id)}" data-copy-what="المعرّف"
      style="cursor:pointer" title="اضغط للنسخ">${esc(data.external_id)}</span>
    ${data.paused ? chipHTML(reasonLabel(data.reason), "rose", "ring") : chipHTML("البوت شغال", "teal", "dot")}`;

  const actions = $("#threadActions");
  actions.innerHTML = "";
  if (data.paused) {
    actions.append(el("button", { class: "btn sm", type: "button", html: `${icon("bot", 14)} رجّع البوت`,
      onclick: () => conversationAction("release", "الرد رجع للبوت") }));
  } else {
    actions.append(el("button", { class: "btn sm", type: "button", html: `${icon("user", 14)} استلم المحادثة`,
      onclick: () => conversationAction("takeover", "المحادثة بقت معاك") }));
  }
  actions.append(el("button", {
    class: "btn sm icon ghost", type: "button", title: "إعادة تعيين المحادثة", "aria-label": "إعادة تعيين المحادثة",
    html: icon("refresh", 15),
    onclick: async () => {
      const ok = await overlay.confirm("إعادة تعيين المحادثة؟",
        "ده بيمسح تاريخ المحادثة والسلة عشان العميل يبدأ من الأول. بيانات العميل وطلباته مش بتتمس.",
        "امسح وابدأ من الأول", { danger: true });
      if (ok) conversationAction("reset", "المحادثة رجعت من الأول");
    },
  }));

  const log = $("#log");
  log.innerHTML = "";
  if (!data.history.length) {
    log.append(emptyState("المحادثة فاضية", "لسه محصلش كلام هنا", "inbox"));
  }
  for (const item of data.history) {
    if (item.kind === "user") {
      const bubble = el("div", { class: "bubble user" });
      bubble.innerHTML = `<span class="by">${icon("user", 11)} العميل</span>${esc(item.text || "")}`;
      (item.images || []).forEach((src) => bubble.insertAdjacentHTML("beforeend",
        `<img class="att" loading="lazy" alt="صورة من العميل" src="${mediaURL(src)}">`));
      (item.audio || []).forEach((src) => bubble.insertAdjacentHTML("beforeend",
        `<audio controls preload="none" src="${mediaURL(src)}"></audio>`));
      log.append(bubble);
    } else if (item.kind === "bot") {
      // Three voices, not two: the model, a staff member, and the automated
      // pushes (order confirmation, shipping updates, back-in-stock, cart
      // nudges) that the shop sends on its own. They all reach the same
      // WhatsApp thread, so the transcript has to say which is which.
      const who = item.by === "staff" ? "staff" : item.by === "system" ? "system" : "bot";
      const LABEL = { staff: "الفريق", system: "رسالة تلقائية", bot: "البوت" };
      const GLYPH = { staff: "user", system: "spark", bot: "bot" };
      const bubble = el("div", { class: `bubble ${who}` });
      bubble.innerHTML = `<span class="by">${icon(GLYPH[who], 11)} ${LABEL[who]}</span>${esc(item.text || "")}`;
      (item.attachments || []).forEach((src) => bubble.insertAdjacentHTML("beforeend",
        `<img class="att" loading="lazy" alt="صورة اتبعتت للعميل" src="${mediaURL(src)}">`));
      log.append(bubble);
    } else if (item.kind === "tools") {
      log.append(el("div", { class: "sysline", html: `${icon("spark", 12)} ${esc((item.names || []).join("، "))}` }));
    } else if (item.kind === "refusals") {
      log.append(el("div", { class: "sysline", dataset: { tone: "bad" },
        html: `${icon("alert", 12)} ${esc((item.refusals || []).map((r) => `${r.name}: ${r.error}`).join(" · "))}` }));
    }
  }
  log.scrollTop = log.scrollHeight;

  const composer = $("#composer");
  composer.hidden = false;
  $("#replyText").disabled = !data.paused;
  $("#sendBtn").disabled = !data.paused;
  $("#quickReplies").innerHTML = data.paused ? QUICK_REPLIES.map((q) =>
    `<button type="button">${esc(q)}</button>`).join("") : "";
  $$("#quickReplies button").forEach((b) => b.addEventListener("click", () => {
    const box = $("#replyText");
    box.value = box.value ? `${box.value} ${b.textContent}` : b.textContent;
    box.focus();
  }));
  $("#composerNote").innerHTML = data.paused
    ? `${icon("check", 13)} أول ما تبعت، المحادثة بترجع للبوت تلقائيًا.`
    : `${icon("bot", 13)} البوت ماسك المحادثة دلوقتي — استلمها الأول عشان ترد بنفسك.`;

  renderContext(data, summary);
}

const QUICK_REPLIES = [
  "أهلاً بيك 👋 معاك فريق ونس",
  "بنراجع طلبك دلوقتي وهنرد عليك حالاً",
  "الطلب اتشحن وهيوصلك خلال ٢-٤ أيام",
  "آسفين على التأخير، تحت أمرك",
];

function mediaURL(path) {
  if (/^https?:\/\//i.test(path)) return path;
  return `/dashboard/media?path=${encodeURIComponent(path)}`;
}

async function conversationAction(action, successMessage) {
  const { channel, external_id: externalId } = state.inbox.selected;
  const result = await api(
    `/dashboard/api/conversations/${encodeURIComponent(channel)}/${encodeURIComponent(externalId)}/${action}`,
    { method: "POST", quiet: true },
  );
  if (result.__error) return toastError(result.__error, "الأمر مانفذش");
  toast(successMessage);
  await VIEWS.inbox.load(false);
  openConversation(channel, externalId);
}

async function sendReply() {
  const box = $("#replyText");
  const text = box.value.trim();
  if (!text) return;
  const { channel, external_id: externalId } = state.inbox.selected;
  $("#sendBtn").disabled = true;
  const result = await api(
    `/dashboard/api/conversations/${encodeURIComponent(channel)}/${encodeURIComponent(externalId)}/reply`,
    { method: "POST", body: { text }, quiet: true },
  );
  $("#sendBtn").disabled = false;
  if (result.__error) {
    // 409 here means the bot took the conversation back between load and
    // send; saying so is the difference between "try again" and "why".
    const message = result.__error.code === "not_paused"
      ? "المحادثة رجعت للبوت — استلمها تاني وابعت"
      : result.__error.message;
    return toast("الرسالة مابعتتش", message, "bad", 6000);
  }
  box.value = "";
  box.style.height = "auto";
  toast("الرسالة اتبعتت", "والمحادثة رجعت للبوت");
  await VIEWS.inbox.load(false);
  openConversation(channel, externalId);
}

function renderContext(data, summary) {
  const context = $("#threadContext");
  $("#view-inbox").classList.add("with-context");
  context.hidden = false;
  const blocks = [];

  blocks.push(`<div class="ctx-block">
    <h3>الحالة</h3>
    <div class="kv"><span class="k">القناة</span><span class="v">${esc(channelInfo(data.channel).label)}</span></div>
    <div class="kv"><span class="k">المعرّف</span><span class="v num">${esc(data.external_id)}</span></div>
    <div class="kv"><span class="k">المسؤول</span><span class="v">${data.paused ? "الفريق" : "البوت"}</span></div>
    ${summary ? `<div class="kv"><span class="k">آخر نشاط</span><span class="v">${esc(dateTime(summary.updated_at))}</span></div>` : ""}
    ${summary ? `<div class="kv"><span class="k">عدد الرسايل</span><span class="v num">${num(summary.message_count)}</span></div>` : ""}
  </div>`);

  if (data.reason && data.reason !== "manual") {
    blocks.push(`<div class="ctx-block">
      <h3>سبب التحويل</h3>
      <div class="banner" style="margin-bottom:var(--s-2)">${icon("alert", 15)}<div>${esc(reasonLabel(data.reason))}</div></div>
      ${data.summary ? `<p style="font-size:12.5px;color:var(--ink-2)">${esc(data.summary)}</p>` : ""}
    </div>`);
  }

  if (summary && summary.client_id) {
    blocks.push(`<div class="ctx-block" id="ctxClient"><h3>العميل</h3>
      <div class="skel skel-row" style="margin:0 0 8px"></div></div>`);
  }

  context.innerHTML = blocks.join("");

  if (summary && summary.client_id) {
    api(`/dashboard/api/customers/${summary.client_id}`, { quiet: true }).then((client) => {
      const slot = $("#ctxClient", context);
      if (!slot || client.__error) return;
      slot.innerHTML = `<h3>العميل</h3>
        <div class="kv"><span class="k">الاسم</span><span class="v">${esc(client.full_name)}</span></div>
        <div class="kv"><span class="k">التليفون</span><span class="v num" data-copy="${esc(client.phone)}" data-copy-what="التليفون" style="cursor:pointer">${esc(client.phone)}</span></div>
        <div class="kv"><span class="k">المحافظة</span><span class="v">${esc(client.governorate || "—")}</span></div>
        <div class="kv"><span class="k">العنوان</span><span class="v">${esc(client.address || "—")}</span></div>
        <h3 style="margin-top:var(--s-4)">آخر الطلبات</h3>
        ${client.orders.length ? client.orders.slice(0, 5).map((o) => `
          <div class="kv"><span class="k num">${esc(o.reference)}</span>
          <span class="v">${esc(money(o.total))} · ${esc(o.status)}</span></div>`).join("")
          : '<div class="kv"><span class="v" style="color:var(--ink-3)">مفيش طلبات</span></div>'}`;
    });
  }
}

/* Shopify's search syntax is powerful and nobody remembers it. These are the
   filters staff actually ask for, written once, as buttons. */
const ORDER_PRESETS = [
  { id: "", label: "الكل", q: "" },
  { id: "open", label: "مستنية شحن", q: "fulfillment_status:unfulfilled AND status:open" },
  { id: "shipped", label: "متشحنة", q: "fulfillment_status:shipped" },
  { id: "bot", label: "من البوت", q: "tag:chatbot" },
  { id: "site", label: "من الموقع", q: "-tag:chatbot" },
  { id: "cancelled", label: "ملغية", q: "status:cancelled" },
];

VIEWS.orders = {
  preset: "", search: "", rows: [],

  async mount(force) {
    $("#pageActions").append(
      el("button", { class: "btn sm", type: "button", html: `${icon("download", 15)} تصدير`,
        onclick: () => this.export() }),
      el("button", { class: "btn sm", type: "button", html: `${icon("refresh", 15)} تحديث`,
        onclick: () => this.load() }),
    );
    if (force || !this.rows.length) await this.load();
    else this.render();
  },

  async load() {
    const body = $("#ordersBody");
    body.innerHTML = this.toolbar() + skeletonTable(8);
    this.wire();
    const preset = ORDER_PRESETS.find((p) => p.id === this.preset);
    const parts = [preset && preset.q, this.search].filter(Boolean);
    const query = parts.join(" AND ");
    const data = await api(`/dashboard/api/shopify/orders${query ? `?q=${encodeURIComponent(query)}` : ""}`, { quiet: true });
    if (data.__error) { body.innerHTML = this.toolbar() + errorBanner(data.__error, "الطلبات"); this.wire(); return; }
    this.rows = data.orders;
    this.render();
  },

  toolbar() {
    return `<div class="pagehead">
      <div class="t">
        <h2>الطلبات</h2>
        <div class="d">مصدرها شوبيفاي مباشرة — طلبات البوت وطلبات الموقع مع بعض</div>
      </div>
      <div class="row">
        <div class="field" style="min-width:230px">
          ${icon("search", 15)}
          <input id="ordersSearch" type="search" placeholder="رقم طلب، اسم، أو صيغة شوبيفاي" value="${esc(this.search)}">
        </div>
      </div>
      <div class="inbox-filters" style="width:100%">
        ${ORDER_PRESETS.map((p) => `<button class="fchip" type="button" data-preset="${p.id}"
          aria-pressed="${p.id === this.preset}">${esc(p.label)}</button>`).join("")}
      </div>
    </div>`;
  },

  wire() {
    const search = $("#ordersSearch");
    if (search) {
      search.addEventListener("keydown", (event) => {
        if (event.key === "Enter") { this.search = search.value.trim(); this.load(); }
      });
    }
    $$("[data-preset]").forEach((b) => b.addEventListener("click", () => {
      this.preset = b.dataset.preset; this.load();
    }));
  },

  render() {
    const body = $("#ordersBody");
    const totals = this.rows.reduce((acc, o) => {
      if (!o.cancelled) { acc.revenue += Number(o.total) || 0; acc.count += 1; }
      if (o.source === "chatbot") acc.bot += 1;
      if ((o.fulfillment_status || "UNFULFILLED") === "UNFULFILLED" && !o.cancelled) acc.pending += 1;
      return acc;
    }, { revenue: 0, count: 0, bot: 0, pending: 0 });

    const rowsHTML = this.rows.map((o) => `
      <tr data-clickable data-gid="${esc(o.id)}">
        <td><div class="cellmain num">${esc(o.name)}</div>
            <div class="cellsub">${esc(shortDate(o.created_at))}</div></td>
        <td><div class="cellmain">${esc(o.customer_name || "—")}</div>
            <div class="cellsub num">${esc(o.customer_phone || "")}</div></td>
        <td>${esc(o.governorate || "—")}</td>
        <td>${(o.line_items || []).length ? esc(`${o.line_items.length} صنف`) : "—"}</td>
        <td>${statusChip(o.fulfillment_status, o.cancelled)}</td>
        <td>${chipHTML(o.source === "chatbot" ? "البوت" : "الموقع", o.source === "chatbot" ? "teal" : "lilac")}</td>
        <td class="num">${esc(money(o.total))}</td>
      </tr>`).join("");

    body.innerHTML = this.toolbar() + `
      <div class="grid g-kpi">
        ${[["إجمالي المعروض", money(totals.revenue), "clay", "money"],
           ["طلبات فعّالة", num(totals.count), "teal", "bag"],
           ["مستنية شحن", num(totals.pending), "amber", "truck"],
           ["من البوت", num(totals.bot), "lilac", "bot"]]
          .map(([l, v, t, ic]) => `<div class="card kpi" style="--accent:${toneVar(t)}">
            <div class="kpi-label">${icon(ic, 14)}${esc(l)}</div>
            <div class="kpi-value">${esc(v)}</div></div>`).join("")}
      </div>` +
      (this.rows.length
        ? card("قائمة الطلبات", `${this.rows.length} طلب`, tableHTML(
            ["الطلب", "العميل", "المحافظة", "الأصناف", "الشحن", "المصدر", { label: "الإجمالي", num: true }],
            rowsHTML, { minWidth: 860 }), "", { flush: true })
        : `<div class="card"><div class="card-body"></div></div>`);

    this.wire();
    if (!this.rows.length) {
      $("#ordersBody .card:last-child .card-body").append(
        emptyState("مفيش طلبات بالفلتر ده", "جرّب فلتر تاني أو امسح البحث", "bag"));
    }
    $$("#ordersBody tr[data-gid]").forEach((tr) =>
      tr.addEventListener("click", () => openOrder(tr.dataset.gid)));
  },

  export() {
    if (!this.rows.length) return toast("مفيش بيانات للتصدير", "", "warn");
    exportCSV("orders.csv",
      ["رقم الطلب", "التاريخ", "العميل", "التليفون", "المحافظة", "الحالة", "المصدر", "الإجمالي"],
      this.rows.map((o) => [o.name, o.created_at, o.customer_name, o.customer_phone,
        o.governorate, o.cancelled ? "ملغي" : (o.fulfillment_status || ""), o.source, o.total]));
  },
};

  if (order.__error) { body.innerHTML = errorBanner(order.__error, "الطلب"); return; }

  $("#drawerTitle").textContent = `طلب ${order.name}`;
  const lines = (order.line_items || []).map((li) => `
    <tr>

      ${card("العميل", "", `
        <div class="kv"><span class="k">الاسم</span><span class="v">${esc(order.customer_name || "—")}</span></div>
        <div class="kv"><span class="k">التليفون</span><span class="v num" data-copy="${esc(order.customer_phone || "")}" data-copy-what="التليفون" style="cursor:pointer">${esc(order.customer_phone || "—")}</span></div>
        <div class="kv"><span class="k">المحافظة</span><span class="v">${esc(order.governorate || "—")}</span></div>
        <div class="kv"><span class="k">العنوان</span><span class="v">${esc(order.address || "—")}</span></div>`)}

        <div class="kv"><span class="k">المنتجات</span><span class="v num">${esc(money(order.subtotal))}</span></div>
        <div class="kv"><span class="k">الشحن</span><span class="v num">${esc(money(order.shipping_fee))}</span></div>

          <span class="v num" style="font-size:16px;font-weight:700">${esc(money(order.total))}</span></div>
        ${order.note ? `<div class="kv"><span class="k">ملاحظة</span><span class="v">${esc(order.note)}</span></div>` : ""}`)}
    </div>

    ${card("الأصناف", "", tableHTML(["الصنف", { label: "الكمية", num: true }, ""], lines, { minWidth: 420 }), "", { flush: true })}`;

  const foot = [];
  if (!order.cancelled) {
    foot.push(el("button", { class: "btn primary", type: "button", html: `${icon("truck", 15)} شحن الطلب`,
      onclick: () => fulfillForm(order) }));
    foot.push(el("button", { class: "btn danger", type: "button", html: `${icon("x", 15)} إلغاء الطلب`,
      onclick: async () => {
        const ok = await overlay.confirm("إلغاء الطلب؟",
          `طلب ${order.name} هيتلغي${order.local ? " وهيترجع للمخزون، والعميل هيوصله إشعار" : " على شوبيفاي"}.`,

        if (!ok) return;
        const result = await api(`/dashboard/api/shopify/orders/${encodeURIComponent(gid)}/cancel`,
          { method: "POST", quiet: true });
        if (result.__error) return toastError(result.__error, "الإلغاء مانفذش");
        toast("الطلب اتلغى");
        overlay.close();
        VIEWS.orders.load();

  foot.push(el("button", { class: "btn ghost", type: "button", text: "نسخ رقم الطلب",

  $$("[data-qty]", body).forEach((button) => button.addEventListener("click", () =>

function fulfillForm(order) {
  const form = el("div");
  form.innerHTML = `
    <p class="hint" style="margin-bottom:var(--s-4)">شحن ${esc(order.name)}. رقم التتبع اختياري، لكنه اللي بيوصل للعميل في رسالة الشحن.</p>
    <label class="lbl" for="trackNo">رقم التتبع</label>
    <input class="inp" id="trackNo" placeholder="مثلاً 1234567890">
    <div style="height:var(--s-3)"></div>
    <label class="lbl" for="trackCo">شركة الشحن</label>
    <input class="inp" id="trackCo" placeholder="مثلاً بوسطة">
    <div style="height:var(--s-3)"></div>
    <label class="row" style="gap:var(--s-2);cursor:pointer">
      <input type="checkbox" id="notifyCust" checked> <span style="font-size:13px">ابعت إشعار للعميل من شوبيفاي</span>
    </label>`;
  const confirm = el("button", { class: "btn primary", text: "أكّد الشحن", onclick: async () => {
    confirm.disabled = true;
    const result = await api(`/dashboard/api/shopify/orders/${encodeURIComponent(order.id)}/fulfill`, {
      method: "POST", quiet: true,
      body: {
        tracking_number: $("#trackNo").value.trim(),
        tracking_company: $("#trackCo").value.trim(),
        notify_customer: $("#notifyCust").checked,
      },
    });
    if (result.__error) { confirm.disabled = false; return toastError(result.__error, "الشحن مانفذش"); }
    overlay.close();
    toast("الطلب اتشحن", "العميل هيوصله التتبع");
    VIEWS.orders.load();
  } });
  overlay.modal("شحن الطلب", form, [confirm, el("button", { class: "btn", text: "إلغاء", onclick: () => overlay.close() })]);
}

function quantityForm(gid, sku, current) {
  const form = el("div");
  form.innerHTML = `
    <p class="hint" style="margin-bottom:var(--s-4)">تعديل كمية <span class="num">${esc(sku)}</span>. صفر معناه شيل الصنف من الطلب.</p>
    <label class="lbl" for="qtyVal">الكمية الجديدة</label>
    <input class="inp num" id="qtyVal" type="number" min="0" step="1" value="${current}">`;
  const save = el("button", { class: "btn primary", text: "احفظ", onclick: async () => {
    const quantity = parseInt($("#qtyVal").value, 10);
    if (!Number.isInteger(quantity) || quantity < 0) return toast("رقم غير صحيح", "", "warn");
    save.disabled = true;
    const result = await api(`/dashboard/api/shopify/orders/${encodeURIComponent(gid)}/quantity`, {
      method: "POST", quiet: true, body: { variant_id: sku, quantity },
    });
    if (result.__error) { save.disabled = false; return toastError(result.__error, "التعديل مانفذش"); }
    overlay.close();
    toast("الكمية اتعدلت");
    openOrder(gid);
  } });
  overlay.modal("تعديل الكمية", form, [save, el("button", { class: "btn", text: "إلغاء", onclick: () => overlay.close() })]);
}

      <td><input class="inp num" style="width:104px" type="number" min="0" step="1"
            data-vid="${esc(v.sku || "")}" data-f="stock_qty" value="${esc(v.inventory_quantity ?? 0)}"></td>
      <td>${(v.inventory_quantity || 0) > 0 ? chipHTML("متوفر", "teal", "dot") : chipHTML("خلص", "rose", "bar")}</td>
    </tr>`).join("");

  body.innerHTML = `
    ${product.image_url ? `<img src="${esc(product.image_url)}" alt="" style="width:100%;max-height:230px;object-fit:cover;border-radius:var(--r-md);margin-bottom:var(--s-4)">` : ""}
    ${!local ? `<div class="banner" style="margin-bottom:var(--s-4)">${icon("alert", 15)}
      <div><strong>المنتج ده مالوش نسخة محلية</strong><br>اتعمل من شوبيفاي مباشرة. أسعار ومخزون تقدر تعدلهم من شوبيفاي،
      لكن القسم والستايل والمجموعة محتاجين مزامنة الأول (scripts/shopify_sync.py).</div></div>` : ""}

    ${card("بيانات المنتج", "", `
      <label class="lbl" for="pTitle">الاسم</label>
      <input class="inp" id="pTitle" value="${esc(product.title)}">
      <div class="grid g-3" style="margin-top:var(--s-3)">
        <div><label class="lbl" for="pCat">التصنيف</label>
          <input class="inp" id="pCat" value="${esc(product.category || "")}"></div>
        <div><label class="lbl" for="pDept">القسم</label>
          <input class="inp" id="pDept" value="${esc(local ? local.department || "" : "")}" ${local ? "" : "disabled"}></div>
        <div><label class="lbl" for="pColl">المجموعة</label>
          <input class="inp" id="pColl" value="${esc(local ? local.collection || "" : "")}" ${local ? "" : "disabled"}></div>
        <div><label class="lbl" for="pStyle">الستايل (مفصول بفاصلة)</label>
          <input class="inp" id="pStyle" value="${esc(local && local.style ? local.style.join("، ") : "")}" ${local ? "" : "disabled"}></div>
        <div><label class="lbl" for="pChart">جدول المقاسات</label>
          <input class="inp" id="pChart" value="${esc(local ? local.size_chart || "" : "")}" ${local ? "" : "disabled"}></div>
      </div>`)}

    <div style="height:var(--s-4)"></div>
    ${card("المقاسات والأسعار", `${product.variants.length} مقاس`,
      tableHTML(["", "المقاس", "السعر", "المخزون", "الحالة"], variantRows, { minWidth: 560 }), "", { flush: true })}`;

  const save = el("button", {
    class: "btn primary", html: `${icon("check", 15)} احفظ التغييرات`,
    onclick: async () => {
      if (!product.local_product_id) return toast("مش ممكن الحفظ من هنا", "المنتج مالوش نسخة محلية", "warn");
      save.disabled = true;
      const updates = {};
      $$("[data-vid]", body).forEach((input) => {
        const sku = input.dataset.vid;
        if (!sku) return;
        (updates[sku] ||= { variant_id: sku })[input.dataset.f] = Number(input.value);
      });
      const payload = {
        title: $("#pTitle").value.trim(),
        category: $("#pCat").value.trim(),
        department: $("#pDept").value.trim() || undefined,
        collection: $("#pColl").value.trim() || undefined,
        size_chart: $("#pChart").value.trim() || undefined,
        style: $("#pStyle").value.trim()
          ? $("#pStyle").value.split(/[،,]/).map((s) => s.trim()).filter(Boolean) : undefined,
        variant_updates: Object.values(updates),
      };
      const result = await api(`/dashboard/api/shopify/products/${encodeURIComponent(product.local_product_id)}/update`,
        { method: "POST", quiet: true, body: payload });
      save.disabled = false;
      if (result.__error) return toastError(result.__error, "الحفظ مانفذش");
      toast("المنتج اتحدّث", "التغيير راح لشوبيفاي");
      overlay.close();
      VIEWS.products.load();
    },
  });
  $("#drawerFoot").innerHTML = "";
  $("#drawerFoot").append(save, el("button", { class: "btn", text: "إغلاق", onclick: () => overlay.close() }));
  $("#drawerFoot").hidden = false;
}

function productCreateForm() {
  const body = overlay.drawer("منتج جديد", `
    <div class="grid g-2">
      <div><label class="lbl" for="nTitle">اسم المنتج *</label><input class="inp" id="nTitle" placeholder="مثلاً: هودي ونس الشتوي"></div>
      <div><label class="lbl" for="nCat">التصنيف *</label><input class="inp" id="nCat" placeholder="هودي"></div>
      <div><label class="lbl" for="nDept">القسم *</label><input class="inp" id="nDept" placeholder="رجالي"></div>
      <div><label class="lbl" for="nColl">المجموعة</label><input class="inp" id="nColl" placeholder="شتوي ٢٠٢٦"></div>
      <div><label class="lbl" for="nChart">جدول المقاسات</label><input class="inp" id="nChart" placeholder="hoodie"></div>
      <div><label class="lbl" for="nImage">رابط صورة</label><input class="inp" id="nImage" dir="ltr" placeholder="https://…"></div>
    </div>
    <div style="height:var(--s-3)"></div>
    <label class="lbl" for="nDesc">الوصف</label>
    <textarea class="inp" id="nDesc" rows="3" placeholder="وصف قصير يظهر في شوبيفاي"></textarea>

    <div style="height:var(--s-5)"></div>
    <div class="row" style="margin-bottom:var(--s-2)">
      <h3 style="font-size:14px;flex:1">المقاسات</h3>
      <button class="btn sm" type="button" id="addVariant">${icon("plus", 14)} أضف مقاس</button>
    </div>
    <div class="hint" style="margin-bottom:var(--s-2)">كل سطر بيبقى SKU لوحده في شوبيفاي. المقاس مطلوب؛ اللون والطول اختياريين.</div>
    <div id="variantRows"></div>`);

  const addRow = (values = {}) => {
    const row = el("div", { class: "grid", style: "grid-template-columns:repeat(5,1fr) auto;gap:var(--s-2);margin-bottom:var(--s-2)" });
    row.innerHTML = `
      <input class="inp" data-v="size" placeholder="مقاس *" value="${esc(values.size || "")}">
      <input class="inp" data-v="color" placeholder="لون" value="${esc(values.color || "")}">
      <input class="inp" data-v="length" placeholder="طول" value="${esc(values.length || "")}">
      <input class="inp num" data-v="price" type="number" min="0" placeholder="سعر *" value="${esc(values.price || "")}">
      <input class="inp num" data-v="stock_qty" type="number" min="0" placeholder="مخزون" value="${esc(values.stock_qty ?? 0)}">
      <button class="btn icon ghost" type="button" aria-label="حذف السطر">${icon("x", 15)}</button>`;
    row.lastElementChild.addEventListener("click", () => row.remove());
    $("#variantRows", body).append(row);
  };
  $("#addVariant", body).addEventListener("click", () => addRow());
  addRow();

  const create = el("button", { class: "btn primary", html: `${icon("check", 15)} أنشئ المنتج`, onclick: async () => {
    const variants = $$("#variantRows > div", body).map((row) => {
      const values = {};
      $$("[data-v]", row).forEach((input) => { values[input.dataset.v] = input.value.trim(); });
      return values;
    }).filter((v) => v.size && v.price).map((v) => ({
      size: v.size, color: v.color || undefined, length: v.length || undefined,
      price: Number(v.price), stock_qty: Number(v.stock_qty || 0),
    }));

    const payload = {
      title: $("#nTitle").value.trim(), category: $("#nCat").value.trim(),
      department: $("#nDept").value.trim(), description: $("#nDesc").value.trim(),
      collection: $("#nColl").value.trim() || undefined, size_chart: $("#nChart").value.trim() || undefined,
      image_url: $("#nImage").value.trim() || undefined, variants,
    };
    if (!payload.title || !payload.category || !payload.department || !variants.length) {
      return toast("ناقص بيانات", "الاسم والتصنيف والقسم ومقاس واحد على الأقل مطلوبين", "warn");
    }
    create.disabled = true;
    const result = await api("/dashboard/api/shopify/products", { method: "POST", quiet: true, body: payload });
    create.disabled = false;
    if (result.__error) return toastError(result.__error, "الإنشاء مانفذش");
    toast("المنتج اتعمل", result.product_id || "");
    overlay.close();
    go("products", { force: true });
  } });
  $("#drawerFoot").innerHTML = "";
  $("#drawerFoot").append(create, el("button", { class: "btn", text: "إلغاء", onclick: () => overlay.close() }));
  $("#drawerFoot").hidden = false;
}

const inventoryView = VIEWS.inventory = {
  filter: "all", search: "", data: null, dirty: new Map(),

  async mount(force) {
    $("#pageActions").append(
      el("button", { class: "btn sm", type: "button", html: `${icon("download", 15)} تصدير`, onclick: () => this.export() }),
      el("button", { class: "btn sm", type: "button", html: `${icon("refresh", 15)} تحديث`, onclick: () => this.load() }),
    );
    if (force || !this.data) await this.load();
    else this.render();
  },

  async load() {
    const body = $("#inventoryBody");
    body.innerHTML = skeletonTiles(4) + skeletonTable(10);
    this.dirty.clear();
    const params = new URLSearchParams({ status: this.filter });
    if (this.search) params.set("q", this.search);
    const data = await api(`/dashboard/api/shopify/inventory?${params}`, { quiet: true });
    if (data.__error) { body.innerHTML = errorBanner(data.__error, "المخزون"); return; }
    this.data = data;
    setBadge("stock", data.totals.out_of_stock_count, "warn");
    this.render();
  },

  render() {
    const { rows, totals } = this.data;
    const filters = [
      { id: "all", label: "الكل" },
      { id: "low", label: `على وشك الخلاص (${totals.low_stock_count})` },
      { id: "out", label: `خلص (${totals.out_of_stock_count})` },
      { id: "in_stock", label: "متوفر" },
    ];
    const rowsHTML = rows.map((r) => `
      <tr>
        <td style="width:52px">${r.image_url ? `<img class="thumb" src="${esc(r.image_url)}" alt="" loading="lazy">` : ""}</td>
        <td><div class="cellmain">${esc(r.product_title)}</div>
            <div class="cellsub">${esc([r.color, r.size, r.length].filter(Boolean).join(" / ") || "—")}</div></td>
        <td class="num cellsub" data-copy="${esc(r.sku)}" data-copy-what="SKU" style="cursor:pointer">${esc(r.sku)}</td>
        <td class="num">${esc(money(r.price))}</td>
        <td>${r.quantity <= 0 ? chipHTML("خلص", "rose", "bar")
             : r.quantity <= totals.low_stock_at ? chipHTML(`فاضل ${r.quantity}`, "amber", "ring")
             : chipHTML(`${r.quantity} متاح`, "teal", "dot")}</td>
        <td><input class="inp num" style="width:92px" type="number" min="0" step="1"
              value="${r.quantity}" data-item="${esc(r.inventory_item_id || "")}" data-was="${r.quantity}"
              aria-label="مخزون ${esc(r.sku)}"></td>
      </tr>`).join("");

    $("#inventoryBody").innerHTML = `
      <div class="grid g-kpi">
        ${[["مقاسات خلصت", num(totals.out_of_stock_count), "rose", "alert"],
           ["على وشك الخلاص", num(totals.low_stock_count), "amber", "boxes"],
           ["إجمالي القطع", num(totals.total_units), "teal", "boxes"],
           ["قيمة المخزون بالبيع", money(totals.retail_value), "clay", "money"]]
          .map(([l, v, t, ic]) => `<div class="card kpi" style="--accent:${toneVar(t)}">
            <div class="kpi-label">${icon(ic, 14)}${esc(l)}</div><div class="kpi-value">${esc(v)}</div></div>`).join("")}
      </div>
      ${this.data.truncated ? `<div class="banner">${icon("alert", 15)}<div>المتجر أكبر من إننا نقراه كله في نداء واحد — الأرقام دي حد أدنى.</div></div>` : ""}
      <div class="row">
        <div class="inbox-filters" style="flex:1">
          ${filters.map((f) => `<button class="fchip" type="button" data-inv="${f.id}"
            aria-pressed="${f.id === this.filter}">${esc(f.label)}</button>`).join("")}
        </div>
        <div class="field" style="min-width:210px">${icon("search", 15)}
          <input id="invSearch" type="search" placeholder="اسم، SKU، لون…" value="${esc(this.search)}"></div>
      </div>
      ${card("المخزون", `${num(this.data.match_count)} مقاس — الأقل أولاً`,
        rows.length ? tableHTML(["", "المنتج", "SKU", "السعر", "الحالة", "تعديل"], rowsHTML, { minWidth: 780 }) : "",
        `<span id="invSaveSlot"></span>`, { flush: true })}`;

    if (!rows.length) {
      $("#inventoryBody .card:last-child .card-body").append(
        emptyState("مفيش نتائج", "غيّر الفلتر أو امسح البحث", "boxes"));
    }

    $$("[data-inv]").forEach((b) => b.addEventListener("click", () => { this.filter = b.dataset.inv; this.load(); }));
    const search = $("#invSearch");
    search.addEventListener("keydown", (event) => {
      if (event.key === "Enter") { this.search = search.value.trim(); this.load(); }
    });

    // Edits are batched: someone recounting a shelf changes eight rows and
    // presses save once, instead of firing eight writes at Shopify.
    $$("[data-item]").forEach((input) => input.addEventListener("input", () => {
      const value = parseInt(input.value, 10);
      const was = Number(input.dataset.was);
      if (Number.isInteger(value) && value >= 0 && value !== was) this.dirty.set(input.dataset.item, value);
      else this.dirty.delete(input.dataset.item);
      this.renderSaveButton();
    }));
    this.renderSaveButton();
  },

  renderSaveButton() {
    const slot = $("#invSaveSlot");
    if (!slot) return;
    slot.innerHTML = "";
    if (!this.dirty.size) return;
    const save = el("button", {
      class: "btn sm primary", html: `${icon("check", 14)} احفظ ${this.dirty.size} تعديل`,
      onclick: async () => {
        save.disabled = true;
        const updates = Array.from(this.dirty, ([inventory_item_id, quantity]) => ({ inventory_item_id, quantity }));
        const result = await api("/dashboard/api/shopify/inventory/set", { method: "POST", quiet: true, body: { updates } });
        if (result.__error) { save.disabled = false; return toastError(result.__error, "الحفظ مانفذش"); }
        toast("المخزون اتحدّث", `${updates.length} مقاس`);
        this.load();
      },
    });
    slot.append(save);
  },

  export() {
    if (!this.data) return;
    exportCSV("inventory.csv", ["المنتج", "SKU", "اللون", "المقاس", "السعر", "المخزون"],
      this.data.rows.map((r) => [r.product_title, r.sku, r.color, r.size, r.price, r.quantity]));
  },
};

VIEWS.collections = {
  rows: null,

  async mount(force) {
    $("#pageActions").append(
      el("button", { class: "btn sm primary", type: "button", html: `${icon("plus", 15)} مجموعة جديدة`, onclick: collectionCreateForm }),
      el("button", { class: "btn sm", type: "button", html: `${icon("refresh", 15)} تحديث`, onclick: () => this.load() }),
    );
    if (force || !this.rows) await this.load();
    else this.render();
  },

  async load() {
    $("#collectionsBody").innerHTML = skeletonTiles(3);
    const data = await api("/dashboard/api/shopify/collections", { quiet: true });
    if (data.__error) { $("#collectionsBody").innerHTML = errorBanner(data.__error, "المجموعات"); return; }
    this.rows = data.collections;
    this.render();
  },

  render() {
    const body = $("#collectionsBody");
    if (!this.rows.length) {
      body.innerHTML = "";
      body.append(emptyState("مفيش مجموعات", "المجموعات بتخلي عرض المنتجات أسهل على العميل", "layers",
        el("button", { class: "btn primary", html: `${icon("plus", 15)} مجموعة جديدة`, onclick: collectionCreateForm })));
      return;
    }
    body.innerHTML = `<div class="grid g-3">${this.rows.map((c) => `
      <button class="card" type="button" data-gid="${esc(c.id)}" style="text-align:start;border:1px solid var(--line);cursor:pointer">
        <div style="height:96px;background:${c.image_url ? `center/cover url('${esc(c.image_url)}')` : "linear-gradient(135deg,var(--clay-tint),var(--lilac-tint))"}"></div>
        <div class="card-body" style="padding:var(--s-4)">
          <div class="row" style="gap:6px;margin-bottom:6px">
            ${chipHTML(c.smart ? "ذكية" : "يدوية", c.smart ? "lilac" : "sky", "dot")}
            <span class="spacer"></span>
            <span class="cellsub num">${num(c.product_count)} منتج</span>
          </div>
          <div class="cellmain" style="font-size:14px">${esc(c.title)}</div>
          <div class="cellsub num" dir="ltr">${esc(c.handle)}</div>

async function openCollection(gid) {
  const body = overlay.drawer("جاري التحميل…", '<div class="skel" style="height:240px"></div>');
  const collection = await api(`/dashboard/api/shopify/collections/${encodeURIComponent(gid)}`, { quiet: true });
  if (collection.__error) { body.innerHTML = errorBanner(collection.__error, "المجموعة"); return; }
  $("#drawerTitle").textContent = collection.title;

  const products = collection.products.map((p) => `
    <tr>
      <td style="width:52px">${p.image_url ? `<img class="thumb" src="${esc(p.image_url)}" alt="" loading="lazy">` : ""}</td>
      <td><div class="cellmain">${esc(p.title)}</div>
          <div class="cellsub">${esc(p.status === "ACTIVE" ? "منشور" : p.status)} · ${num(p.inventory)} قطعة</div></td>
      <td>${collection.smart ? "" : `<button class="btn sm ghost" type="button" data-rm="${esc(p.id)}">شيل</button>`}</td>
    </tr>`).join("");

  body.innerHTML = `
    ${collection.smart ? `<div class="banner" data-tone="info" style="margin-bottom:var(--s-4)">${icon("alert", 15)}
      <div><strong>مجموعة ذكية</strong><br>أعضاؤها بيتحددوا بقواعد شوبيفاي، فمش بنضيف أو نشيل منها من هنا —
      أي تعديل يدوي شوبيفاي هيلغيه أول ما يعيد تطبيق القواعد.</div></div>` : ""}

    ${card("بيانات المجموعة", "", `
      <label class="lbl" for="cTitle">الاسم</label>
      <input class="inp" id="cTitle" value="${esc(collection.title)}">
      <div style="height:var(--s-3)"></div>
      <label class="lbl" for="cDesc">الوصف</label>
      <textarea class="inp" id="cDesc" rows="3">${esc((collection.description_html || "").replace(/<[^>]+>/g, ""))}</textarea>`)}

    <div style="height:var(--s-4)"></div>
    ${card("المنتجات", `${collection.products.length} منتج`,
      products ? tableHTML(["", "المنتج", ""], products, { minWidth: 420 })
               : `<div class="empty"><div class="d">المجموعة فاضية</div></div>`, "", { flush: true })}`;

  $$("[data-rm]", body).forEach((button) => button.addEventListener("click", async () => {
    button.disabled = true;
    const result = await api(`/dashboard/api/shopify/collections/${encodeURIComponent(gid)}/products/remove`,
      { method: "POST", quiet: true, body: { product_ids: [button.dataset.rm] } });
    if (result.__error) { button.disabled = false; return toastError(result.__error, "الحذف مانفذش"); }
    toast("المنتج اتشال", "شوبيفاي بيطبّق التغيير خلال ثواني");
    setTimeout(() => openCollection(gid), 900);
  }));

  const foot = [el("button", { class: "btn primary", html: `${icon("check", 15)} احفظ`, onclick: async () => {
    const result = await api(`/dashboard/api/shopify/collections/${encodeURIComponent(gid)}/update`, {
      method: "POST", quiet: true,
      body: { title: $("#cTitle").value.trim(), description_html: $("#cDesc").value.trim() },
    });
    if (result.__error) return toastError(result.__error, "الحفظ مانفذش");
    toast("المجموعة اتحدّثت");
    overlay.close();
    VIEWS.collections.load();
  } })];
  if (!collection.smart) {
    foot.push(el("button", { class: "btn", html: `${icon("plus", 15)} ضيف منتجات`, onclick: () => addToCollectionForm(gid) }));
  }
  foot.push(el("button", { class: "btn ghost", text: "إغلاق", onclick: () => overlay.close() }));
  $("#drawerFoot").innerHTML = "";
  $("#drawerFoot").append(...foot);
  $("#drawerFoot").hidden = false;
}

async function addToCollectionForm(gid) {
  const body = overlay.modal("ضيف منتجات للمجموعة", '<div class="skel" style="height:200px"></div>');
  const data = await api("/dashboard/api/shopify/products", { quiet: true });
  if (data.__error) { body.innerHTML = errorBanner(data.__error, "المنتجات"); return; }
  body.innerHTML = `<div class="field" style="margin-bottom:var(--s-3)">${icon("search", 15)}
      <input id="acSearch" type="search" placeholder="فلترة سريعة"></div>
    <div id="acList" style="max-height:44dvh;overflow:auto">${data.products.map((p) => `
      <label class="mini" style="cursor:pointer">
        <input type="checkbox" value="${esc(p.id)}">
        ${p.image_url ? `<img class="thumb" src="${esc(p.image_url)}" alt="" loading="lazy">` : ""}
        <span class="m1"><span class="a">${esc(p.title)}</span>
        <span class="b">${esc(p.category || "")} · ${num(p.variant_count)} مقاس</span></span>
      </label>`).join("")}</div>`;
  $("#acSearch", body).addEventListener("input", (event) => {
    const needle = event.target.value.trim().toLowerCase();
    $$("#acList label", body).forEach((row) => {
      row.style.display = row.textContent.toLowerCase().includes(needle) ? "" : "none";
    });
  });
  const add = el("button", { class: "btn primary", text: "ضيف المختار", onclick: async () => {
    const ids = $$('#acList input:checked', body).map((i) => i.value);
    if (!ids.length) return toast("اختار منتج على الأقل", "", "warn");
    add.disabled = true;
    const result = await api(`/dashboard/api/shopify/collections/${encodeURIComponent(gid)}/products/add`,
      { method: "POST", quiet: true, body: { product_ids: ids } });
    if (result.__error) { add.disabled = false; return toastError(result.__error, "الإضافة مانفذتش"); }
    overlay.close();
    toast("المنتجات اتضافت", `${ids.length} منتج`);
    setTimeout(() => openCollection(gid), 600);
  } });
  $("#modalFoot").innerHTML = "";
  $("#modalFoot").append(add, el("button", { class: "btn", text: "إلغاء", onclick: () => overlay.close() }));

function collectionCreateForm() {
  const create = el("button", { class: "btn primary", text: "أنشئ", onclick: async () => {
    const title = $("#ncTitle").value.trim();
    if (!title) return toast("الاسم مطلوب", "", "warn");
    create.disabled = true;
    const result = await api("/dashboard/api/shopify/collections", {
      method: "POST", quiet: true,
      body: { title, description_html: $("#ncDesc").value.trim() },
    });
    create.disabled = false;
    if (result.__error) return toastError(result.__error, "الإنشاء مانفذش");
    overlay.close();
    toast("المجموعة اتعملت", title);
    go("collections", { force: true });
  } });
  overlay.modal("مجموعة جديدة", `
    <label class="lbl" for="ncTitle">الاسم *</label>
    <input class="inp" id="ncTitle" placeholder="مثلاً: صيف ٢٠٢٦">
    <div style="height:var(--s-3)"></div>
    <label class="lbl" for="ncDesc">الوصف</label>
    <textarea class="inp" id="ncDesc" rows="3"></textarea>
    <p class="hint">المجموعة بتتعمل يدوية — تقدر تضيف منتجاتها بعد الإنشاء.</p>`,
    [create, el("button", { class: "btn", text: "إلغاء", onclick: () => overlay.close() })]);
}

async function openShopifyCustomer(gid) {
  const body = overlay.drawer("جاري التحميل…", '<div class="skel" style="height:220px"></div>');
  const customer = await api(`/dashboard/api/shopify/customers/${encodeURIComponent(gid)}`, { quiet: true });
  if (customer.__error) { body.innerHTML = errorBanner(customer.__error, "العميل"); return; }
  $("#drawerTitle").textContent = customer.name || "عميل";
  const orders = (customer.orders || []).map((o) => `
    <tr><td class="num">${esc(o.name)}</td><td>${esc(shortDate(o.created_at))}</td>
    <td>${statusChip(o.fulfillment_status)}</td><td class="num">${esc(money(o.total))}</td></tr>`).join("");
  body.innerHTML = `
    <div class="grid g-kpi" style="margin-bottom:var(--s-4)">
      <div class="card kpi" style="--accent:var(--teal)"><div class="kpi-label">عدد الطلبات</div>
        <div class="kpi-value">${num(customer.order_count)}</div></div>
      <div class="card kpi" style="--accent:var(--clay)"><div class="kpi-label">إجمالي الإنفاق</div>
        <div class="kpi-value">${esc(money(customer.amount_spent))}</div></div>
    </div>
    ${card("بيانات التواصل", "", `
      <div class="kv"><span class="k">التليفون</span><span class="v num">${esc(customer.phone || "—")}</span></div>
      <div class="kv"><span class="k">الإيميل</span><span class="v" dir="ltr">${esc(customer.email || "—")}</span></div>
      <div class="kv"><span class="k">المحافظة</span><span class="v">${esc(customer.governorate || "—")}</span></div>`)}
    <div style="height:var(--s-4)"></div>
    ${card("الطلبات", "", orders ? tableHTML(["الطلب", "التاريخ", "الحالة", { label: "الإجمالي", num: true }], orders)
      : `<div class="empty"><div class="d">مفيش طلبات</div></div>`, "", { flush: true })}`;

async function openLocalCustomer(clientId) {
  const body = overlay.drawer("جاري التحميل…", '<div class="skel" style="height:220px"></div>');
  const customer = await api(`/dashboard/api/customers/${clientId}`, { quiet: true });

  $("#drawerTitle").textContent = customer.full_name;
  const orders = (customer.orders || []).map((o) => `
    <tr><td class="num">${esc(o.reference)}</td><td>${esc(shortDate(o.placed_at))}</td>
    <td>${esc(o.status)}</td><td>${chipHTML(o.source_channel || "—", "sky")}</td>
    <td class="num">${esc(money(o.total))}</td></tr>`).join("");

    ${card("بيانات العميل", "", `
      <div class="kv"><span class="k">التليفون</span><span class="v num" data-copy="${esc(customer.phone)}" data-copy-what="التليفون" style="cursor:pointer">${esc(customer.phone)}</span></div>
      <div class="kv"><span class="k">المحافظة</span><span class="v">${esc(customer.governorate || "—")}</span></div>
      <div class="kv"><span class="k">العنوان</span><span class="v">${esc(customer.address || "—")}</span></div>

    ${card("الطلبات", `${(customer.orders || []).length}`,

  days: 30, stats: null, insights: null, tab: "sales",

    $("#pageActions").append(
      el("button", { class: "btn sm", type: "button", html: `${icon("download", 15)} تصدير`, onclick: () => this.export() }),

  },

  async load() {
    $("#analyticsBody").innerHTML = skeletonTiles(4) + `<div class="skel" style="height:230px;border-radius:var(--r-lg)"></div>`;
    const [stats, insights] = await Promise.all([
      api(`/dashboard/api/stats?days=${this.days}`, { quiet: true }),
      api(`/dashboard/api/insights?days=${this.days}`, { quiet: true }),
    ]);
    this.stats = stats;
    this.insights = insights;
    this.render();
  },

  head() {
    return `<div class="pagehead">
      <div class="t"><h2>التحليلات</h2>
        <div class="d">المبيعات من شوبيفاي (المتجر كله)، والمحادثات من قاعدة البيانات المحلية</div></div>
      <div class="row">
        <div class="seg" id="anTabs">
          <button type="button" data-antab="sales" aria-pressed="${this.tab === "sales"}">المبيعات</button>
          <button type="button" data-antab="talk" aria-pressed="${this.tab === "talk"}">المحادثات</button>
        </div>
        <div class="seg" id="anRange">
          ${[7, 30, 90].map((d) => `<button type="button" data-days="${d}" aria-pressed="${d === this.days}">${d} يوم</button>`).join("")}
        </div>
      </div>
    </div>`;
  },

  render() {
    const body = $("#analyticsBody");
    body.innerHTML = this.head() + (this.tab === "sales" ? this.salesHTML() : this.talkHTML());

    $$("[data-days]").forEach((b) => b.addEventListener("click", () => { this.days = Number(b.dataset.days); this.load(); }));
    $$("[data-antab]").forEach((b) => b.addEventListener("click", () => { this.tab = b.dataset.antab; this.render(); }));

    if (this.tab === "sales") this.drawSales();
    else this.drawTalk();
  },

  salesHTML() {
    const stats = this.stats;
    if (stats.__error) return errorBanner(stats.__error, "أرقام المبيعات");
    const days = stats.revenue_by_day;
    const half = Math.floor(days.length / 2);
    const sum = (arr) => arr.reduce((a, d) => a + Number(d.revenue), 0);
    const first = sum(days.slice(0, half)), second = sum(days.slice(half));
    const trend = first ? (second - first) / first : 0;
    const dir = Math.abs(trend) < 0.02 ? "flat" : trend > 0 ? "up" : "down";
    const arrow = dir === "up" ? "▲" : dir === "down" ? "▼" : "■";

    return `
      ${stats.truncated ? `<div class="banner">${icon("alert", 15)}<div>الفترة دي فيها طلبات أكتر من اللي بنقراه في نداء واحد — الأرقام حد أدنى.</div></div>` : ""}
      ${stats.excluded_test_orders ? `<div class="banner" data-tone="info">${icon("alert", 15)}
        <div>${num(stats.excluded_test_orders)} طلب اختبار من أرقام الفريق مستبعد من كل رقم في الصفحة دي.</div></div>` : ""}

          <div class="spark" id="anSpark"></div>
        </div>
        <div class="card kpi" style="--accent:var(--teal)">
          <div class="kpi-label">${icon("bag", 14)}الطلبات</div>
          <div class="kpi-value">${num(stats.order_count)}</div>
          <div class="kpi-foot"><span>${num(stats.cancelled_count)} ملغي</span></div>
        </div>
        <div class="card kpi" style="--accent:var(--lilac)">
          <div class="kpi-label">${icon("chart", 14)}متوسط الطلب</div>
          <div class="kpi-value">${esc(money(stats.average_order_value))}</div>
        </div>
        <div class="card kpi" style="--accent:var(--sky)">
          <div class="kpi-label">${icon("users", 14)}عملاء مختلفين</div>
          <div class="kpi-value">${num(stats.customer_count)}</div>
        </div>
      </div>

      ${card("الإيرادات يوم بيوم", `${this.days} يوم`, `<div id="anRevenue"></div>`)}

      <div class="grid g-2">
        ${card("عدد الطلبات يوميًا", "", `<div id="anOrders"></div>`)}
        ${card("الأكثر مبيعًا", "بالقطعة", this.stats.best_sellers.length
          ? barList(this.stats.best_sellers.map((b) => ({ label: b.title, value: b.quantity })), { tone: "clay" })
          : `<div class="empty"><div class="d">مفيش مبيعات في الفترة دي</div></div>`)}
      </div>

      <div class="grid g-2">
        ${card("حالة الطلبات", "", `<div class="donutwrap"><div id="anStatus"></div><div id="anStatusLegend" style="flex:1"></div></div>`)}
        ${card("البوت مقابل الموقع", "من إجمالي الطلبات", `<div class="donutwrap"><div id="anSource"></div><div id="anSourceLegend" style="flex:1"></div></div>`)}
      </div>`;
  },

  drawSales() {
    const stats = this.stats;
    if (stats.__error) return;
    const days = stats.revenue_by_day;
    const points = days.map((d) => ({ label: shortDate(d.date), short: d.date.slice(8), value: Number(d.revenue) }));
    const orderPoints = days.map((d) => ({ label: shortDate(d.date), short: d.date.slice(8), value: d.orders }));

    const spark = $("#anSpark");
    if (spark) spark.append(sparkline(days.map((d) => Number(d.revenue)), "clay"));

    const revenue = $("#anRevenue");
    if (revenue) {
      revenue.innerHTML = "";
      revenue.append(points.length ? lineChart(points, { tone: "clay", fmt: money, height: 230, label: "الإيرادات يوميًا" })
        : emptyState("مفيش بيانات", "مفيش طلبات في الفترة دي", "chart"));
    }
    const orders = $("#anOrders");

      orders.innerHTML = "";

    const sources = Object.entries(stats.source_breakdown).map(([k, v]) => ({

      </div>

      <div class="grid g-2">
        ${card("القنوات", "", `<div class="donutwrap"><div id="inChannels"></div><div id="inChannelsLegend" style="flex:1"></div></div>`)}
        ${card("الأدوات اللي البوت بيستخدمها", "أكتر ١٢ أداة", data.top_tools.length
          ? barList(data.top_tools.map((x) => ({ label: x.name, value: x.count })), { tone: "lilac", limit: 12 })
          : `<div class="empty"><div class="d">مفيش استخدام مسجّل</div></div>`)}
      </div>

      <div class="grid g-2">
        ${card("أسباب التحويل والتنبيه", "", Object.keys(data.queue_by_reason).length
          ? barList(Object.entries(data.queue_by_reason).map(([k, v]) => ({ label: reasonLabel(k), value: v })), { tone: "amber" })
          : `<div class="empty"><div class="d">مفيش تحويلات في الفترة دي</div></div>`)}
        ${card("حجم الرسايل", "إجمالي الفترة", `
          <div class="grid g-3">
            <div class="stat-inline"><span class="v">${num(t.customer_messages)}</span><span class="l">من العملاء</span></div>
            <div class="stat-inline"><span class="v">${num(t.bot_messages)}</span><span class="l">من البوت</span></div>
            <div class="stat-inline"><span class="v">${num(t.staff_messages)}</span><span class="l">من الفريق</span></div>
            <div class="stat-inline"><span class="v">${num(t.media_messages)}</span><span class="l">صور وصوتيات</span></div>
            <div class="stat-inline"><span class="v">${num(t.refusals)}</span><span class="l">أخطاء أدوات</span></div>
            <div class="stat-inline"><span class="v">${num(t.instagram_comments)}</span><span class="l">تعليقات انستجرام</span></div>
          </div>`)}
      </div>

      ${card("أكتر محادثات نشاطًا", "", data.busiest_conversations.length ? tableHTML(
        ["المحادثة", "القناة", { label: "الرسايل", num: true }, { label: "من العميل", num: true }, "آخر نشاط"],
        data.busiest_conversations.map((c) => `
          <tr data-clickable data-ch="${esc(c.channel)}" data-ext="${esc(c.external_id)}">
            <td class="num cellmain" dir="ltr">${esc(c.external_id)}</td>
            <td>${chipHTML(channelInfo(c.channel).label, channelInfo(c.channel).tone, "bar")}</td>
            <td class="num">${num(c.messages)}</td>
            <td class="num">${num(c.customer_messages)}</td>
            <td class="cellsub">${esc(ago(c.updated_at))}</td>
          </tr>`).join(""), { minWidth: 600 }) : `<div class="empty"><div class="d">مفيش محادثات</div></div>`,
        "", { flush: true })}`;
  },

  drawTalk() {
    const data = this.insights;
    if (data.__error) return;
    const toPoints = (series) => series.map((d) => ({ label: shortDate(d.date), short: d.date.slice(8), value: d.count }));

    const active = $("#inActive");
    if (active) { active.innerHTML = ""; active.append(lineChart(toPoints(data.active_conversations_by_day), { tone: "lilac", height: 210, label: "نشاط المحادثات" })); }
    const handoff = $("#inHandoff");
    if (handoff) { handoff.innerHTML = ""; handoff.append(barChart(toPoints(data.handoffs_by_day), { tone: "rose", label: "تحويلات للفريق" })); }
    const fresh = $("#inNew");
    if (fresh) { fresh.innerHTML = ""; fresh.append(barChart(toPoints(data.new_contacts_by_day), { tone: "teal", label: "عملاء جدد" })); }

    const channels = Object.entries(data.by_channel).map(([k, v]) => ({
      label: channelInfo(k).label, value: v, tone: channelInfo(k).tone,
    }));
    const slot = $("#inChannels");
    if (slot) {
      slot.append(donut(channels, { center: num(data.totals.conversations) }));
      $("#inChannelsLegend").innerHTML = barList(channels, { tone: "teal" });
    }
    $$("#analyticsBody tr[data-ch]").forEach((tr) => tr.addEventListener("click", () => {
      go("inbox");
      setTimeout(() => openConversation(tr.dataset.ch, tr.dataset.ext), 120);
    }));
  },

  export() {
    if (this.tab === "sales" && this.stats && !this.stats.__error) {
      exportCSV("sales.csv", ["اليوم", "الإيراد", "الطلبات"],
        this.stats.revenue_by_day.map((d) => [d.date, d.revenue, d.orders]));
    } else if (this.insights && !this.insights.__error) {
      exportCSV("conversations.csv", ["اليوم", "محادثات نشطة", "تحويلات", "عملاء جدد"],
        this.insights.active_conversations_by_day.map((d, i) => [
          d.date, d.count,
          this.insights.handoffs_by_day[i] ? this.insights.handoffs_by_day[i].count : 0,
          this.insights.new_contacts_by_day[i] ? this.insights.new_contacts_by_day[i].count : 0,
        ]));
    }
  },
};

/* ==========================================================================
   view: المراجعة / queue
   ========================================================================== */

VIEWS.queue = {
  items: null,
  async mount(force) {
    $("#pageActions").append(
      el("button", { class: "btn sm", type: "button", html: `${icon("refresh", 15)} تحديث`, onclick: () => this.load() }),
    );
    if (force || !this.items) await this.load();
    else this.render();
  },

  async load() {
    $("#queueBody").innerHTML = skeletonTable(5);
    const data = await api("/dashboard/api/queue", { quiet: true });
    if (data.__error) { $("#queueBody").innerHTML = errorBanner(data.__error, "قائمة المراجعة"); return; }
    this.items = data.items;
    setBadge("queue", data.items.length, "warn");
    this.render();
  },

  render() {
    const body = $("#queueBody");
    if (!this.items.length) {
      body.innerHTML = "";
      body.append(emptyState("القايمة فاضية", "مفيش طلب تبديل ولا تنبيه مستني مراجعة", "check"));
      return;
    }
    body.innerHTML = this.items.map((item) => {
      const swap = item.kind === "item_swap";
      const payload = item.payload || {};
      return `<section class="card" data-qid="${esc(item.queue_id)}">
        <div class="card-head">
          ${chipHTML(swap ? "طلب تبديل" : "تنبيه", swap ? "clay" : "amber", swap ? "ring" : "dot")}
          <h2>${esc(reasonLabel(item.reason))}</h2>
          <span class="sub">${esc(dateTime(item.created_at))}</span>
        </div>
        <div class="card-body">
          <p style="font-size:13.5px;color:var(--ink-2)">${esc(item.summary || "—")}</p>
          ${item.order_id ? `<div class="kv" style="margin-top:var(--s-2)"><span class="k">الطلب</span>
            <span class="v num">${esc(item.order_id)}</span></div>` : ""}
          ${swap ? `<div class="grid g-2" style="margin-top:var(--s-3)">
            <div><label class="lbl">من مقاس</label><input class="inp num" disabled value="${esc(payload.from_variant_id || "—")}"></div>
            <div><label class="lbl">إلى مقاس</label>
              <input class="inp num" data-to="${esc(item.queue_id)}" value="${esc(payload.to_variant_id || "")}" placeholder="SKU البديل"></div>
          </div>` : ""}
          <div class="row" style="margin-top:var(--s-4)">
            ${swap ? `<button class="btn primary" type="button" data-approve="${esc(item.queue_id)}">${icon("check", 15)} وافق على التبديل</button>` : ""}
            <button class="btn" type="button" data-resolve="${esc(item.queue_id)}">${swap ? "ارفض واقفل" : "تمام، اتفهم"}</button>
          </div>
        </div>
      </section>`;
    }).join("");

    $$("[data-resolve]").forEach((b) => b.addEventListener("click", async () => {
      b.disabled = true;
      const result = await api(`/dashboard/api/queue/${encodeURIComponent(b.dataset.resolve)}/resolve`, { method: "POST", quiet: true });
      if (result.__error) { b.disabled = false; return toastError(result.__error, "مانفعش نقفله"); }
      toast("البند اتقفل");
      this.load();
    }));
    $$("[data-approve]").forEach((b) => b.addEventListener("click", async () => {
      const to = $(`[data-to="${b.dataset.approve}"]`);
      b.disabled = true;
      const result = await api(`/dashboard/api/queue/${encodeURIComponent(b.dataset.approve)}/approve-swap`, {
        method: "POST", quiet: true, body: to && to.value.trim() ? { to_variant_id: to.value.trim() } : {},
      });
      if (result.__error) { b.disabled = false; return toastError(result.__error, "التبديل مانفذش"); }
      toast("التبديل اتعمل", "المخزون والطلب اتحدثوا");
      this.load();
    }));
  },
};

/* ==========================================================================
   view: الإعدادات / settings
   ========================================================================== */

VIEWS.settings = {
  async mount(force) {
    $("#pageActions").append(
      el("button", { class: "btn sm", type: "button", html: `${icon("refresh", 15)} تحديث`, onclick: () => this.mount(true) }),
    );
    const body = $("#settingsBody");
    body.innerHTML = skeletonTable(4);
    const [flags, numbers, status] = await Promise.all([
      api("/dashboard/api/settings/flags", { quiet: true }),
      api("/dashboard/api/settings/test-numbers", { quiet: true }),
      api("/dashboard/api/settings/status", { quiet: true }),
    ]);

    body.innerHTML = `
      ${card("مزايا البوت", "التغيير بيسري فورًا على كل المحادثات", flags.__error
        ? errorBanner(flags.__error, "المزايا")
        : flags.flags.map((f) => `
          <div class="flagrow">
            <div class="i">
              <div class="l">${esc(f.label_ar)}</div>
              <div class="d">${esc(f.description_ar)}</div>
              ${f.overridden ? `<div class="m">اتغيرت بواسطة ${esc(f.updated_by || "الفريق")} · ${esc(dateTime(f.updated_at))}</div>` : ""}
            </div>
            <label class="switch">
              <input type="checkbox" data-flag="${esc(f.key)}" ${f.value ? "checked" : ""}
                aria-label="${esc(f.label_ar)}">
              <span class="track"></span><span class="knob"></span>
            </label>
          </div>`).join(""), "", { flush: true })}

      ${card("أرقام الاختبار", "الأرقام دي مستبعدة من كل أرقام صفحة التحليلات", `
        <div class="row" style="margin-bottom:var(--s-3)">
          <input class="inp num" id="tnPhone" placeholder="رقم التليفون" style="max-width:200px" dir="ltr">
          <input class="inp" id="tnNote" placeholder="ملاحظة (اختياري)" style="max-width:260px">
          <button class="btn primary" type="button" id="tnAdd">${icon("plus", 15)} ضيف</button>
        </div>
        <div id="tnList">${numbers.__error ? errorBanner(numbers.__error, "الأرقام")
          : numbers.numbers.length ? numbers.numbers.map((n) => `
            <div class="mini">
              <span class="m1"><span class="a num" dir="ltr">${esc(n.phone)}</span>
                <span class="b">${esc(n.note || "")} ${n.added_by ? `· ${esc(n.added_by)}` : ""}</span></span>
              <button class="btn sm ghost" type="button" data-rmnum="${esc(n.phone)}" aria-label="حذف">${icon("x", 15)}</button>
            </div>`).join("")
          : `<div class="empty" style="padding:var(--s-4)"><div class="d">مفيش أرقام اختبار</div></div>`}</div>`)}

      ${card("حالة النظام", "قراءة فقط", status.__error ? errorBanner(status.__error, "الحالة") : `
        <div class="grid g-2">
          ${[["مزود الموديل", status.llm_provider, true],
             ["مفتاح الموديل", status.llm_key_set ? "متسجّل" : "ناقص", status.llm_key_set],
             ["واتساب", status.whatsapp_configured ? "مظبوط" : "ناقص", status.whatsapp_configured],
             ["شوبيفاي", status.shopify_configured ? "مظبوط" : "ناقص", status.shopify_configured],
             ["ويبهوك شوبيفاي", status.shopify_webhooks_configured ? "مظبوط" : "ناقص — يعني مفيش رسايل تتبع", status.shopify_webhooks_configured],
             ["دخول اللوحة", status.dashboard_configured ? "مظبوط" : "ناقص", status.dashboard_configured]]
            .map(([label, value, ok]) => `<div class="kv">
              <span class="k">${esc(label)}</span>
              <span class="v">${chipHTML(String(value), ok ? "teal" : "rose", ok ? "dot" : "bar")}</span></div>`).join("")}
        </div>`)}

      ${card("المظهر", "بيتحفظ في المتصفح ده بس", `
        <div class="row">
          <div class="seg">
            <button type="button" data-theme-set="light" aria-pressed="${document.documentElement.dataset.theme === "light"}">نهاري</button>
            <button type="button" data-theme-set="dark" aria-pressed="${document.documentElement.dataset.theme === "dark"}">ليلي</button>
          </div>
          <span class="hint">اختصار: زرار القمر في الشريط الجانبي.</span>
        </div>`)}

      ${card("اختصارات لوحة المفاتيح", "", `
        <div class="grid g-2">
          ${[["Ctrl K أو /", "لوحة الأوامر والبحث"], ["I", "الوارد"], ["O", "الطلبات"], ["P", "المنتجات"],
             ["S", "المخزون"], ["A", "التحليلات"], ["H", "اليوم"], ["R", "تحديث الصفحة"],
             ["Ctrl Enter", "إرسال الرد"], ["Esc", "إغلاق أي نافذة"]]
            .map(([k, d]) => `<div class="kv"><span class="k"><kbd style="font-family:var(--font-num);background:var(--surface-3);border-radius:var(--r-xs);padding:2px 7px">${esc(k)}</kbd></span>
              <span class="v">${esc(d)}</span></div>`).join("")}
        </div>`)}`;

    $$("[data-flag]").forEach((input) => input.addEventListener("change", async () => {
      const result = await api(`/dashboard/api/settings/flags/${encodeURIComponent(input.dataset.flag)}`,
        { method: "POST", quiet: true, body: { value: input.checked } });
      if (result.__error) { input.checked = !input.checked; return toastError(result.__error, "مانفعش نغيّر الميزة"); }
      toast(input.checked ? "الميزة اتفتحت" : "الميزة اتقفلت");
    }));

    const add = $("#tnAdd");
    if (add) add.addEventListener("click", async () => {
      const phone = $("#tnPhone").value.trim();
      if (!phone) return toast("اكتب الرقم", "", "warn");
      const result = await api("/dashboard/api/settings/test-numbers",
        { method: "POST", quiet: true, body: { phone, note: $("#tnNote").value.trim() } });
      if (result.__error) return toastError(result.__error, "الإضافة مانفذتش");
      toast("الرقم اتضاف");
      this.mount(true);
    });

    $$("[data-rmnum]").forEach((b) => b.addEventListener("click", async () => {
      const result = await api(`/dashboard/api/settings/test-numbers/${encodeURIComponent(b.dataset.rmnum)}`,
        { method: "DELETE", quiet: true });
      if (result.__error) return toastError(result.__error, "الحذف مانفذش");
      toast("الرقم اتشال");
      this.mount(true);
    }));

    $$("[data-theme-set]").forEach((b) => b.addEventListener("click", () => {
      applyTheme(b.dataset.themeSet);
      $$("[data-theme-set]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    }));
  },
};

/* ==========================================================================
   boot
   ========================================================================== */

async function boot() {
  const me = await api("/dashboard/api/me", { quiet: true });
  if (me.__error) { location.href = "/dashboard/login"; return; }
  state.me = me;

  $("#meName").textContent = me.username;
  $("#meAvatar").textContent = (me.username || "؟").slice(0, 1).toUpperCase();

  buildNav();
  $("#boot").remove();
  $("#app").hidden = false;

  go(location.hash.slice(1) || "overview");
  loadStatus();

  // Badges are business state, not page state: they stay current while
  // someone sits on a page that has nothing to do with them.
  setInterval(async () => {
    if (document.visibilityState !== "visible") return;
    const inbox = await api("/dashboard/api/inbox?status=needs_reply", { quiet: true });
    if (!inbox.__error) setBadge("inbox", inbox.counts.needs_reply || 0);
    const queue = await api("/dashboard/api/queue", { quiet: true });
    if (!queue.__error) setBadge("queue", queue.items.length, "warn");
  }, 60000);
}

boot();

</script>
