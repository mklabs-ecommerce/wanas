name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both ends of what this repo actually runs on, for the same reason
        # requirements.txt pins its dependencies: the build that ships must be
        # the build that was tested. 3.11 is the floor pyproject.toml declares;
        # 3.13 is what Railway's builder resolves and what production is
        # running right now (`.python-version` pins it so a new builder release
        # cannot move it without this file moving too). Testing only the floor
        # left the deployed interpreter untested.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest tests/ -q
        env:
          # Explicitly blank so a runner with any of these set cannot make the
          # suite talk to a real model, a real store, or a real phone number.
          LLM_PROVIDER: fake
          LLM_API_KEY: ""
          SHOPIFY_STORE_DOMAIN: ""
          SHOPIFY_ADMIN_TOKEN: ""

  postgres:
    # The order transaction is the thing worth proving on the real database:
    # SQLite and Postgres do not serialise a concurrent decrement the same way.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wanas
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # The version production runs: the concurrency this job exists to
          # prove is the one that has to hold on the deployed interpreter.
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest tests/ -q
        env:
          # The deliberate opt-in that lets the suite run on (and drop the
          # schema of) this job's own throwaway PostgreSQL service. A plain
          # DATABASE_URL is ignored by tests/conftest.py by design.
          WANAS_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/wanas
          LLM_PROVIDER: fake
