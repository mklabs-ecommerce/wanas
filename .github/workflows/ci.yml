name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest tests/ -q
        env:
          # Explicitly blank so a runner with any of these set cannot make the
          # suite talk to a real model, a real store, or a real phone number.
          LLM_PROVIDER: fake
          LLM_API_KEY: ""
          SHOPIFY_STORE_DOMAIN: ""
          SHOPIFY_ADMIN_TOKEN: ""

  postgres:
    # The order transaction is the thing worth proving on the real database:
    # SQLite and Postgres do not serialise a concurrent decrement the same way.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wanas
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest tests/ -q
        env:
          # The deliberate opt-in that lets the suite run on (and drop the
          # schema of) this job's own throwaway PostgreSQL service. A plain
          # DATABASE_URL is ignored by tests/conftest.py by design.
          WANAS_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/wanas
          LLM_PROVIDER: fake
